agenvas.llm.scheduler-enabled=false
agenvas.provider.mock.scheduler-enabled=false
agenvas.provider.mock.video-scheduler-enabled=false
agenvas.provider.media.scheduler-enabled=false
agenvas.export.scheduler-enabled=false
# Docker Desktop's forwarded PostgreSQL port can close one startup handshake while many
# Testcontainers contexts start in sequence. Retry only test pool initialization; production
# connection behavior remains unchanged and migration failures still fail the test.
spring.datasource.hikari.initialization-fail-timeout=60000
