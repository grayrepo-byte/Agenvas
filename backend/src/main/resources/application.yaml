spring:
  application:
    name: agenvas-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${AGENVAS_DB_URL:jdbc:postgresql://localhost:5432/agenvas}
    username: ${AGENVAS_DB_USER:agenvas}
    password: ${AGENVAS_DB_PASSWORD:agenvas}
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 12h
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 501MB
  ai:
    mcp:
      server:
        # Explicit registration below prevents exporting internal Agent tools automatically.
        enabled: false
    model:
      chat: ${AGENVAS_LLM_CHAT_ADAPTER:none}
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
    openai:
      base-url: ${AGENVAS_LLM_BASE_URL:https://api.openai.com}
      api-key: ${AGENVAS_LLM_API_KEY:}
      chat:
        model: ${AGENVAS_LLM_MODEL:}

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${AGENVAS_SECURE_COOKIES:false}

logging:
  level:
    # Upstream transport/handler diagnostics can include malformed request bodies or client-controlled metadata.
    org.springframework.ai.mcp: "OFF"
    io.modelcontextprotocol: "OFF"
  structured:
    format:
      console: ecs

management:
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.95
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: ${AGENVAS_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${AGENVAS_OPENAPI_ENABLED:false}

agenvas:
  mcp:
    enabled: ${AGENVAS_MCP_ENABLED:true}
  recovery-mode: ${AGENVAS_RECOVERY_MODE:false}
  media-templates:
    sync-enabled: ${AGENVAS_PROMPT_SYNC_ENABLED:true}
    scan-delay-ms: 60000
  credentials:
    master-key-base64: ${AGENVAS_CREDENTIAL_MASTER_KEY:}
    key-version: ${AGENVAS_CREDENTIAL_KEY_VERSION:1}
    previous-keys: ${AGENVAS_CREDENTIAL_PREVIOUS_KEYS:}
  settings:
    llm:
      allow-loopback-http: ${AGENVAS_LLM_ALLOW_LOOPBACK_HTTP:false}
  llm:
    mode: ${AGENVAS_LLM_MODE:mock}
    config-version: ${AGENVAS_LLM_CONFIG_VERSION:1}
    tool-calling-verified: ${AGENVAS_LLM_TOOL_CALLING_VERIFIED:false}
    scheduler-enabled: ${AGENVAS_LLM_SCHEDULER_ENABLED:true}
    agent:
      context-window-tokens: ${AGENVAS_AGENT_CONTEXT_WINDOW_TOKENS:1000000}
      compaction-threshold-percent: ${AGENVAS_AGENT_COMPACTION_THRESHOLD_PERCENT:50}
      response-reserve-tokens: ${AGENVAS_AGENT_RESPONSE_RESERVE_TOKENS:8192}
      summary-tokens: ${AGENVAS_AGENT_SUMMARY_TOKENS:2048}
      recent-tool-rounds: ${AGENVAS_AGENT_RECENT_TOOL_ROUNDS:4}
      recovery-window: ${AGENVAS_AGENT_RECOVERY_WINDOW:24h}
      max-model-retries: ${AGENVAS_AGENT_MAX_MODEL_RETRIES:288}
      retry-max-delay: ${AGENVAS_AGENT_RETRY_MAX_DELAY:5m}
      max-repair-attempts: ${AGENVAS_AGENT_MAX_REPAIR_ATTEMPTS:4}
  task:
    # 租约必须同时覆盖两件事：整次同步 Provider 调用，以及客户端的超时上限
    # （OpenAiImage2Client / GoogleNanoBananaClient 均为 5 分钟）。短于调用耗时的租约会让
    # 已生成的结果在写回时被恢复扫描判为 UNKNOWN 并丢弃；短于客户端超时的租约则会让
    # 「当场按原因码判定」失效，退化为兜底扫描的笼统码。默认 30 分钟同时满足两者。
    lease-duration: ${AGENVAS_TASK_LEASE_DURATION:PT30M}
  provider:
    mode: ${AGENVAS_PROVIDER_MODE:mock}
    mock:
      fixture: ${AGENVAS_MOCK_FIXTURE:SUCCESS}
    local-image:
      depth-model: ${AGENVAS_DEPTH_MODEL:}
  storage:
    root: ${AGENVAS_STORAGE_ROOT:data/assets}
