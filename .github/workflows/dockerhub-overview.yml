name: Docker Hub Overview

on:
  pull_request:
    paths:
      - 'docs/dockerhub/**'
      - 'docker-compose.yml'
      - '.github/workflows/dockerhub-overview.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/test_dockerhub_overview.py'
      - '.github/scripts/test_ci.py'
  push:
    branches: [main]
    paths:
      - 'docs/dockerhub/**'
      - 'docker-compose.yml'
      - '.github/workflows/dockerhub-overview.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/test_dockerhub_overview.py'
      - '.github/scripts/test_ci.py'
  workflow_dispatch:

permissions:
  contents: read

# Serialize updates for main without interrupting a partially completed sync.
concurrency:
  group: dockerhub-overview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Overview inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test credential preflight without secrets or network access
        run: python3 -m unittest discover -s .github/scripts -p 'test_dockerhub_overview.py'
      - name: Check both Overviews are present
        run: |
          test -s docs/dockerhub/server.md
          test -s docs/dockerhub/web.md
      - name: Validate the documented single-file installation
        run: docker compose --env-file /dev/null -f docker-compose.yml config --quiet

  sync:
    name: Sync ${{ matrix.repository }} Overview
    needs: [validate]
    # PRs, forks, tags, and manual runs on other branches never receive credentials.
    if: >-
      github.repository == 'grayrepo-byte/Agenvas' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: grayrepo/agenvas-server
            readme: docs/dockerhub/server.md
            description: 'Agenvas backend: a self-hosted AI creative canvas for text, images, video, audio, and agents.'
          - repository: grayrepo/agenvas-web
            readme: docs/dockerhub/web.md
            description: 'Agenvas web UI and reverse proxy for the self-hosted AI creative canvas.'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Docker Hub description credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'Set repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; see docs/operations/dockerhub-overview.md for description-update permissions.' >&2
            exit 1
          fi
      - name: Update Docker Hub short description and Overview
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ matrix.repository }}
          short-description: ${{ matrix.description }}
          readme-filepath: ${{ matrix.readme }}
