name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAMESPACE: grayrepo
  # Docker Hub uploads are tag-only; branch pushes still build and inventory images, but never publish.
  PUBLISH_IMAGES: ${{ github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:generate
      - name: Verify generated API types are committed
        run: git diff --exit-code -- src/shared/api/schema.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install local media tools required by PostgreSQL integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      # 生成源码入库、构建期不连数据库（见 ADR 0012），因此漂移只能在这里发现：
      # 对一次性 PostgreSQL 重跑迁移 + codegen，生成结果必须与提交内容完全一致。
      - name: Verify jOOQ generated sources match migrations
        run: |
          docker run -d --name agenvas-jooq-codegen \
            -e POSTGRES_DB=agenvas -e POSTGRES_USER=agenvas \
            -e POSTGRES_PASSWORD=codegen-only -p 55432:5432 postgres:17.11-alpine
          for _ in $(seq 1 30); do
            if docker exec agenvas-jooq-codegen pg_isready -U agenvas -d agenvas >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          ./mvnw --batch-mode --no-transfer-progress -Pjooq-codegen generate-sources
          # 用 porcelain 而非 git diff：新增表会产生未跟踪文件，git diff 看不到。
          if [ -n "$(git status --porcelain -- src/jooq/java)" ]; then
            echo 'src/jooq/java 与迁移不一致，请重新生成并提交：' >&2
            git status --porcelain -- src/jooq/java >&2
            exit 1
          fi

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify image, source, and Mock Compose environments
        run: bash deploy/check-compose.sh
      - name: Test automatic installation secrets with isolated PostgreSQL volumes
        run: python3 deploy/test-installation-secrets.py

  security-source:
    name: Source secret scan
    runs-on: ubuntu-latest
    env:
      # Secret scanning must not resolve Maven dependencies over the network.
      TRIVY_OFFLINE_SCAN: 'true'
    steps:
      # This job runs on fork PRs. Do not pass Provider or deployment secrets to it.
      - uses: actions/checkout@v4
      - name: Reject committed secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'

  security-images:
    name: Image build and inventory (${{ matrix.service }}, ${{ matrix.architecture }})
    needs: [frontend, backend, compose-config, security-source]
    runs-on: ${{ matrix.runner }}
    env:
      TRIVY_OFFLINE_SCAN: 'true'
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        service: [server, web, postgres]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - service: server
            image: agenvas-server:ci
            dockerfile: deploy/docker/server.Dockerfile
          - service: web
            image: agenvas-web:ci
            dockerfile: deploy/docker/frontend.Dockerfile
          - service: postgres
            image: postgres:17.11-alpine
            dockerfile: ''
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Hub publishing configuration
        if: env.PUBLISH_IMAGES == 'true' && matrix.dockerfile != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'Set repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN before publishing.' >&2
            exit 1
          fi
      - name: Build application image on the native architecture
        id: build
        if: matrix.dockerfile != ''
        env:
          IMAGE_DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_LOCAL: ${{ matrix.image }}
        run: |
          docker build --file "$IMAGE_DOCKERFILE" --tag "$IMAGE_LOCAL" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Pull the official PostgreSQL image on the native architecture
        id: pull
        if: matrix.dockerfile == ''
        env:
          IMAGE_PUBLIC: ${{ matrix.image }}
        run: docker pull "$IMAGE_PUBLIC"
      - name: Generate release image SBOM
        if: always() && (steps.build.outcome == 'success' || steps.pull.outcome == 'success')
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ matrix.image }}
          # Only collect packages/licenses; do not re-enable vulnerability scanning.
          scanners: license
          format: cyclonedx
          output: sbom-${{ matrix.service }}.json
          exit-code: '0'
      - name: Generate license inventory
        if: always() && (steps.build.outcome == 'success' || steps.pull.outcome == 'success')
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          image-ref: ${{ matrix.image }}
          scanners: license
          format: json
          output: licenses-${{ matrix.service }}.json
          exit-code: '0'
      - name: Keep SBOM and license inventory for release review
        if: always() && (steps.build.outcome == 'success' || steps.pull.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.service }}-${{ matrix.architecture }}
          path: |
            sbom-${{ matrix.service }}.json
            licenses-${{ matrix.service }}.json
          if-no-files-found: error
      # Publish the exact inventoried local image; do not rebuild after collecting its SBOM.
      # PRs (including forks) never execute the credential-bearing steps.
      - name: Log in to Docker Hub
        if: env.PUBLISH_IMAGES == 'true' && matrix.dockerfile != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push architecture image for this workflow run
        if: env.PUBLISH_IMAGES == 'true' && matrix.dockerfile != ''
        env:
          IMAGE_LOCAL: ${{ matrix.image }}
          IMAGE_SERVICE: ${{ matrix.service }}
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image_staging="docker.io/$IMAGE_NAMESPACE/agenvas-$IMAGE_SERVICE:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$IMAGE_ARCHITECTURE"
          docker tag "$IMAGE_LOCAL" "$image_staging"
          docker push "$image_staging"

  publish-dockerhub:
    # Release tags appear only after every service and architecture passes all existing gates.
    needs: [security-images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [server, web]
    steps:
      - name: Set up Docker Buildx for multi-platform manifests
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Select latest, release, and commit tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE }}/agenvas-${{ matrix.service }}
          # latest floats only for stable version tags; a prerelease suffix must never move the rolling channel.
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}
      - name: Publish manifests from the built architecture images
        env:
          IMAGE_NAME: docker.io/${{ env.IMAGE_NAMESPACE }}/agenvas-${{ matrix.service }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          image_tag_args=()
          while IFS= read -r image_tag; do
            if [[ -n "$image_tag" ]]; then
              image_tag_args+=(--tag "$image_tag")
            fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${image_tag_args[@]}" \
            "$IMAGE_NAME:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" \
            "$IMAGE_NAME:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
          printf 'Published amd64/arm64 tags:\n%s\n' "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
