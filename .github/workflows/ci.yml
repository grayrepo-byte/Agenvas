name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAMESPACE: grayrepo
  # Only version-tag runs can access publishing credentials or upload images.
  PUBLISH_IMAGES: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

jobs:
  changes:
    name: Plan CI
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.plan.outputs.code_changed }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify planning, shard coverage, and gate failure handling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Plan validation and native image matrix
        id: plan
        run: python3 .github/scripts/ci.py plan

  frontend:
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:generate
      - name: Verify generated API types are committed
        run: git diff --exit-code -- src/shared/api/schema.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # TypeScript was already checked above; local pnpm build still includes it.
      - run: pnpm build:ci

  backend-unit:
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests only
        run: ./mvnw --batch-mode --no-transfer-progress test
      - name: Retain failed unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  backend-integration:
    name: Backend integration (shard ${{ matrix.shard }})
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install local media tools required by PostgreSQL integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run the shard with isolated PostgreSQL containers
        env:
          IT_SHARD: ${{ matrix.shard }}
        run: |
          integration_classes=$(python3 ../.github/scripts/ci.py shard "$IT_SHARD" 4)
          ./mvnw --batch-mode --no-transfer-progress -Pci-integration \
            "-Dit.test=$integration_classes" verify
      - name: Retain failed integration test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-reports-${{ matrix.shard }}
          path: backend/target/failsafe-reports/
          retention-days: 7

  jooq-codegen:
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify jOOQ generated sources match migrations
        run: bash ../.github/scripts/check-jooq.sh

  compose-config:
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify image, source, and Mock Compose environments
        run: bash deploy/check-compose.sh
      - name: Test automatic installation secrets with isolated PostgreSQL volumes
        run: python3 deploy/test-installation-secrets.py

  security-source:
    name: Source secret scan
    runs-on: ubuntu-latest
    env:
      # Secret scanning must not resolve Maven dependencies over the network.
      TRIVY_OFFLINE_SCAN: 'true'
    steps:
      # Runs even for documentation-only and fork PRs, without deployment secrets.
      - uses: actions/checkout@v4
      - name: Reject committed secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'

  security-images:
    name: Image build (${{ matrix.service }}, ${{ matrix.architecture }})
    # Image compilation can run alongside tests; only CI Gate may authorize final tags.
    needs: [changes]
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      TRIVY_OFFLINE_SCAN: 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        if: matrix.dockerfile != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build application image on the native architecture
        id: build
        if: matrix.dockerfile != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: ${{ matrix.image }}
          pull: true
          build-args: ${{ matrix.service == 'server' && 'VERIFY_DEPTH_MODEL=true' || '' }}
          # Cache compilation/dependencies, while still refreshing runtime apt/apk packages.
          no-cache-filters: runtime
          cache-from: type=gha,version=2,scope=${{ matrix.service }}-${{ matrix.architecture }}
          # All PRs, including forks, only read caches. Trusted runs warm them.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,version=2,mode=max,scope={0}-{1}', matrix.service, matrix.architecture) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Pull the official PostgreSQL release image on the native architecture
        id: pull
        if: matrix.dockerfile == ''
        env:
          IMAGE_PUBLIC: ${{ matrix.image }}
        run: docker pull "$IMAGE_PUBLIC"
      - name: Collect release packages and licenses once
        id: inventory
        if: env.PUBLISH_IMAGES == 'true'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ matrix.image }}
          scanners: license
          list-all-pkgs: 'true'
          format: json
          output: licenses-${{ matrix.service }}.json
          exit-code: '0'
      - name: Convert the collected inventory to CycloneDX without rescanning
        if: env.PUBLISH_IMAGES == 'true'
        env:
          IMAGE_SERVICE: ${{ matrix.service }}
        run: trivy convert --format cyclonedx --output "sbom-$IMAGE_SERVICE.json" "licenses-$IMAGE_SERVICE.json"
      - name: Keep release SBOM and license inventory
        if: always() && env.PUBLISH_IMAGES == 'true' && steps.inventory.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.service }}-${{ matrix.architecture }}
          path: |
            sbom-${{ matrix.service }}.json
            licenses-${{ matrix.service }}.json
          if-no-files-found: error
          # Release evidence should not expire as quickly as transient failure reports.
          retention-days: 90
      - name: Archive the validated architecture image for gated publication
        if: env.PUBLISH_IMAGES == 'true' && matrix.dockerfile != ''
        env:
          IMAGE_LOCAL: ${{ matrix.image }}
        run: |
          set -o pipefail
          docker save "$IMAGE_LOCAL" | gzip -1 > image.tar.gz
      - name: Retain the exact architecture image until publication
        if: env.PUBLISH_IMAGES == 'true' && matrix.dockerfile != ''
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ matrix.architecture }}
          path: image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, frontend, backend-unit, backend-integration, jooq-codegen, compose-config, security-source, security-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every planned check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci.py gate

  push-images:
    name: Push validated image (${{ matrix.service }}, ${{ matrix.architecture }})
    needs: [ci-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [server, web]
        architecture: [amd64, arm64]
    steps:
      - name: Validate Docker Hub publishing configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'Set repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN before publishing.' >&2
            exit 1
          fi
      - name: Download the exact inventoried architecture image
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}-${{ matrix.architecture }}
      - name: Load the image without rebuilding
        run: |
          set -o pipefail
          gzip -dc image.tar.gz | docker load
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push architecture image for this workflow run
        env:
          IMAGE_SERVICE: ${{ matrix.service }}
          IMAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image_staging="docker.io/$IMAGE_NAMESPACE/agenvas-$IMAGE_SERVICE:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$IMAGE_ARCHITECTURE"
          docker tag "agenvas-$IMAGE_SERVICE:ci" "$image_staging"
          docker push "$image_staging"

  publish-dockerhub:
    needs: [push-images]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [server, web]
    steps:
      - name: Set up Docker Buildx for multi-platform manifests
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Select latest, release, and commit tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE }}/agenvas-${{ matrix.service }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}
      - name: Publish manifests from the built architecture images
        env:
          IMAGE_NAME: docker.io/${{ env.IMAGE_NAMESPACE }}/agenvas-${{ matrix.service }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          image_tag_args=()
          while IFS= read -r image_tag; do
            if [[ -n "$image_tag" ]]; then
              image_tag_args+=(--tag "$image_tag")
            fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${image_tag_args[@]}" \
            "$IMAGE_NAME:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" \
            "$IMAGE_NAME:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
          printf 'Published amd64/arm64 tags:\n%s\n' "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Publish GitHub Release and notes
    needs: [ci-gate, publish-dockerhub]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate version changes and publish release metadata without rebuilding images
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release.py publish "$RELEASE_TAG"
