name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:generate
      - name: Verify generated API types are committed
        run: git diff --exit-code -- src/shared/api/schema.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install local media tools required by PostgreSQL integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      # 生成源码入库、构建期不连数据库（见 ADR 0012），因此漂移只能在这里发现：
      # 对一次性 PostgreSQL 重跑迁移 + codegen，生成结果必须与提交内容完全一致。
      - name: Verify jOOQ generated sources match migrations
        run: |
          docker run -d --name agenvas-jooq-codegen \
            -e POSTGRES_DB=agenvas -e POSTGRES_USER=agenvas \
            -e POSTGRES_PASSWORD=codegen-only -p 55432:5432 postgres:17.11-alpine
          for _ in $(seq 1 30); do
            if docker exec agenvas-jooq-codegen pg_isready -U agenvas -d agenvas >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          ./mvnw --batch-mode --no-transfer-progress -Pjooq-codegen generate-sources
          # 用 porcelain 而非 git diff：新增表会产生未跟踪文件，git diff 看不到。
          if [ -n "$(git status --porcelain -- src/jooq/java)" ]; then
            echo 'src/jooq/java 与迁移不一致，请重新生成并提交：' >&2
            git status --porcelain -- src/jooq/java >&2
            exit 1
          fi

  compose-config:
    runs-on: ubuntu-latest
    env:
      AGENVAS_DB_PASSWORD: ci-isolated-database-password
      AGENVAS_BOOTSTRAP_SECRET: ci-isolated-bootstrap-secret-2026
    steps:
      - uses: actions/checkout@v4
      - name: Reject missing required installation secrets
        run: |
          for compose_file in deploy/compose.yaml deploy/compose.dev.yaml; do
            if env -u AGENVAS_DB_PASSWORD docker compose -f "$compose_file" config --quiet >/dev/null 2>&1; then
              echo "$compose_file accepted a missing database password" >&2
              exit 1
            fi
            if env -u AGENVAS_BOOTSTRAP_SECRET docker compose -f "$compose_file" config --quiet >/dev/null 2>&1; then
              echo "$compose_file accepted a missing bootstrap secret" >&2
              exit 1
            fi
          done
      - name: Verify deployment and development defaults
        run: |
          docker compose -f deploy/compose.yaml config --format json |
            jq -e '.name == "agenvas" and
              .services.server.environment.AGENVAS_LLM_MODE == "configured" and
              .services.server.environment.AGENVAS_PROVIDER_MODE == "configured" and
              .volumes."postgres-data".name == "agenvas_postgres-data" and
              .volumes."asset-data".name == "agenvas_asset-data"'
          AGENVAS_LLM_MODE=configured AGENVAS_PROVIDER_MODE=comfyui \
            docker compose -f deploy/compose.dev.yaml config --format json |
            jq -e '.name == "agenvas-dev" and
              .services.server.environment.AGENVAS_LLM_MODE == "mock" and
              .services.server.environment.AGENVAS_PROVIDER_MODE == "mock" and
              .volumes."postgres-data".name == "agenvas-dev_postgres-data" and
              .volumes."asset-data".name == "agenvas-dev_asset-data"'
      - name: Verify bounded resources, log rotation, and shutdown window
        run: |
          for compose_file in deploy/compose.yaml deploy/compose.dev.yaml; do
            docker compose -f "$compose_file" config --format json |
              jq -e '([.services.postgres, .services.server, .services.web] |
                all(.[]; (.mem_limit | tonumber) > 0 and .cpus > 0 and
                  .logging.driver == "json-file" and
                  .logging.options."max-size" == "10m" and
                  .logging.options."max-file" == "3" and
                  all(.ports[]; .host_ip == "127.0.0.1"))) and
                .services.server.read_only and .services.web.read_only and
                .services.server.stop_grace_period == "45s"'
          done
          AGENVAS_SERVER_MEMORY_LIMIT=2g AGENVAS_SERVER_CPUS=3.0 \
            docker compose -f deploy/compose.yaml config --format json |
            jq -e '.services.server.mem_limit == "2147483648" and
              .services.server.cpus == 3'
      - name: Verify explicit candidate Provider overrides reach the server
        run: |
          AGENVAS_LLM_MODE=configured \
          AGENVAS_PROVIDER_MODE=comfyui \
          AGENVAS_PROVIDER_CONFIG_VERSION=2 \
          AGENVAS_COMFYUI_ENDPOINT=http://192.168.1.20:8188 \
          AGENVAS_COMFYUI_IMAGE_CHECKPOINT=test.safetensors \
          AGENVAS_SECURE_COOKIES=true \
          docker compose -f deploy/compose.yaml config --format json |
            jq -e '.services.server.environment |
              .AGENVAS_LLM_MODE == "configured" and
              .AGENVAS_PROVIDER_MODE == "comfyui" and
              .AGENVAS_PROVIDER_CONFIG_VERSION == "2" and
              .AGENVAS_COMFYUI_ENDPOINT == "http://192.168.1.20:8188" and
              .AGENVAS_COMFYUI_IMAGE_CHECKPOINT == "test.safetensors" and
              .AGENVAS_SECURE_COOKIES == "true"'

  security-source:
    runs-on: ubuntu-latest
    env:
      # Avoid Maven Central lookups during PR scans; image scans inspect the bundled JAR.
      TRIVY_OFFLINE_SCAN: 'true'
    steps:
      # This job runs on fork PRs. Do not pass Provider or deployment secrets to it.
      - uses: actions/checkout@v4
      - name: Reject committed secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
      - name: Check source dependencies for high-risk vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

  security-images:
    runs-on: ubuntu-latest
    env:
      TRIVY_OFFLINE_SCAN: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            image: agenvas-server:ci
            dockerfile: deploy/docker/server.Dockerfile
            skipFile: ''
          - service: web
            image: agenvas-web:ci
            dockerfile: deploy/docker/frontend.Dockerfile
            skipFile: ''
          - service: postgres
            image: agenvas-postgres:ci
            dockerfile: deploy/docker/postgres.Dockerfile
            # The final filesystem has this symlink to su-exec, but Trivy also
            # scans the deleted upstream gosu binary from a lower image layer.
            skipFile: usr/local/bin/gosu
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        id: build
        if: matrix.dockerfile != ''
        run: docker build --file "${{ matrix.dockerfile }}" --tag "${{ matrix.image }}" .
      - name: Check release image for high-risk vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          skip-files: ${{ matrix.skipFile }}
          exit-code: '1'
      - name: Generate release image SBOM
        if: always() && (matrix.dockerfile == '' || steps.build.outcome == 'success')
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          image-ref: ${{ matrix.image }}
          format: cyclonedx
          skip-files: ${{ matrix.skipFile }}
          output: sbom-${{ matrix.service }}.json
          exit-code: '0'
      - name: Generate license inventory
        if: always() && (matrix.dockerfile == '' || steps.build.outcome == 'success')
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          skip-setup-trivy: true
          image-ref: ${{ matrix.image }}
          scanners: license
          format: json
          skip-files: ${{ matrix.skipFile }}
          output: licenses-${{ matrix.service }}.json
          exit-code: '0'
      - name: Keep SBOM and license inventory for release review
        if: always() && (matrix.dockerfile == '' || steps.build.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.service }}
          path: |
            sbom-${{ matrix.service }}.json
            licenses-${{ matrix.service }}.json
          if-no-files-found: error
