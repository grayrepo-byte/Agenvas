    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: taskId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getTask
      summary: 获取一个持久化 Task 的状态
      tags: [Tasks]
      responses:
        "200":
          description: Task 状态与归一化结果
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/tasks/{taskId}/new-attempt:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: taskId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: createManualUnknownAttempt
      summary: 为结果未知或已受理但阻断的直连媒体任务创建独立的新尝试
      description: 仅接受未取消的 UNKNOWN（无外部请求 ID）或 BLOCKED（已有外部请求 ID）直连媒体任务。重试创建新的生成任务并独立预留用量；保留原任务、请求 ID、输入与费用记录，原任务不再占用发起卡片。不会恢复原请求查询。已变化的任务版本或能力配置返回冲突。
      tags: [Tasks]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 120}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ManualUnknownAttemptRequest"}
      responses:
        "200":
          description: 新尝试；同幂等键重放返回相同任务，原任务和用量预留仍保留
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
