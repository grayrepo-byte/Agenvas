                workflowJson: {type: string, minLength: 1, maxLength: 262144, description: API export or prompt envelope; UTF-8 bytes also limited to 256 KiB. UI-format JSON is rejected.}
      responses:
        "200":
          description: Normalized candidate graph; no provider calls or persistence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComfyUiGraph'}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422":
          description: Invalid graph or connection type
