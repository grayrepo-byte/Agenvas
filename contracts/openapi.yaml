        kind: {type: string, enum: [IMAGE_GENERATION, VIDEO_GENERATION, AUDIO_GENERATION]}
        minimumSeconds: {type: integer, minimum: 0}
        maximumSeconds: {type: integer, minimum: 0}
        realGenerationTested: {type: boolean}
        settings: {$ref: "#/components/schemas/FixedMediaAdapterSettings"}
    TaskKind:
      type: string
      enum: [AGENT_TURN, TEXT_GENERATION, IMAGE_GENERATION, VIDEO_GENERATION, AUDIO_GENERATION]
    TaskStatus:
      type: string
      enum: [READY, RUNNING, SUBMITTING, WAITING_PROVIDER, UNKNOWN, BLOCKED, SUCCEEDED, FAILED, CANCELED]
    ManualUnknownAttemptRequest:
      type: object
      additionalProperties: false
      required: [expectedTaskVersion]
      properties:
        expectedTaskVersion: {type: integer, format: int64, minimum: 0}
    VideoPromptOptimizationRequest:
      type: object
      additionalProperties: false
      required: [prompt, maxLength]
      properties:
        prompt: {type: string, minLength: 1, maxLength: 22000, description: "当前本地提示词，结构化提及转为 [[REF_n]] 占位符；不自动读取服务器草稿"}
        maxLength: {type: integer, minimum: 1, maximum: 20000}
        skill:
          oneOf:
            - {$ref: "#/components/schemas/SkillVersionRef"}
            - {type: "null"}
          description: 可选的已发布方法版本；只使用主说明与文字附件，不继承导演默认 Skill
    ImagePromptRequest:
      type: object
      additionalProperties: false
      required: [canvasItemId, sourceVersionId, expectedCanvasItemVersion]
      properties:
        canvasItemId: {type: string, format: uuid}
        sourceVersionId: {type: string, format: uuid}
        expectedCanvasItemVersion: {type: integer, format: int64, minimum: 0}
    Task:
      type: object
      additionalProperties: false
      required: [id, projectId, runId, stepKey, kind, status, cancelRequested, input, attemptNo, nextActionAt, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        runId: {type: [string, "null"], format: uuid}
        stepKey: {type: string}
        kind: {$ref: "#/components/schemas/TaskKind"}
        status: {$ref: "#/components/schemas/TaskStatus"}
        cancelRequested: {type: boolean, description: "已要求停止本系统后续编排，不表示外部任务已停止或退款"}
        input:
          type: object
          additionalProperties: true
          properties:
            mediaInput: {$ref: "#/components/schemas/MediaFrozenInput"}
        output:
          description: |
            AGENT_TURN 执行中的 assistantStream 为持久公开回答进度，结构为
            AssistantTurnStream；这不是已提交的工具响应。完整回合提交后
            assistantText 为最终公开文本。失败或取消保留 INTERRUPTED 文本。
            modelRetry 是 AgentModelRetry 投影；READY 使用 nextActionAt 显示下次重试时间。
            内部上下文压缩完成时 contextCompacted=true；不包含 assistantText、assistantStream 或交接摘要正文。
            媒体故障或恢复中可包含有界 providerFailure 诊断；成功后使用实际归档结果，不保留旧故障正文。
            TEXT_GENERATION 的 IMAGE_REVERSE_PROMPT 用途成功时返回 prompt、sourceVersionId、mock；schema 5 另有 artifactId、artifactVersionId 及 canvasItemId（已删除项目省略节点 ID），schema 3 保持结果文本而不补卡；VIDEO_PROMPT_OPTIMIZATION 仅返回 prompt、mock，其他状态 output=null；不返回请求、模型完整响应或私有推理。
          oneOf:
            - type: object
              additionalProperties: true
              properties:
                prompt: {type: string, description: 反推或优化的原始提示词；文字卡片的后续编辑从产物版本读取。}
                sourceVersionId: {type: string, format: uuid, description: 反推时固定的来源图片版本。}
                mock: {type: boolean}
                artifactId: {type: string, format: uuid}
                artifactVersionId: {type: string, format: uuid}
                canvasItemId: {type: string, format: uuid, description: 已创建的结果节点；重放不重建已移除节点。}
                modelRetry: {$ref: "#/components/schemas/AgentModelRetry"}
                providerFailure: {$ref: "#/components/schemas/ProviderFailure"}
                contextCompacted: {type: boolean, description: 内部上下文压缩已完成；不代表创作任务完成。}
            - {type: "null"}
        providerRequestId: {type: [string, "null"], maxLength: 512}
        attemptNo: {type: integer, minimum: 1}
        nextActionAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
        errorCode: {type: [string, "null"], description: "稳定安全原因码；Agent 模型临时故障按 modelRetry 有界重试，达到次数/期限为 LLM_RETRY_EXHAUSTED；固定输入超出上下文预算为 AGENT_CONTEXT_BUDGET_EXCEEDED；媒体提交不自动重试。"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    ProviderFailure:
      type: object
      additionalProperties: false
      description: Bounded provider diagnostic containing only a stage, safe classification, numeric status/code, validated node/field identifiers and optional public moderation labels. Never includes upstream messages, bodies, credentials, media URLs or input values. Retryability of the underlying task remains controlled by its state; a diagnostic never authorizes a new generation.
      required: [stage, category, httpStatus, upstreamCode, nodeId, fieldName]
      properties:
        stage: {type: string, enum: [DISCOVERY, UPLOAD, SUBMIT, POLL, DOWNLOAD]}
        category: {type: string, enum: [AUTHENTICATION, BALANCE, PARAMETER, RATE_LIMIT, UPLOAD, GENERATION, DOWNLOAD_EXPIRED, UNAVAILABLE, PROTOCOL, MODERATION]}
        httpStatus: {type: [integer, "null"], minimum: 100, maximum: 599}
        upstreamCode: {type: [integer, "null"], format: int64, minimum: 0, maximum: 999999999}
        nodeId: {type: [string, "null"], pattern: "^[0-9]{1,32}$"}
        fieldName: {type: [string, "null"], pattern: "^[A-Za-z_][A-Za-z0-9_.]{0,79}$"}
        moderation:
          description: Optional safe public moderation details. Historical tasks may omit this field.
          oneOf:
            - {$ref: "#/components/schemas/ProviderModeration"}
            - {type: "null"}
    ProviderModeration:
      type: object
      additionalProperties: false
      description: Whitelisted public moderation labels for OpenAI image rejection; never contains free text, request IDs or internal classifier details. Unknown stages become unknown and unknown categories become other.
      required: [code, stage, categories]
      properties:
        code: {type: string, enum: [moderation_blocked, content_policy_violation]}
        stage: {type: string, enum: [input, output, unknown]}
        categories:
          type: array
          maxItems: 5
          uniqueItems: true
          items: {type: string, enum: [harassment, self-harm, sexual, violence, other]}
    AgentModelRetry:
      type: object
      additionalProperties: false
      description: "同一固定模型请求的持久退避信息；默认首次失败起 24 小时内最多重试 288 次，可由部署配置调整。首次失败固定次数与截止时间，重启不重置。成功保留历史投影，终态不会继续重试。"
      required: [schemaVersion, retryCount, maxRetries, firstFailureAt, deadlineAt, lastErrorCode]
      properties:
        schemaVersion: {type: integer, const: 1}
        retryCount: {type: integer, minimum: 1, maximum: 10000}
        maxRetries: {type: integer, minimum: 1, maximum: 10000}
        firstFailureAt: {type: string, format: date-time}
        deadlineAt: {type: string, format: date-time}
        lastErrorCode: {type: string, enum: [LLM_CALL_TIMEOUT, LLM_CONNECTION_FAILED, LLM_RATE_LIMITED, LLM_SERVICE_UNAVAILABLE]}
    AssistantTurnStream:
      type: object
      additionalProperties: false
      required: [streamEpoch, chunkIndex, text, status]
      properties:
        streamEpoch: {type: integer, format: int64, minimum: 0, description: 任务本次租约身份；更高 epoch 重置旧文本。}
        chunkIndex: {type: integer, format: int64, minimum: 0, description: 本次流的已持久增量序号。}
        text: {type: string, description: 累计公开回答；不含私有推理或工具参数。}
        status: {type: string, enum: [STREAMING, COMPLETED, INTERRUPTED]}
    AgentTurnStreamEventPayload:
      type: object
      additionalProperties: false
      required: [runId, taskId, stepIndex, streamEpoch, chunkIndex]
      properties:
        runId: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        stepIndex: {type: integer, minimum: 0}
        streamEpoch: {type: integer, format: int64, minimum: 0}
        chunkIndex: {type: integer, format: int64, minimum: 0}
        textDelta: {type: string, description: 仅 delta 事件提供公开文本增量；completed 后重读已提交终稿。}
    CanvasSubjectType:
      type: string
      enum: [ARTIFACT, CHARACTER]
    CanvasItem:
      type: object
      additionalProperties: false
      required: [id, subjectType, subjectId, title, x, y, width, height, zIndex, locked, selectedVersionId, version, selectedVersion, artifact]
      properties:
        id: {type: string, format: uuid}
        subjectType: {$ref: "#/components/schemas/CanvasSubjectType"}
        subjectId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
        locked: {type: boolean}
        selectedVersionId: {type: [string, "null"], format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        selectedVersion:
          oneOf:
            - {$ref: "#/components/schemas/ArtifactVersion"}
            - {type: "null"}
        artifact:
          oneOf:
            - {$ref: "#/components/schemas/Artifact"}
            - {type: "null"}
        characterNode:
          oneOf:
