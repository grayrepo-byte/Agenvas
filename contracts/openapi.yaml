        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: conversationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listConversationRuns
      summary: 按会话消息序号倒序读取一页 Run
      tags: [Runs]
      parameters:
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: 同一会话的 Run 摘要
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentRunList"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/runs:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      operationId: listAgentRuns
      summary: 分页查看一个 Agent 的持久化运行记录
      tags: [Runs]
      parameters:
        - name: agentId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: 不含模型原始消息的运行摘要，按创建时间倒序
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentRunList"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: createRun
      summary: 幂等创建一个持久化 Agent Run
      tags: [Runs]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRunRequest"}
      responses:
        "202":
          description: 新建或精确重放的 Run
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ["true", "false"]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentRun"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceStopping"}
  /api/v1/projects/{projectId}/runs/preflight:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      operationId: getRunPreflight
      summary: 运行前查看模型、精确输入和服务端限额
      description: 在一致性只读快照中核验项目没有活动 Run，再预览会话历史；项目已有活动 Run 时返回 409 ACTIVE_RUN_EXISTS。
      tags: [Runs]
      parameters:
        - name: conversationId
          in: query
          description: 缺省预览 Agent 当前会话；新 Agent 可以没有会话。
          schema: {type: string, format: uuid}
        - name: agentId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: 当前配置与输入范围的只读预览；创建时仍以服务端实时快照为准
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunPreflight"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/runs/{runId}:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: runId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getRun
      summary: 获取 Run、输入快照与策略快照
      tags: [Runs]
      responses:
        "200":
          description: Run 状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentRun"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/runs/{runId}/actions:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: runId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listRunActions
      summary: 列出已提交工具动作的公开摘要
      description: 仅返回服务端生成的业务结果摘要，按 stepIndex、登记时间和 id 排序；不返回模型消息、工具参数、完整结果或私有推理。
      tags: [Runs]
      responses:
        "200":
          description: 最多 40 个已提交动作；尚无动作时返回空数组
          content:
            application/json:
              schema:
                type: array
                maxItems: 40
                items: {$ref: "#/components/schemas/RunAction"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
