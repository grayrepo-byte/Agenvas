      description: 按目标 CanvasItem 查询，不混入同一 Artifact 的其他节点或 Agent 模型回合；排除已被显式新尝试取代的原任务。Agent 任务仅供状态展示，取消排队、队列查询和 UNKNOWN 新尝试仍仅接受直接任务。
