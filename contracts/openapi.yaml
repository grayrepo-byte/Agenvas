openapi: 3.1.0
info:
  title: Agenvas API
  version: 0.1.0
  description: |
    Agenvas 的权威 HTTP 合约。覆盖当前已实现的身份、项目、画布、Agent、计划、Task 与私有素材切片；未实现的 MVP 能力继续按开发清单加入。
    部署者设置 AGENVAS_RECOVERY_MODE=true 后，/api/v1/projects 与 /api/v1/settings 下的非 GET/HEAD/OPTIONS 请求统一返回 HTTP 503 ProblemDetail，code=RECOVERY_MODE_READ_ONLY；身份登录与只读核对仍可用。恢复模式同时关闭后台调度，不能把 503 当作业务版本冲突重试。
    服务端为每次 HTTP 请求生成 X-Request-Id 响应头；ProblemDetail.traceId 与它相同。客户端同名请求头不会被信任或回显。
servers:
  - url: /
paths:
  /api/v1/auth/setup-status:
    get:
      operationId: getSetupStatus
      summary: 查询是否需要初始化管理员
      tags: [Identity]
      security: []
      responses:
        "200":
          description: 初始化状态
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupStatus"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      summary: 获取浏览器写请求所需的 CSRF token
      tags: [Identity]
      security: []
      responses:
        "200":
          description: CSRF token
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CsrfToken"}
  /api/v1/auth/setup:
    post:
      operationId: setupAdministrator
      summary: 一次性创建管理员
      tags: [Identity]
      security: []
      parameters:
        - name: X-Agenvas-Bootstrap-Secret
          in: header
          required: true
          schema: {type: string, minLength: 24, maxLength: 512}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetupRequest"}
      responses:
        "201":
          description: 管理员已创建
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 创建数据库持久化会话
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: 已登录管理员
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 退出并失效当前会话
      tags: [Identity]
      responses:
        "204": {description: 会话已失效}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: 获取当前管理员
      tags: [Identity]
      responses:
        "200":
          description: 当前管理员
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/auth/change-password:
    post:
      operationId: changePassword
      summary: 修改密码并失效其他会话
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangePasswordRequest"}
      responses:
        "204": {description: 密码已修改}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/settings/llm:
    get:
      operationId: getLlmSettings
      summary: 读取管理员模型配置的脱敏状态
      tags: [Settings]
      responses:
        "200":
          description: 配置状态，不包含凭证明文或密文
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LlmSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    put:
      operationId: replaceLlmSettings
      summary: 用完整新凭证替换活动模型配置版本
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReplaceLlmSettingsRequest"}
      responses:
        "200":
          description: 新版本的脱敏状态
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LlmSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/settings/diagnostics:
    get:
      operationId: getSystemDiagnostics
      summary: 读取管理员本地系统诊断，不连接或生成付费 Provider 请求
      tags: [Settings]
      responses:
        "200":
          description: 数据库、存储和 Provider 配置状态及七天内任务错误摘要
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemDiagnostics"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/settings/llm/diagnose:
    post:
      operationId: diagnoseLlmSettings
      summary: 管理员显式发起最多两次可能计费的工具协议诊断
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DiagnoseLlmRequest"}
      responses:
        "200":
          description: 完成诊断后的脱敏配置状态
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LlmSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422":
          description: 模型未完成完整工具协议
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "502":
          description: 模型连接或调用失败
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/settings/media-connections:
    get:
      operationId: getMediaSettings
      summary: 读取脱敏媒体连接、能力及默认值
      tags: [Settings]
      responses:
        "200":
          description: 不含密钥或加密材料的配置状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createMediaConnection
      summary: 幂等创建固定平台连接
      tags: [Settings]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMediaConnectionRequest"}
      responses:
        "200":
          description: 创建或同内容重放后的脱敏配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/settings/media-connections/{connectionId}:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: updateMediaConnection
      summary: 使用 expectedVersion 修改连接并保留历史版本
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMediaConnectionRequest"}
      responses:
        "200":
          description: 修改后的脱敏配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/settings/media-connections/{connectionId}/capabilities:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: createMediaCapability
      summary: 幂等发布一个已安装的固定适配器能力
      tags: [Settings]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMediaCapabilityRequest"}
      responses:
        "200":
          description: 发布后的脱敏配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/settings/media-connections/{connectionId}/capabilities/{capabilityId}:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: capabilityId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: updateMediaCapability
      summary: 使用 expectedVersion 修改能力并保留已发布版本
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMediaCapabilityRequest"}
      responses:
        "200":
          description: 修改后的脱敏配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/settings/media-defaults/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: {type: string, enum: [IMAGE_GENERATION, VIDEO_GENERATION]}
    put:
      operationId: setMediaDefault
      summary: 使用 expectedVersion 设置图片或视频默认能力
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetMediaDefaultRequest"}
      responses:
        "200":
          description: 修改后的脱敏配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: 游标分页列出当前用户项目
      tags: [Projects]
      parameters:
        - {name: includeArchived, in: query, schema: {type: boolean, default: false}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: 项目页
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectList"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    post:
      operationId: createProject
      summary: 创建项目
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateProjectRequest"}
      responses:
        "201":
          description: 项目已创建
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/projects/{projectId}:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      operationId: getProject
      summary: 获取项目概要
      tags: [Projects]
      responses:
        "200":
          description: 项目概要
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateProject
      summary: 乐观更新项目设置
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateProjectRequest"}
      responses:
        "200":
          description: 更新后的项目
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/archive:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      operationId: archiveProject
      summary: 归档项目
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ArchiveProjectRequest"}
      responses:
        "200":
          description: 已归档项目
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/snapshot:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      operationId: getProjectSnapshot
      summary: 获取一致性项目快照与事件水位
      tags: [Projects]
      responses:
        "200":
          description: 同一 REPEATABLE READ 事务中的项目恢复数据
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectSnapshot"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/export-manifest:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      operationId: getProjectExportManifest
      summary: 下载脱敏项目 JSON 与素材元数据清单
      tags: [Exports]
      responses:
        "200":
          description: 同一一致性快照中的白名单项目元数据，不含媒体字节或可复用下载链接
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectExportManifest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/usage:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      operationId: listProjectUsage
      summary: 读取项目的持久用量预留与结算记录
      tags: [Usage]
      responses:
        "200":
          description: 金额未知时保持 null，绝不伪装为零
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/UsageEntry"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/events:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      operationId: streamProjectEvents
      summary: 从项目事件水位之后补发并订阅 SSE
      tags: [Events]
      parameters:
        - name: after
          in: query
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: Last-Event-ID
          in: header
          description: 浏览器自动重连游标；提供时优先于 after
          schema: {type: string, pattern: "^[0-9]+$"}
      responses:
        "200":
          description: 事件使用项目 seq 作为 SSE id，并以业务 type 作为 SSE event 名称；15 秒心跳
          content:
            text/event-stream:
              schema: {type: string}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/projects/{projectId}/assets:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      operationId: uploadImageAsset
      summary: 上传并校验私有 PNG/JPEG/WebP 图片素材
      tags: [Assets]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "201":
          description: 素材已归档
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asset"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {description: 图片超过大小限制}
        "422": {description: 图片格式、解码或像素限制未通过}
  /api/v1/projects/{projectId}/assets/{assetId}/content:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
      - name: assetId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getAssetContent
      summary: 读取私有素材，支持单个字节范围
      tags: [Assets]
      parameters:
        - name: Range
          in: header
          schema: {type: string}
      responses:
        "200":
          description: 完整文件
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
            video/mp4:
              schema: {type: string, format: binary}
        "206": {description: 部分文件，返回 Content-Range}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "416": {description: 请求的字节范围不可用}
    head:
      operationId: headAssetContent
      summary: 查询私有素材的大小及 MIME
      tags: [Assets]
      parameters:
        - name: Range
          in: header
          schema: {type: string}
      responses:
        "200": {description: 文件元数据响应头}
        "206": {description: 部分文件元数据响应头}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "416": {description: 请求的字节范围不可用}
  /api/v1/projects/{projectId}/assets/{assetId}:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
      - name: assetId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getAssetMetadata
      summary: 读取已授权素材的不可变元数据与已验证视频时长
      tags: [Assets]
      responses:
        "200":
          description: 素材元数据
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asset"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/assets/{assetId}/thumbnail:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
      - name: assetId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getAssetThumbnail
      summary: 读取私有、预先生成的小尺寸 PNG 预览
      tags: [Assets]
      responses:
        "200":
          description: 缩略图
          content:
            image/png:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/artifacts:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      operationId: createArtifact
      summary: 幂等创建产物及首个不可变版本
      tags: [Artifacts]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateArtifactRequest"}
      responses:
        "201":
          description: 产物已创建或精确重放
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ["true", "false"]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Artifact"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/artifacts/{artifactId}:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
      - {$ref: "#/components/parameters/ArtifactId"}
    get:
      operationId: getArtifact
      summary: 获取产物及当前选用版本
      tags: [Artifacts]
      responses:
        "200":
          description: 产物详情
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Artifact"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/artifacts/{artifactId}/revisions:
