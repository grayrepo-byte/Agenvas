        enabled: {type: boolean}
        origin: {type: [string, "null"], maxLength: 500, description: "Required full COMFYUI base URL (HTTP or HTTPS host/IP and port; localhost, IPv4/IPv6, private and proxy Fake-IP addresses are supported), including any proxy path and path credential; encrypted server-side. No query, fragment or userinfo. Unchanged redacted COMFYUI origin on update preserves the full saved URL. KLING accepts an HTTP or HTTPS service root with an API Key (AK/SK JWT is not supported). MINIMAX accepts an HTTP or HTTPS service root, defaulting to https://api.minimax.cn. Optional RUNNINGHUB HTTP or HTTPS root without a domain allowlist, or optional OPENAI/GOOGLE HTTP or HTTPS API base URL. GOOGLE preserves explicit API prefixes such as /v1beta; a bare origin uses /v1. Beta requests use generationConfig.imageConfig; stable requests use generationConfig.responseFormat.image."}
        apiKey: {type: [string, "null"], maxLength: 4096, writeOnly: true, description: "Cloud API Key; KLING requires the official API Key, not an AK/SK-generated JWT. Empty on update preserves the pinned credential."}
