    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: runId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getRun
      summary: 获取 Run、输入快照与策略快照
      tags: [Runs]
      responses:
        "200":
          description: Run 状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentRun"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/runs/{runId}/actions:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: runId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listRunActions
      summary: 列出已提交工具动作的公开摘要
      description: 仅返回服务端生成的业务结果摘要，按 stepIndex、登记时间和 id 排序；不返回模型消息、工具参数、完整结果或私有推理。
      tags: [Runs]
      responses:
        "200":
          description: 最多 40 个已提交动作；尚无动作时返回空数组
          content:
            application/json:
              schema:
                type: array
                maxItems: 40
                items: {$ref: "#/components/schemas/RunAction"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/runs/{runId}/media-approvals:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: runId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listAgentMediaApprovals
      summary: 列出本 Run 的媒体生成审批批次
      description: 仅返回同项目、同 Run 的审批与安全生成预览，不包含连接地址、凭据或模型私有消息。
      tags: [Runs]
      responses:
        "200":
          description: 审批列表；尚无审批时返回空数组
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AgentMediaApproval"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/runs/{runId}/media-approvals/{approvalId}:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: runId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: approvalId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getAgentMediaApproval
      summary: 获取媒体审批、固定输出与最终结果
      tags: [Runs]
      responses:
        "200":
          description: 审批状态与安全预览
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentMediaApproval"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/runs/{runId}/media-approvals/{approvalId}/decision:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: runId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: approvalId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: decideAgentMediaApproval
      summary: 以 CAS 和幂等键批准或拒绝整个固定批次
      description: >-
        APPROVE 只授权当前审批快照；重新核验草稿、能力和输入版本后受理持久媒体任务。
        REJECT 不提交 Provider。相同幂等键和请求返回同一审批的当前状态，不重复受理；
        同键不同请求、版本变化或非 PENDING 审批返回冲突。
        尚为 PENDING 的过期审批转为 EXPIRED，返回 200 并通知 Agent。批准前没有第三方生成调用。
      tags: [Runs]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AgentMediaApprovalDecisionRequest"}
      responses:
        "200":
          description: 决策后的审批；媒体生成异步执行
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentMediaApproval"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
