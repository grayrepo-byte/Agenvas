      summary: Import official input rules as a data-only video workflow candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workflowId]
              properties:
                workflowId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$'}
                source: {type: [object, 'null'], additionalProperties: true, description: Optional official detail JSON. Omitted fetches metadata from the fixed official endpoint without credentials. Graphs, node mappings and result URLs are not executed.}
      responses:
        '200':
          description: Candidate only; administrator reviews and explicitly publishes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AutoDlWorkflowDefinition'}
        '422': {description: Problem response, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '502': {description: Problem response, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
