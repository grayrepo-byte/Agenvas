openapi: 3.1.0
info:
  title: Agenvas API
  version: 0.1.0
  description: |
    Agenvas 的权威 HTTP 合约。覆盖当前已实现的身份、项目、画布、Agent、Task 与私有素材切片；未实现的 MVP 能力继续按开发清单加入。
    部署者设置 AGENVAS_RECOVERY_MODE=true 后，/api/v1/projects、/api/v1/settings 与 /api/v1/media-templates 下的非 GET/HEAD/OPTIONS 请求统一返回 HTTP 503 ProblemDetail，code=RECOVERY_MODE_READ_ONLY；身份登录与只读核对仍可用。恢复模式同时关闭后台调度，不能把 503 当作业务版本冲突重试。
    服务端为每次 HTTP 请求生成 X-Request-Id 响应头；ProblemDetail.traceId 与它相同。客户端同名请求头不会被信任或回显。
    所有 API 接受 Accept-Language 语言协商（en、zh、ru、ja，地区变体按基础语言匹配；不支持、缺失或无效时回退 zh，q=0 不选用）。响应携带 Content-Language 与 Vary: Accept-Language，包括认证和 CSRF 错误。Problem 的 title、detail、fieldErrors.message 使用协商语言；code、状态、字段路径、ID 和用户内容不随语言变化。语言偏好仅由浏览器保存，无账号配置 API 或数据库迁移。
servers:
  - url: /
paths:
  /api/v1/media-styles:
    get:
      operationId: listMediaStyles
      summary: 图片与视频的全局风格目录，不返回后台注入提示词
      tags: [Settings]
      responses:
        "200":
          description: 包含停用条目以保留既有选择；Cache-Control no-store
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MediaStyleSummary"}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/media-styles/{styleId}/thumbnail:
    parameters:
      - name: styleId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getMediaStyleThumbnail
      summary: 已登录用户读取风格效果预览
      tags: [Settings]
      responses:
        "200":
          description: 预置 WebP 或实际解码后重新编码的 PNG；Cache-Control no-store
          content:
            image/webp: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/settings/media-styles:
    get:
      operationId: listMediaStyleSettings
      summary: 管理员读取风格名称、分类、提示词和配图状态
      tags: [Settings]
      responses:
        "200":
          description: 全局风格设置；Cache-Control no-store
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MediaStyle"}}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createMediaStyle
      summary: 管理员手动新增风格；配图随后通过上传接口设置
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMediaStyleRequest"}
      responses:
        "201":
          description: 风格已创建；Cache-Control no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaStyle"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/settings/media-styles/{styleId}:
    parameters:
      - name: styleId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: updateMediaStyle
      summary: 管理员以 CAS 修改或停用风格，已受理任务保持原快照
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMediaStyleRequest"}
      responses:
        "200":
          description: 风格已保存；Cache-Control no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaStyle"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/settings/media-styles/{styleId}/thumbnail:
    parameters:
      - name: styleId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: uploadMediaStyleThumbnail
      summary: 管理员上传风格配图；禁止外部 URL
      description: 实际 PNG/JPEG/WebP 解码；至多 5 MiB 与 2000 万像素，最长边缩小至 640 像素，去除元数据后重新编码 PNG，保存上限 1 MiB。
      tags: [Settings]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, expectedVersion]
              properties:
                file: {type: string, format: binary}
                expectedVersion: {type: integer, format: int64, minimum: 0}
      responses:
        "200":
          description: 配图已替换，风格版本递增；Cache-Control no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaStyle"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  "/api/v1/media-templates":
    "parameters":
      - {"$ref":"#/components/parameters/AcceptLanguage"}
    "get":
      "operationId": "listMediaTemplates"
      "tags":
        - "MediaTemplates"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MediaTemplateList"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "parameters":
        - {"name":"targetKind","in":"query","required":false,"schema":{"type":"string","enum":["IMAGE","VIDEO"]}}
        - {"name":"scope","in":"query","required":false,"schema":{"type":"string","enum":["PERSONAL","SYSTEM"]}}
        - {"name":"query","in":"query","required":false,"schema":{"type":"string","maxLength":160}}
      "description": "Lists the signed-in user’s personal templates and shared system templates. Presets support IMAGE and VIDEO only."
    "post":
      "operationId": "createMediaTemplate"
      "tags":
        - "MediaTemplates"
      "responses":
        "201":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MediaTemplate"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateMediaTemplateRequest"
  "/api/v1/media-templates/{templateId}":
    "parameters":
      - {"$ref":"#/components/parameters/AcceptLanguage"}
      - {"name":"templateId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    "get":
      "operationId": "getMediaTemplate"
      "tags":
        - "MediaTemplates"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MediaTemplate"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
    "patch":
      "operationId": "updateMediaTemplate"
      "tags":
        - "MediaTemplates"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MediaTemplate"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/UpdateMediaTemplateRequest"
    "delete":
      "operationId": "deleteMediaTemplate"
      "tags":
        - "MediaTemplates"
      "responses":
        "204":
          "description": "Success"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "parameters":
        - {"name":"expectedVersion","in":"query","required":true,"schema":{"type":"integer","format":"int64","minimum":0}}
  "/api/v1/settings/media-templates":
    "parameters":
      - {"$ref":"#/components/parameters/AcceptLanguage"}
    "post":
      "operationId": "createSystemMediaTemplate"
      "tags":
        - "MediaTemplates"
      "responses":
        "201":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MediaTemplate"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateMediaTemplateRequest"
      "description": "Administrator-only shared template creation. Uses independently archived images owned by the requesting administrator."
  "/api/v1/settings/media-templates/{templateId}":
    "parameters":
      - {"$ref":"#/components/parameters/AcceptLanguage"}
      - {"name":"templateId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    "patch":
      "operationId": "updateSystemMediaTemplate"
      "tags":
        - "MediaTemplates"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MediaTemplate"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/UpdateMediaTemplateRequest"
      "description": "Administrator-only system template update with CAS. Existing attached images can be retained by another administrator."
    "delete":
      "operationId": "deleteSystemMediaTemplate"
      "tags":
        - "MediaTemplates"
      "responses":
        "204":
          "description": "Success"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "parameters":
        - {"name":"expectedVersion","in":"query","required":true,"schema":{"type":"integer","format":"int64","minimum":0}}
  "/api/v1/media-templates/images":
    "parameters":
      - {"$ref":"#/components/parameters/AcceptLanguage"}
    "post":
      "operationId": "uploadMediaTemplateImage"
      "tags":
        - "MediaTemplates"
      "responses":
        "201":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MediaTemplateImage"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "413":
          "description": "Image exceeds the 20 MiB upload limit"
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
      "description": "Archives an independent owner-scoped image using actual MIME, decoder, 20 MiB and 40 MP validation. It becomes visible to other signed-in users only while attached to a system template."
      "requestBody":
        "required": true
        "content":
          "multipart/form-data":
            "schema":
              "type": "object"
              "required":
                - "file"
              "properties":
                "file":
                  "type": "string"
                  "format": "binary"
  "/api/v1/media-templates/images/from-version":
    "parameters":
      - {"$ref":"#/components/parameters/AcceptLanguage"}
    "post":
      "operationId": "copyMediaTemplateImage"
      "tags":
        - "MediaTemplates"
      "responses":
        "201":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MediaTemplateImage"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CopyMediaTemplateImageRequest"
      "description": "Copies an exact accessible project IMAGE version into an independent template image. Does not create canvas nodes or generate media."
  "/api/v1/media-templates/images/{imageId}":
    "parameters":
      - {"$ref":"#/components/parameters/AcceptLanguage"}
      - {"name":"imageId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    "delete":
      "operationId": "deleteMediaTemplateImage"
      "tags":
        - "MediaTemplates"
      "responses":
        "204":
          "description": "Success"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "description": "Owner-only cleanup of unattached images. Template or accepted-import references return 409 MEDIA_TEMPLATE_IMAGE_IN_USE."
  "/api/v1/media-templates/images/{imageId}/content":
    "parameters":
      - {"$ref":"#/components/parameters/AcceptLanguage"}
      - {"name":"imageId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    "get":
      "operationId": "getMediaTemplateImageContent"
      "tags":
        - "MediaTemplates"
      "responses":
        "200":
          "description": "Success"
          "content":
            "image/png":
              "schema":
                "type": "string"
                "format": "binary"
            "image/jpeg":
              "schema":
                "type": "string"
                "format": "binary"
            "image/webp":
              "schema":
                "type": "string"
                "format": "binary"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "description": "Authenticated owner or currently shared system-template image access, Cache-Control: no-store."
    "head":
      "operationId": "headMediaTemplateImageContent"
      "tags":
        - "MediaTemplates"
      "responses":
        "200":
          "description": "Success"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/api/v1/media-templates/images/{imageId}/thumbnail":
    "parameters":
      - {"$ref":"#/components/parameters/AcceptLanguage"}
      - {"name":"imageId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    "get":
      "operationId": "getMediaTemplateImageThumbnail"
      "tags":
        - "MediaTemplates"
      "responses":
        "200":
          "description": "Success"
          "content":
            "image/png":
              "schema":
                "type": "string"
                "format": "binary"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "description": "Authenticated owner or currently shared system-template image preview, Cache-Control: no-store."
  "/api/v1/projects/{projectId}/media-templates/{templateId}/import":
    "parameters":
      - {"$ref":"#/components/parameters/AcceptLanguage"}
      - {"name":"projectId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
      - {"name":"templateId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    "post":
      "operationId": "importMediaTemplate"
      "tags":
        - "MediaTemplates"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MediaTemplateImport"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ImportMediaTemplateRequest"
      "description": "Freezes the requested visible template version and copies its images into independent same-project exact versions. Never creates canvas nodes, saves media drafts, changes model parameters, or runs generation. The project-scoped commandKey resumes/replays the persisted result; mismatched template/version payload returns 409 IDEMPOTENCY_CONFLICT. Imported versions retain explicit template provenance and survive template deletion."
  "/api/v1/projects/{projectId}/canvas-items/{itemId}/media-draft/replace-inputs":
    "parameters":
      - {"$ref":"#/components/parameters/AcceptLanguage"}
      - {"name":"projectId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
      - {"name":"itemId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}
    "post":
      "operationId": "replaceMediaDraftInputs"
      "tags":
        - "MediaTemplates"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/MediaDraft"
        "400":
          "$ref": "#/components/responses/ValidationError"
        "401":
          "$ref": "#/components/responses/Unauthenticated"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/SaveMediaDraftRequest"
      "description": "Atomically removes current media-input connection lines and saves the complete replacement draft with expectedVersion CAS. Preserves the previous draft and lines on conflict or validation failure. Does not generate media."
  /api/v1/settings/system-logs:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: listSystemLogs
      summary: 读取当前后端进程的 stdout / stderr
      description: |
        仅管理员可读，Cache-Control 为 no-store。最多保留最近 2000 行，单行最多 8192 字节；
        在换行后采集，超长行尾部丢弃并标记 truncated。按 sequence 正序返回最新的匹配行。
        search 在脱敏后的内容上进行不区分大小写的字面匹配。重启后 processId 改变且日志重新开始。
        droppedCount 是本次进程因容量淘汰的总行数，matchedCount 是保留范围内的匹配总数。
        日志不持久化，不包含 stdin、原生文件描述符写入、子进程或其他容器输出。
      tags: [Settings]
      parameters:
        - name: stream
          in: query
          schema: {type: string, enum: [STDOUT, STDERR]}
        - name: search
          in: query
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
      responses:
        "200":
          description: 当前进程的脱敏输出快照
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemLogSnapshot"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/call-logs:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: listCallLogs
      summary: 分页读取管理员本人项目的调用审计元数据
      description: |
        按 startedAt、id 倒序稳定排序。仅返回当前管理员自己的项目，不包含请求或响应正文、密钥和 endpoint。
        UNKNOWN 筛选同时匹配调用结果未知及当前 Task 状态 UNKNOWN，便于核对历史请求。
        historical=true 是旧检查点投影，startedAt 为原检查点时间；traceId、respondedAt、durationMs 不可追溯时为 null，不据此推算响应时间。
      tags: [Audit]
      parameters:
        - name: projectId
          in: query
          schema: {type: string, format: uuid}
        - name: kind
          in: query
          schema: {type: string, enum: [LLM, IMAGE, VIDEO, AUDIO]}
        - name: status
          in: query
          schema: {type: string, enum: [RUNNING, SUCCEEDED, FAILED, UNKNOWN]}
        - name: traceId
          in: query
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        - name: from
          in: query
          description: 调用开始时间下界（包含）
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: 调用开始时间上界（包含），不得早于 from
          schema: {type: string, format: date-time}
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: 调用日志页，越权或不存在的 projectId 返回空页
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallLogPage"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/settings/call-log-retention:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getCallLogRetentionSettings
      summary: 读取调用日志保留策略（默认永久，仅管理员）
      tags: [Audit]
      responses:
        "200":
          description: 持久化设置；Cache-Control 为 no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallLogRetentionSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updateCallLogRetentionSettings
      summary: 设置调用日志保留天数
      description: null 表示永久保留，天数范围 1–3650。仅更新策略，不自动清理；管理员手动清理所有状态的过期完整执行，包括未结束及 UNKNOWN。以完成时间（未结束使用创建时间）、最近任务活动及检查点时间判断过期。调用日志、debug 正文、模型回合、工具执行及 Provider 提交账本在同一事务删除，未结束执行先停止本地编排并递增任务租约 epoch，再清理；不承诺外部请求停止或退款，不再恢复或核对已清理请求。保留业务任务、Run 身份、产物和素材；旧对话的执行明细会消失。缩短策略也影响历史记录，删除不可恢复，改回永久不能恢复已清理日志。默认永久保证升级不主动删除数据。不会触发 Provider 请求。
      tags: [Audit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [retentionDays, expectedVersion]
              properties:
                retentionDays: {type: [integer, "null"], minimum: 1, maximum: 3650}
                expectedVersion: {type: integer, minimum: 1}
      responses:
        "200":
          description: 保存后的策略和版本
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallLogRetentionSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/settings/call-log-retention/cleanup:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: cleanupCallLogs
      summary: 手动清理到期调用日志与执行账本
      description: 仅管理员显式请求执行，无定时任务；使用已保存且版本匹配的保留策略，null 永久保留时返回零。每批策略行加锁并检查 expectedVersion，所有状态的过期执行均可清理，未结束与 UNKNOWN 先停止本地执行、递增任务租约 epoch、释放该 Run 活动槽，再同事务删除日志与账本并保存状态事件；近期有活动、边界时刻或被并发事务锁定的整个执行暂缓。不承诺外部请求停止或退款，清理后不再恢复或核对原请求；每次至多十批，每批至多 1000 个执行单位。batchLimitReached=true 表示可能还有待清理记录，须再次手动执行。多个批次分别提交，后续失败或设置冲突不能恢复前面已提交的批次；不得自动重试。保留业务身份和结果，不触发 Provider 请求。
      tags: [Audit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: {type: integer, minimum: 1}
      responses:
        "200":
          description: 本次实际清理的执行单位数量；Cache-Control 为 no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallLogCleanupResult"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/agent-presets:
    get:
      operationId: listAgentPresets
      summary: 读取可直接创建的 Agent 提示词名称和用途标识
      tags: [Agents]
      responses:
        "200":
          description: 仅名称和标识，不含正文及功能提示词；Cache-Control no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentPresetList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/settings/prompts:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: listPrompts
      summary: 统一提示词管理列表（仅管理员）
      description: 内置功能提示词包括文字生成及角色、脸部、道具三视图和场景宫格；可编辑但不可删除。四种视图分别由固定用途标识 image.three-view.character、image.three-view.face、image.three-view.prop 和 image.three-view.scene-grid 消费。
      tags: [Settings]
      responses:
        "200":
          description: 所有 Agent 与功能提示词；Cache-Control no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createPrompt
      summary: 新建独立提示词
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePromptRequest"}
      responses:
        "201":
          description: 已创建的条目；自定义功能条目须由对应消费功能显式接入
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptDefinition"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "409": {$ref: "#/components/responses/Conflict"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/settings/prompts/{id}:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getPrompt
      summary: 读取提示词条目（仅管理员）
      tags: [Settings]
      responses:
        "200":
          description: 提示词条目；Cache-Control no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptDefinition"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updatePrompt
      summary: 乐观修改名称、说明和提示词正文（仅管理员）
      description: key 与 kind 不可变；已复制的 Agent 和冻结的 Task/Run 不随修改而改变。
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdatePromptRequest"}
      responses:
        "200":
          description: 保存结果；Cache-Control no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptDefinition"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      operationId: deletePrompt
      summary: 乐观删除自定义提示词（仅管理员）
      description: 内置条目返回 PROMPT_IN_USE/409，已有 Agent/Task 保留复制内容。
      tags: [Settings]
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "204": {description: 已删除；Cache-Control no-store}
        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/settings/debug:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getDebugSettings
      summary: 读取系统 debug 模式（默认关闭，仅管理员）
      tags: [Audit]
      responses:
        "200":
          description: 持久化设置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DebugSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updateDebugSettings
      summary: 修改系统 debug 模式
      description: 调用开始时固定开关。启用后保存脱敏原始 HTTP 地址及正文（每个正文最多 64 MiB，超限或未读完明确标注）；可能包含提示词、个人信息和素材，并显著增加数据库及备份体积。仅提取 DebugExchange.responseIdentifiers 定义的固定响应关联 ID；其余 header（含 Authorization、Cookie、Set-Cookie）均不保存。普通及流式 LLM 的请求、响应及 HTTP/SSE 正文仅按结构化 image_url 字段省略图片字节，其余字段、工具 Schema、参数和模型文本原样保留，不对正文进行凭据或正则替换。独立请求地址隐藏认证信息，媒体调用继续过滤凭据与私有推理。关闭停止新增正文，历史记录按日志保留设置清理，旧调用不会补录。不会触发 Provider 请求。
      tags: [Audit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [debugMode, expectedVersion]
              properties:
                debugMode: {type: boolean}
                expectedVersion: {type: integer, minimum: 1}
      responses:
        "200":
          description: 更新后的设置与版本
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DebugSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/call-logs/{id}/debug:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getCallDebug
      summary: 查看本人项目的 debug 调用详情
      description: 单独按需读取正文；Cache-Control 为 no-store。captured=false 表示调用开始时 debug 未启用。captured=true 且 exchanges 为空表示没有已采集的 HTTP 交换（例如 Mock、尚未开始网络调用或采集写入失败）。不伪造 Mock 的 HTTP 请求。仅提取固定白名单响应关联 ID，其他 header（含 Authorization、Cookie、Set-Cookie）均省略；LLM 正文不做凭据替换，保留实际请求与响应内容及推理字段，流式响应只保存一份于 llmStream.content.response，exchanges 只保留请求、HTTP 状态和响应关联 ID，媒体调用继续过滤凭据与私有推理。每个正文至多 64 MiB，超限或未读完标记 truncated，无法解析的 JSON 正文或 SSE data 事件省略，旧内容不补录。UTF8 为正文文本（LLM JSON 仅将结构化 image_url 中的图片 data URI 整值替换为 [image bytes omitted] 占位符后序列化，工具 Schema、参数、数值和普通文本保留；非 LLM JSON 沿用凭据过滤），BASE64 为二进制正文，MULTIPART_JSON 为字段与文件内容，OMITTED 表示无法安全采集。请求已发送但无响应时响应字段为 null。旧历史投影无此详情，不补录。
      tags: [Audit]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Debug 详情
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallDebug"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/auth/setup-status:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getSetupStatus
      summary: 查询是否需要初始化管理员
