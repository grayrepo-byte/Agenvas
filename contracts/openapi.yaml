  /mcp/uploads:
    post:
      operationId: uploadMcpMedia
      summary: 使用 MCP 令牌上传项目媒体并创建精确内容版本
      description: >-
        原生客户端调用 prepare_media_upload 后，以同一 Bearer 令牌 POST metadata JSON part 和 file 二进制 part。要求 READ +
        CONTENT_WRITE；不接受 Session、Origin 或本地文件路径。实际大小与 SHA-256 必须匹配；同 commandId
        同参数重放返回原结果，异参返回409。默认只创建项目资源，提供 placement 时同时放置节点。图片20 MiB、音频50 MiB、MP4视频500 MiB，请求总限501
        MiB，实际解码与像素/时长限制沿用普通上传。恢复模式与关闭MCP时拒绝，不触发生成。
      tags:
        - MCP
      security:
        - McpBearer: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - metadata
                - file
              properties:
                metadata:
                  $ref: '#/components/schemas/McpMediaUploadMetadata'
                file:
                  type: string
                  format: binary
            encoding:
              metadata:
                contentType: application/json
      responses:
        '201':
          description: 已归档的不可变版本和可选节点；重放返回同一结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpMediaUploadResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: 文件或请求超过上限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 实际大小/摘要不符或媒体解码失败
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 恢复模式只读或存储暂不可用
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
