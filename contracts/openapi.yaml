        speechRate: {type: integer, minimum: -50, maximum: 100}
        loudnessRate: {type: integer, minimum: -50, maximum: 100}
        pitchRate: {type: integer, minimum: -12, maximum: 12}
        aspectRatio: {type: string, enum: [AUTO, "1:1", "2:3", "3:2", "9:16", "16:9", "3:4", "4:3", "21:9"]}
        videoResolution: {type: string, pattern: '^[1-9][0-9]{2,3}p$', description: "AutoDL only; a published resolution tier. Omitted uses the capability default. Frozen into accepted tasks."}
