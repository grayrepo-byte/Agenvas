          description: "ProblemDetail error"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: "projectId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportLibraryRequest"
  /api/v1/projects/{projectId}/canvas-items/{itemId}/library-references:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: "referenceLibraryEntry"
      responses:
        "202":
          description: "Success"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryCommand"
        default:
          description: "ProblemDetail error"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - name: "projectId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: "itemId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceLibraryRequest"
  /api/v1/library/uploads:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: "uploadLibraryEntry"
      responses:
        "202":
          description: "Accepted local transfer. PNG/JPEG/WebP:20 MiB/40 MP; MP3/WAV/OGG Opus:50 MiB/10min; decoded MP4:50 MiB/40 MP/60sec."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryCommand"
        default:
          description: "ProblemDetail error"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: "object"
              additionalProperties: false
              required: ["file", "kind", "name", "category", "commandKey"]
              properties:
                file:
                  type: "string"
                  format: "binary"
                kind:
                  type: "string"
                  enum: ["IMAGE", "VIDEO", "AUDIO"]
                name:
                  type: "string"
                  minLength: 1
                  maxLength: 160
                category:
                  $ref: "#/components/schemas/LibraryCategory"
                commandKey:
                  type: "string"
                  minLength: 1
                  maxLength: 200
components:
  schemas:
    LibraryCategory:
      type: "string"
      enum: ["CHARACTER", "SCENE", "PROP", "OTHER"]
    LibrarySort:
      type: "string"
      enum: ["SAVED", "NAME", "UPDATED"]
    LibraryEntry:
      type: "object"
      additionalProperties: false
      required: ["id", "name", "category", "kind", "textContent", "contentType", "byteSize", "width", "height", "durationMs", "hasThumbnail", "source", "favorite", "trashedAt", "version", "createdAt", "updatedAt"]
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          minLength: 1
          maxLength: 160
        category:
          $ref: "#/components/schemas/LibraryCategory"
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        textContent:
          type: ["object", "null"]
          additionalProperties: true
        contentType:
          type: ["string", "null"]
        byteSize:
          type: ["integer", "null"]
        width:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
        durationMs:
          type: ["integer", "null"]
        hasThumbnail:
          type: "boolean"
        source:
          type: "object"
          additionalProperties: true
        favorite:
          type: "boolean"
        trashedAt:
          type: ["string", "null"]
          format: "date-time"
        version:
          type: "integer"
          format: "int64"
          minimum: 0
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    LibraryPage:
      type: "object"
      additionalProperties: false
      required: ["items", "nextCursor", "total", "categoryCounts"]
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/LibraryEntry"
        nextCursor:
          type: ["string", "null"]
        total:
          type: "integer"
          minimum: 0
        categoryCounts:
          type: "object"
          additionalProperties:
            type: "integer"
            minimum: 0
    LibraryCommand:
      type: "object"
      additionalProperties: false
      required: ["id", "status", "result", "errorCode", "errorDetail"]
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum: ["ACCEPTED", "ARCHIVING", "SUCCEEDED", "FAILED"]
        result:
          type: ["object", "null"]
          additionalProperties: false
          required: []
          properties:
            entryId:
              type: "string"
              format: "uuid"
            artifactId:
              type: "string"
              format: "uuid"
            versionId:
              type: "string"
              format: "uuid"
            canvasItemId:
              type: "string"
              format: "uuid"
            draftVersion:
              type: "integer"
              format: "int64"
              minimum: 0
            alreadySaved:
              type: "boolean"
            trashed:
              type: "boolean"
        errorCode:
          type: ["string", "null"]
        errorDetail:
          type: ["string", "null"]
          description: Public failure explanation localized using Accept-Language. Internal message keys and interpolation arguments are never exposed.
    LibrarySource:
      type: "object"
      additionalProperties: false
      required: ["title", "kind", "versionId", "expectedSelectionEpoch", "expectedArtifactVersion", "textContent", "assetId", "versionNo"]
      properties:
        title:
          type: "string"
          minLength: 1
          maxLength: 160
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        versionId:
          type: "string"
          format: "uuid"
        expectedSelectionEpoch:
          type: "integer"
          format: "int64"
          minimum: 0
        expectedArtifactVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        textContent:
          type: ["object", "null"]
          additionalProperties: true
        assetId:
          type: ["string", "null"]
          format: "uuid"
        versionNo:
          type: "integer"
          minimum: 1
    SaveLibraryRequest:
      type: "object"
      additionalProperties: false
      required: ["versionId", "expectedSelectionEpoch", "name", "category", "commandKey"]
      properties:
        versionId:
          type: "string"
          format: "uuid"
        expectedSelectionEpoch:
          type: "integer"
          format: "int64"
          minimum: 0
        expectedArtifactVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        name:
          type: "string"
          minLength: 1
          maxLength: 160
        category:
          $ref: "#/components/schemas/LibraryCategory"
        commandKey:
          type: "string"
          minLength: 1
          maxLength: 200
    UpdateLibraryRequest:
      type: "object"
      additionalProperties: false
      required: ["expectedVersion", "name", "category", "favorite"]
      properties:
        expectedVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        name:
          type: "string"
          minLength: 1
          maxLength: 160
        category:
          $ref: "#/components/schemas/LibraryCategory"
        favorite:
          type: "boolean"
    LibraryVersionRequest:
      type: "object"
      additionalProperties: false
      required: ["expectedVersion"]
      properties:
        expectedVersion:
          type: "integer"
          format: "int64"
          minimum: 0
    ImportLibraryRequest:
      type: "object"
      additionalProperties: false
      required: ["entryId", "expectedVersion", "x", "y", "commandKey"]
      properties:
        entryId:
          type: "string"
          format: "uuid"
        expectedVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        x:
          type: "number"
          minimum: -1000000
          maximum: 1000000
        y:
          type: "number"
          minimum: -1000000
          maximum: 1000000
        commandKey:
          type: "string"
          minLength: 1
          maxLength: 200
    ReferenceLibraryRequest:
      type: "object"
      additionalProperties: false
      required: ["entryId", "expectedVersion", "draft", "role", "color", "commandKey"]
      properties:
        entryId:
          type: "string"
          format: "uuid"
        expectedVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        draft:
          $ref: "#/components/schemas/SaveMediaDraftRequest"
        role:
          type: "string"
          enum: ["REFERENCE", "START_FRAME", "END_FRAME", "AUDIO_REFERENCE"]
        color:
          type: "string"
          pattern: "^#[0-9A-F]{6}$"
        commandKey:
          type: "string"
          minLength: 1
          maxLength: 200
    CallLogCleanupResult:
      type: object
      required: [cleanedExecutions, batchLimitReached]
      properties:
        cleanedExecutions: {type: integer, minimum: 0, maximum: 10000}
        batchLimitReached: {type: boolean}
    CallLogRetentionSettings:
      type: object
      required: [retentionDays, version]
      properties:
        retentionDays: {type: [integer, "null"], minimum: 1, maximum: 3650, default: null}
        version: {type: integer, minimum: 1}
    DebugSettings:
      type: object
      required: [debugMode, version]
      properties:
        debugMode: {type: boolean, default: false}
        version: {type: integer, minimum: 1}
    DebugBody:
      type: object
      required: [content, encoding, truncated]
      properties:
        content: {type: string}
        encoding: {type: string, enum: [UTF8, BASE64, MULTIPART_JSON, OMITTED]}
        truncated: {type: boolean}
    DebugExchange:
      type: object
      required: [method, url, requestBody, responseStatus, responseBody]
      properties:
        method: {type: string}
        url: {type: string}
        requestBody:
          oneOf:
            - {$ref: "#/components/schemas/DebugBody"}
            - {type: "null"}
        responseStatus: {type: [integer, "null"]}
        responseBody:
          oneOf:
            - {$ref: "#/components/schemas/DebugBody"}
            - {type: "null"}
    CallDebug:
      type: object
      required: [id, captured, exchanges]
      properties:
        id: {type: string, format: uuid}
        captured: {type: boolean}
        exchanges:
          type: array
          items: {$ref: "#/components/schemas/DebugExchange"}
    CallLogPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CallLog"}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, format: int64, minimum: 0}
    CallLog:
      type: object
      required: [id, projectId, projectTitle, taskId, runId, kind, operation, status, taskStatus, provider, model, traceId, providerRequestId, errorCode, startedAt, respondedAt, durationMs, historical, mock]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        projectTitle: {type: string}
        taskId: {type: [string, "null"], format: uuid}
        runId: {type: [string, "null"], format: uuid}
        kind: {type: string, enum: [LLM, IMAGE, VIDEO, AUDIO]}
        operation: {type: string, enum: [CHAT, SUBMIT, POLL, LEGACY]}
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED, UNKNOWN]
          description: 单次调用结果；异步受理或轮询返回等待也表示本次调用成功，不表示任务已生成完成。
        taskStatus:
          type: [string, "null"]
          enum: [PENDING, READY, RUNNING, SUBMITTING, WAITING_PROVIDER, UNKNOWN, BLOCKED, SUCCEEDED, FAILED, CANCELED, null]
        provider: {type: [string, "null"]}
        model: {type: [string, "null"]}
        traceId: {type: [string, "null"]}
        providerRequestId: {type: [string, "null"]}
        errorCode: {type: [string, "null"]}
        startedAt: {type: string, format: date-time}
        respondedAt:
          type: [string, "null"]
          format: date-time
          description: 本次受控模型或媒体适配器返回或抛出的时间；适配器内部可能包含下载和媒体处理，不是底层 HTTP 首字节时间。
        durationMs:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: 适配器调用的单调时钟耗时，不含后置审计写入或 Worker 的结果提交；旧适配器内部处理和 Mock 渲染计入其中。
        historical: {type: boolean}
        mock: {type: boolean}
    MediaSettings:
      type: object
      additionalProperties: false
      required: [connections, defaults]
      properties:
        connections:
          type: array
          items: {$ref: "#/components/schemas/MediaConnection"}
        defaults:
          type: array
          items: {$ref: "#/components/schemas/MediaDefault"}
    MediaConnection:
      type: object
      additionalProperties: false
      required: [id, name, platform, enabled, version, connectionVersion, origin,
        keyMask, connectivityStatus, realGenerationTested, capabilities]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        platform: {type: string, enum: [LOCAL, MOCK, COMFYUI, OPENAI, ARK, GOOGLE, VOLCENGINE, AUTODL, RUNNINGHUB]}
        enabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
        connectionVersion: {type: integer, minimum: 1}
        origin: {type: [string, "null"], description: "COMFYUI local origin, RUNNINGHUB HTTPS root without a domain allowlist, or optional OPENAI/GOOGLE HTTPS API base URL; null uses the platform official endpoint."}
        keyMask: {type: [string, "null"]}
        connectivityStatus: {type: string, enum: [NOT_CHECKED]}
        realGenerationTested: {type: boolean}
        capabilities:
          type: array
          items: {$ref: "#/components/schemas/MediaCapability"}
    MediaCapability:
      type: object
      additionalProperties: false
      required: [id, name, enabled, version, capabilityVersion, adapterId, kind,
        minimumSeconds, maximumSeconds, maxReferenceImages, maxReferenceAudios, supportedVideoInputModes,
        defaultVideoInputMode, supportsEndFrame, supportedImageAspectRatios,
        supportedImageResolutions, supportedImageQualities, supportsTransparentBackground,
        supportsImageMask,
        mappingSha256, settings]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
        capabilityVersion: {type: integer, minimum: 1}
        adapterId: {type: string}
        kind: {type: string, enum: [IMAGE_GENERATION, VIDEO_GENERATION, AUDIO_GENERATION]}
        minimumSeconds: {type: integer, minimum: 0}
        maximumSeconds: {type: integer, minimum: 0}
        maxReferenceImages: {type: integer, minimum: 0}
        maxReferenceAudios: {type: integer, minimum: 0, maximum: 14}
        supportedVideoInputModes:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/VideoInputMode"}
        defaultVideoInputMode:
          oneOf:
            - {$ref: "#/components/schemas/VideoInputMode"}
            - {type: "null"}
        supportsEndFrame: {type: boolean}
        supportedImageAspectRatios:
          type: array
          uniqueItems: true
          items: {type: string, enum: [AUTO, "1:1", "2:3", "3:2", "9:16", "16:9", "3:4", "4:3", "21:9"]}
        supportedImageResolutions:
          type: array
          uniqueItems: true
          items: {type: string, enum: [1K, 2K, 4K]}
        supportedImageQualities:
          type: array
          uniqueItems: true
          items: {type: string, enum: [low, medium, high]}
        supportsTransparentBackground: {type: boolean}
        supportsImageMask: {type: boolean}
        mappingSha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        settings: {$ref: "#/components/schemas/FixedMediaAdapterSettings"}
    FixedMediaAdapterSettings:
      type: object
      additionalProperties: false
      description: Versioned settings within a compiled adapter protocol. OPENAI and GOOGLE accept a compatible model name and a connection API base URL. Defaults fill missing draft fields; limits can only narrow compiled adapter bounds. Pricing is an administrator estimate, never an actual provider charge.
      properties:
        runningHub: {$ref: "#/components/schemas/RunningHubDefinition"}
        workflowId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$', description: AutoDL preset or administrator-published workflow ID. Must match workflowDefinition.id when a definition is present.}
        workflowDefinition: {$ref: '#/components/schemas/AutoDlWorkflowDefinition'}
        videoResolution: {type: string, pattern: '^[1-9][0-9]{2,3}p$', description: "AutoDL default resolution tier, included in videoResolutions; mapped to the workflow's exact enum using the frozen card/project aspect ratio. Unsupported combinations are rejected before task acceptance."}
        videoResolutions:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: {type: string, pattern: '^[1-9][0-9]{2,3}p$'}
          description: AutoDL published resolution tiers, restricted to the selected workflow. Omitted preserves the single videoResolution tier for historical capabilities.
        seed: {type: integer, format: int64, minimum: 1, maximum: 999999999999999, description: "Optional AutoDL seed, only for workflows that declare it."}
        checkpoint: {type: string, maxLength: 160}
        diffusionModel: {type: string, maxLength: 160}
        textEncoder: {type: string, maxLength: 160}
        vae: {type: string, maxLength: 160}
        clipVision: {type: string, maxLength: 160}
        quality: {type: string, enum: [low, medium, high]}
        model: {type: string, maxLength: 120, pattern: "^([A-Za-z0-9][A-Za-z0-9._:/-]{0,119})?$", description: "Empty uses the compiled default; only OPENAI/GOOGLE accept this field. GOOGLE preserves explicit API prefixes such as /v1beta; a bare origin uses /v1. Beta requests use generationConfig.imageConfig; stable requests use generationConfig.responseFormat.image."}
        defaultParameters:
          $ref: "#/components/schemas/ImageGenerationParameters"
          description: "Image defaults; video adapters accept aspectRatio only. Unsupported parameters are rejected."
        defaultDurationSeconds: {type: integer, minimum: 1, maximum: 30}
        minimumSeconds: {type: integer, minimum: 0, maximum: 30}
        maximumSeconds: {type: integer, minimum: 0, maximum: 30}
        maxReferenceImages: {type: integer, minimum: 0, maximum: 14}
        maxReferenceAudios: {type: integer, minimum: 0, maximum: 3}
        pricing: {$ref: "#/components/schemas/MediaCapabilityPricing"}
        pricingByResolution:
          type: object
          maxProperties: 16
          propertyNames: {pattern: '^[1-9][0-9]{2,3}p$'}
          additionalProperties: {$ref: '#/components/schemas/MediaCapabilityPricing'}
          description: AutoDL video estimates by a published resolution tier. Matching tier overrides pricing; otherwise pricing is the fallback. Missing both means unknown cost.
    AutoDlWorkflowDefinition:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, label, minimumSeconds, maximumSeconds, promptLimit, mode, imageFields, audioFields, minimumImages, minimumAudios, resolutions, defaultResolution, supportsSeed]
      description: Versioned data-only contract for the fixed AutoDL prompt/duration/video protocol. No graph, node IDs, scripts, endpoints or credentials. New same-protocol workflows need configuration only; other protocols are rejected. Resolution labels are exact provider enum values, not actual pixel guarantees.
      properties:
        schemaVersion: {type: integer, enum: [1]}
        id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$'}
        label: {type: string, minLength: 1, maxLength: 160}
        minimumSeconds: {type: integer, minimum: 1, maximum: 30}
        maximumSeconds: {type: integer, minimum: 1, maximum: 30}
        promptLimit: {type: integer, minimum: 1, maximum: 10000}
        mode: {$ref: '#/components/schemas/VideoInputMode'}
        imageFields:
          type: array
          maxItems: 14
          uniqueItems: true
          items: {type: string, pattern: '^(first_frame|last_frame|ref_image_[0-9]{1,2})$'}
        audioFields:
          type: array
          maxItems: 3
          uniqueItems: true
          items: {type: string, pattern: '^ref_audio_[0-9]$'}
        minimumImages: {type: integer, minimum: 0, maximum: 14}
        minimumAudios: {type: integer, minimum: 0, maximum: 3}
        resolutions:
          type: array
          minItems: 1
          maxItems: 48
          uniqueItems: true
          items: {type: string, pattern: '^[1-9][0-9]{2,3}p(横|竖|\(1:1\))(\([0-9]{1,5}\*[0-9]{1,5}\))?$'}
        defaultResolution: {type: string, pattern: '^[1-9][0-9]{2,3}p$'}
        supportsSeed: {type: boolean}
    RunningHubScalar:
      oneOf:
        - {type: string, maxLength: 20000}
        - {type: number}
        - {type: boolean}
    RunningHubDefinition:
      type: object
      additionalProperties: false
      required: [schemaVersion, protocolVersion, targetType, targetId, fields, outputs]
      description: Data-only local contract. No scripts, endpoints or credentials. Local versions do not freeze remote workflow implementations. Companion ZIP results are skipped without download or extraction; mapped primary media remains required.
      properties:
        schemaVersion: {type: integer, enum: [1]}
        protocolVersion: {type: string, enum: [V2]}
        targetType: {type: string, enum: [WORKFLOW, AI_APP]}
        targetId: {type: string, pattern: "^[0-9]{1,32}$", description: Real workflowId/webappId, not API directory SKU.}
        sourceSha256: {type: [string, "null"], pattern: "^[0-9a-f]{64}$"}
        instanceType: {type: [string, "null"], enum: [default, plus, ultra, null]}
        usePersonalQueue: {type: boolean, default: false}
        addMetadata: {type: boolean, default: false}
        retainSeconds: {type: [integer, "null"], minimum: 10, maximum: 180, description: Additional provider charge; disabled by default.}
        fields:
          type: array
          maxItems: 64
          items: {$ref: "#/components/schemas/RunningHubField"}
        fixedBindings:
          type: [array, "null"]
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [nodeId, fieldName, value]
            properties:
              nodeId: {type: string, pattern: "^[0-9]{1,32}$"}
              fieldName: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,79}$"}
              value: {$ref: "#/components/schemas/RunningHubScalar"}
              encoding: {type: [string, "null"], enum: [NATIVE, STRING, null]}
        outputs:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [kind, primary, maxCount]
            properties:
              nodeId: {type: [string, "null"], pattern: "^[0-9]{1,32}$"}
              kind: {type: string, enum: [IMAGE, VIDEO, AUDIO]}
              primary: {type: boolean}
              maxCount: {type: integer, minimum: 1, maximum: 16}
    RunningHubField:
      type: object
      additionalProperties: false
      required: [key, label, type, nodeId, fieldName]
      properties:
        key: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_]{0,63}$"}
        label: {type: string, minLength: 1, maxLength: 160}
        description: {type: [string, "null"], maxLength: 1000}
        type: {type: string, enum: [STRING, NUMBER, INTEGER, BOOLEAN, SELECT, IMAGE, AUDIO, VIDEO]}
        required: {type: boolean, default: false}
        advanced: {type: boolean, default: false}
        defaultValue:
          oneOf:
            - {$ref: "#/components/schemas/RunningHubScalar"}
            - {type: "null"}
        minimum: {type: [number, "null"]}
        maximum: {type: [number, "null"]}
        maxLength: {type: [integer, "null"], minimum: 1, maximum: 20000}
        options:
          type: [array, "null"]
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [label, value]
            properties:
              label: {type: string, minLength: 1, maxLength: 160}
              value: {$ref: "#/components/schemas/RunningHubScalar"}
        nodeId: {type: string, pattern: "^[0-9]{1,32}$"}
        fieldName: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,79}$"}
        source: {type: [string, "null"], enum: [PARAMETER, PROMPT, DURATION_SECONDS, null]}
        encoding: {type: [string, "null"], enum: [NATIVE, STRING, null]}
        resourceFormat: {type: [string, "null"], enum: [FILE_NAME, URL, null]}
        enabledWhen:
          type: [object, "null"]
          additionalProperties: false
          required: [field, value]
          properties:
            field: {type: string}
            value: {$ref: "#/components/schemas/RunningHubScalar"}
    RunningHubImportRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, kind]
      properties:
        targetType: {type: string, enum: [WORKFLOW, AI_APP]}
        targetId: {type: string, pattern: "^[0-9]{1,32}$"}
