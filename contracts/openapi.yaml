        memoryTruncated: {type: boolean, description: 公开历史消息超过本轮上下文预算，完整记录仍保留。}
        modelAvailable: {type: boolean}
        providerAdapter: {type: [string, "null"]}
        modelId: {type: [string, "null"]}
        toolCalling: {type: boolean}
        policySnapshot: {$ref: "#/components/schemas/RunPolicySnapshot"}
    RunPolicySnapshot:
      type: object
      additionalProperties: false
      description: >-
        Policies are schema v7 with systemPromptVersion=14 and toolPolicyVersion=6; retired protocols are rejected.
        The director manages the entire current project canvas, including nodes added or changed during a Run.
        read_canvas, manage_canvas_node and update_media_draft share project ownership, current selected-version checks, locks
        and optimistic CAS with normal application services. Explicit Skill inputs grant exact-version read access only.
        Existing-node media proposals use canvasItemId, expectedItemVersion and expectedDraftVersion and still require approval.
        Storyboard media outputs may pair shotId with expectedShotRevision; the server freezes their shot identity, revision and inferred role.
        Approval checks the same shot revision before acceptance. Archived outcomes return as candidates, requiring explicit user selection.
        extract_audio and trim_audio accept the current canvasItemId, exact sourceVersionId and observed expectedCanvasItemVersion;
        they create immutable local audio results through the same authorized application services, with no external generation or media approval.
        extract_audio uses a fixed local processor, independent of administrator-configured cloud function routes.
        These tools and compose_video persist their task receipts and wait in WAITING_TASKS until the server freezes their terminal outcomes.
        The original tool reply then supplies the archived artifactVersionId or actual failure; acceptance alone does not mean completion and the model must not poll.
        Local tasks remain independent after acceptance: canceling the Run stops subsequent model turns but does not cancel these tasks.
        Task reads require the same Run's committed local-tool receipt; UNKNOWN and late results never trigger automatic regeneration or rewrite a frozen outcome.
        Selected Skills initially disclose only name, description and immutable version ID;
        read_skill activates their main instructions, then read_skill_resource reads text and read_skill_asset supplies fixed images directly to the LLM without project imports.
        New image reads are sequential with only the current image attached; bounded public context projections retain prior observations and exact references.
        Null count limits mean no per-Run model/tool count cap.
      required: [schemaVersion, toolPolicyVersion, systemPromptVersion, allowedTools, modelConfigSource, modelConfigVersion, maxModelTurns, maxToolExecutions]
      properties:
        schemaVersion: {type: integer, const: 7}
        toolPolicyVersion: {type: integer, const: 6}
        allowedTools: {type: array, uniqueItems: true, items: {type: string}}
        systemPromptVersion: {type: integer, const: 14}
        modelConfigSource: {type: string}
        modelConfigVersion: {type: integer, minimum: 1}
        maxModelTurns: {type: "null", description: No model-turn count limit.}
        maxToolExecutions: {type: "null", description: No per-Run tool execution count limit.}
    AgentRun:
