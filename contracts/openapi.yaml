  "/api/v1/projects/{projectId}/canvas/character-connections/{connectionId}/disconnect": {"post": {"operationId": "disconnectCharacterNode", "tags": ["Canvas"], "parameters": [{"in": "path", "name": "projectId", "required": true, "schema": {"type": "string", "format": "uuid"}}, {"in": "path", "name": "connectionId", "required": true, "schema": {"type": "string", "format": "uuid"}}], "responses": {"204": {"description": "Disconnected; applied draft retained"}, "400": {"$ref": "#/components/responses/ValidationError"}, "401": {"$ref": "#/components/responses/Unauthenticated"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DisconnectCharacterNode"}}}}}}
