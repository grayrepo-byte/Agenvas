        "401":
          description: "Authentication required"
        "404":
          description: "Resource unavailable"
        "409":
          description: "Version or command conflict"
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              type: "object"
              additionalProperties: false
              required: ["commandId", "kind", "file"]
              properties:
                commandId:
                  type: "string"
                  format: "uuid"
                kind:
                  type: "string"
                  enum: ["IMAGE", "AUDIO"]
                file:
                  type: "string"
                  format: "binary"
  "/api/v1/character-library/media/{mediaId}/content":
