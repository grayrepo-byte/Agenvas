  /api/v1/projects/{projectId}/events:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      operationId: streamProjectEvents
      summary: 从项目事件水位之后补发并订阅 SSE
      description: |
        一个项目共用一条 SSE。Agent 公开回答通过 agent.turn.stream.started / delta /
        completed / interrupted 事件增量发送，使用同一项目 seq 可靠补发。
        payload 为 AgentTurnStreamEventPayload；旧 epoch 和重复 chunk 不得追加。
        刷新或游标过期后从快照 activeTasks 的 output.assistantStream 恢复累计文本，
        已提交回合的 output.assistantText 为终稿。流式文本不包含模型私有推理或工具参数。
      tags: [Events]
      parameters:
        - name: after
          in: query
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: Last-Event-ID
          in: header
          description: 浏览器自动重连游标；提供时优先于 after
          schema: {type: string, pattern: "^[0-9]+$"}
      responses:
        "200":
          description: 事件使用项目 seq 作为 SSE id，并以业务 type 作为 SSE event 名称；15 秒心跳
          content:
            text/event-stream:
              schema: {type: string}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
