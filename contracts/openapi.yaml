components:
  schemas:
    MediaStyleSummary:
      type: object
      additionalProperties: false
      required: [id, name, category, enabled, version, thumbnailUrl, builtIn]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        category: {type: string, minLength: 1, maxLength: 40}
        enabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
        thumbnailUrl: {type: [string, "null"], description: Authenticated application URL; null until a custom preview is uploaded.}
        builtIn: {type: boolean}
    MediaStyle:
      type: object
      additionalProperties: false
      required: [id, name, category, enabled, version, thumbnailUrl, builtIn, promptSuffix]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80}
        category: {type: string, minLength: 1, maxLength: 40}
        enabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
        thumbnailUrl: {type: [string, "null"]}
        builtIn: {type: boolean}
        promptSuffix: {type: string, minLength: 1, maxLength: 4000}
    CreateMediaStyleRequest:
      type: object
      additionalProperties: false
      required: [name, category, promptSuffix, enabled]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        category: {type: string, minLength: 1, maxLength: 40}
        promptSuffix: {type: string, minLength: 1, maxLength: 4000}
        enabled: {type: boolean}
    UpdateMediaStyleRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, name, category, promptSuffix, enabled]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 80}
        category: {type: string, minLength: 1, maxLength: 40}
        promptSuffix: {type: string, minLength: 1, maxLength: 4000}
        enabled: {type: boolean}
    MediaStyleSnapshot:
      type: object
      additionalProperties: false
      required: [id, version, name, promptSuffix]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        name: {type: string}
        promptSuffix: {type: string}
    "MediaTemplateImage":
      "type": "object"
      "required":
        - "id"
        - "contentType"
        - "byteSize"
        - "width"
        - "height"
        - "thumbnailUrl"
        - "contentUrl"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "contentType":
          "type": "string"
        "byteSize":
          "type": "integer"
          "format": "int64"
        "width":
          "type": "integer"
          "minimum": 1
        "height":
          "type": "integer"
          "minimum": 1
        "thumbnailUrl":
          "type": "string"
        "contentUrl":
          "type": "string"
    "MediaTemplate":
      "type": "object"
      "required":
        - "id"
        - "name"
        - "targetKind"
        - "scope"
        - "prompt"
        - "images"
        - "version"
        - "createdAt"
        - "updatedAt"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 160
        "targetKind":
          "type": "string"
          "enum":
            - "IMAGE"
            - "VIDEO"
        "scope":
          "type": "string"
          "enum":
            - "PERSONAL"
            - "SYSTEM"
        "prompt":
          "type": "string"
          "minLength": 1
          "maxLength": 20000
        "images":
          "type": "array"
          "maxItems": 8
          "items":
            "$ref": "#/components/schemas/MediaTemplateImage"
        "version":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "createdAt":
          "type": "string"
          "format": "date-time"
        "updatedAt":
          "type": "string"
          "format": "date-time"
    "MediaTemplateList":
      "type": "object"
      "required":
        - "items"
      "properties":
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/MediaTemplate"
    "CreateMediaTemplateRequest":
      "type": "object"
      "additionalProperties": false
      "required":
        - "name"
        - "targetKind"
        - "prompt"
        - "imageIds"
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 160
        "targetKind":
          "type": "string"
          "enum":
            - "IMAGE"
            - "VIDEO"
        "prompt":
          "type": "string"
          "minLength": 1
          "maxLength": 20000
        "imageIds":
          "type": "array"
          "maxItems": 8
          "uniqueItems": true
          "items":
            "type": "string"
            "format": "uuid"
    "UpdateMediaTemplateRequest":
      "type": "object"
      "additionalProperties": false
      "required":
        - "expectedVersion"
        - "name"
        - "targetKind"
        - "prompt"
        - "imageIds"
      "properties":
        "expectedVersion":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 160
        "targetKind":
          "type": "string"
          "enum":
            - "IMAGE"
            - "VIDEO"
        "prompt":
          "type": "string"
          "minLength": 1
          "maxLength": 20000
        "imageIds":
          "type": "array"
          "maxItems": 8
          "uniqueItems": true
          "items":
            "type": "string"
            "format": "uuid"
    "CopyMediaTemplateImageRequest":
      "type": "object"
      "additionalProperties": false
      "required":
        - "projectId"
        - "versionId"
      "properties":
        "projectId":
          "type": "string"
          "format": "uuid"
        "versionId":
          "type": "string"
          "format": "uuid"
    "ImportMediaTemplateRequest":
      "type": "object"
      "additionalProperties": false
      "required":
        - "expectedTemplateVersion"
        - "commandKey"
      "properties":
        "expectedTemplateVersion":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "commandKey":
          "type": "string"
          "minLength": 1
          "maxLength": 200
    "ImportedMediaTemplateImage":
      "type": "object"
      "required":
        - "versionId"
        - "assetId"
        - "title"
        - "contentType"
        - "byteSize"
        - "width"
        - "height"
        - "thumbnailUrl"
      "properties":
        "versionId":
          "type": "string"
          "format": "uuid"
        "assetId":
          "type": "string"
          "format": "uuid"
        "title":
          "type": "string"
          "maxLength": 160
        "contentType":
          "type": "string"
        "byteSize":
          "type": "integer"
          "format": "int64"
        "width":
          "type": "integer"
          "minimum": 1
        "height":
          "type": "integer"
          "minimum": 1
        "thumbnailUrl":
          "type": "string"
    "MediaTemplateImport":
      "type": "object"
      "required":
        - "templateId"
        - "templateVersion"
        - "targetKind"
        - "prompt"
        - "images"
      "properties":
        "templateId":
          "type": "string"
          "format": "uuid"
        "templateVersion":
          "type": "integer"
          "format": "int64"
          "minimum": 0
        "targetKind":
          "type": "string"
          "enum":
            - "IMAGE"
            - "VIDEO"
        "prompt":
          "type": "string"
          "minLength": 1
          "maxLength": 20000
        "images":
          "type": "array"
          "maxItems": 8
          "items":
            "$ref": "#/components/schemas/ImportedMediaTemplateImage"
    LibraryCategory:
      type: "string"
      enum: ["CHARACTER", "SCENE", "PROP", "OTHER"]
    LibrarySort:
      type: "string"
      enum: ["SAVED", "NAME", "UPDATED"]
    LibraryEntry:
      type: "object"
      additionalProperties: false
      required: ["id", "name", "category", "kind", "textContent", "contentType", "byteSize", "width", "height", "durationMs", "hasThumbnail", "source", "favorite", "trashedAt", "version", "createdAt", "updatedAt"]
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          minLength: 1
          maxLength: 160
        category:
          $ref: "#/components/schemas/LibraryCategory"
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        textContent:
          type: ["object", "null"]
          additionalProperties: true
        contentType:
          type: ["string", "null"]
        byteSize:
          type: ["integer", "null"]
        width:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
        durationMs:
          type: ["integer", "null"]
        hasThumbnail:
          type: "boolean"
        source:
          type: "object"
          additionalProperties: true
        favorite:
          type: "boolean"
        trashedAt:
          type: ["string", "null"]
          format: "date-time"
        version:
          type: "integer"
          format: "int64"
          minimum: 0
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    LibraryPage:
      type: "object"
      additionalProperties: false
      required: ["items", "nextCursor", "total", "categoryCounts"]
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/LibraryEntry"
        nextCursor:
          type: ["string", "null"]
        total:
          type: "integer"
          minimum: 0
        categoryCounts:
          type: "object"
          additionalProperties:
            type: "integer"
            minimum: 0
    LibraryCommand:
      type: "object"
      additionalProperties: false
      required: ["id", "status", "result", "errorCode", "errorDetail"]
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum: ["ACCEPTED", "ARCHIVING", "SUCCEEDED", "FAILED"]
        result:
          type: ["object", "null"]
          additionalProperties: false
          required: []
          properties:
            entryId:
              type: "string"
              format: "uuid"
            artifactId:
              type: "string"
              format: "uuid"
            versionId:
              type: "string"
              format: "uuid"
            canvasItemId:
              type: "string"
              format: "uuid"
            draftVersion:
              type: "integer"
              format: "int64"
              minimum: 0
            alreadySaved:
              type: "boolean"
            trashed:
              type: "boolean"
        errorCode:
          type: ["string", "null"]
        errorDetail:
          type: ["string", "null"]
          description: Public failure explanation localized using Accept-Language. Internal message keys and interpolation arguments are never exposed.
    LibrarySource:
      type: "object"
      additionalProperties: false
      required: ["title", "kind", "versionId", "expectedSelectionEpoch", "expectedArtifactVersion", "textContent", "assetId", "versionNo"]
      properties:
        title:
          type: "string"
          minLength: 1
          maxLength: 160
        kind:
          $ref: "#/components/schemas/ArtifactKind"
        versionId:
          type: "string"
          format: "uuid"
        expectedSelectionEpoch:
          type: "integer"
          format: "int64"
          minimum: 0
        expectedArtifactVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        textContent:
          type: ["object", "null"]
          additionalProperties: true
        assetId:
          type: ["string", "null"]
          format: "uuid"
        versionNo:
          type: "integer"
          minimum: 1
    SaveLibraryRequest:
      type: "object"
      additionalProperties: false
      required: ["versionId", "expectedSelectionEpoch", "name", "category", "commandKey"]
      properties:
        versionId:
          type: "string"
          format: "uuid"
        expectedSelectionEpoch:
          type: "integer"
          format: "int64"
          minimum: 0
        expectedArtifactVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        name:
          type: "string"
          minLength: 1
          maxLength: 160
        category:
          $ref: "#/components/schemas/LibraryCategory"
        commandKey:
          type: "string"
          minLength: 1
          maxLength: 200
    UpdateLibraryRequest:
      type: "object"
      additionalProperties: false
      required: ["expectedVersion", "name", "category", "favorite"]
      properties:
        expectedVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        name:
          type: "string"
          minLength: 1
          maxLength: 160
        category:
          $ref: "#/components/schemas/LibraryCategory"
        favorite:
          type: "boolean"
    LibraryVersionRequest:
      type: "object"
      additionalProperties: false
      required: ["expectedVersion"]
      properties:
        expectedVersion:
          type: "integer"
          format: "int64"
          minimum: 0
    ImportLibraryRequest:
      type: "object"
      additionalProperties: false
      required: ["entryId", "expectedVersion", "x", "y", "commandKey"]
      properties:
        entryId:
          type: "string"
          format: "uuid"
        expectedVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        x:
          type: "number"
          minimum: -1000000
          maximum: 1000000
        y:
          type: "number"
          minimum: -1000000
          maximum: 1000000
        commandKey:
          type: "string"
          minLength: 1
          maxLength: 200
    ReferenceLibraryRequest:
      type: "object"
      additionalProperties: false
      required: ["entryId", "expectedVersion", "draft", "role", "color", "commandKey"]
      properties:
        slotKey: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_]{0,63}$", description: "Optional active named workflow media slot; the imported project-local version is assigned atomically with the draft update. Omit for ordinary media references."}
        entryId:
          type: "string"
          format: "uuid"
        expectedVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        draft:
          $ref: "#/components/schemas/SaveMediaDraftRequest"
        role:
          type: "string"
          enum: ["REFERENCE", "START_FRAME", "END_FRAME", "AUDIO_REFERENCE", "VIDEO_REFERENCE"]
        color:
          type: "string"
          pattern: "^#[0-9A-F]{6}$"
        commandKey:
          type: "string"
          minLength: 1
          maxLength: 200
    CallLogCleanupResult:
      type: object
      required: [cleanedExecutions, batchLimitReached]
      properties:
        cleanedExecutions: {type: integer, minimum: 0, maximum: 10000}
        batchLimitReached: {type: boolean}
    CallLogRetentionSettings:
      type: object
      required: [retentionDays, version]
      properties:
        retentionDays: {type: [integer, "null"], minimum: 1, maximum: 3650, default: null}
        version: {type: integer, minimum: 1}
    DebugSettings:
      type: object
      required: [debugMode, version]
      properties:
        debugMode: {type: boolean, default: false}
        version: {type: integer, minimum: 1}
    DebugBody:
      type: object
      required: [content, encoding, truncated]
      properties:
        content: {type: string}
        encoding: {type: string, enum: [UTF8, BASE64, MULTIPART_JSON, OMITTED]}
        truncated: {type: boolean}
    DebugExchange:
      type: object
      required: [method, url, requestBody, responseStatus, responseBody, responseIdentifiers]
      properties:
        method: {type: string}
        url: {type: string}
        requestBody:
          oneOf:
            - {$ref: "#/components/schemas/DebugBody"}
            - {type: "null"}
        responseIdentifiers:
          type: object
          description: 开启 debug 后采集的第三方响应关联 ID；键为小写来源字段。仅允许 x-request-id、request-id、x-trace-id、trace-id、traceparent、x-amzn-requestid、x-amzn-trace-id、x-b3-traceid、x-log-id、x-tt-logid；其他响应头不保存。旧记录或供应商未返回时为空对象。
          additionalProperties: {type: string, maxLength: 512}
        responseStatus: {type: [integer, "null"]}
        responseBody:
          oneOf:
            - {$ref: "#/components/schemas/DebugBody"}
            - {type: "null"}
    CallDebug:
      type: object
      required: [id, captured, exchanges, llmStream]
      properties:
        id: {type: string, format: uuid}
        captured: {type: boolean}
        exchanges:
          type: array
          items: {$ref: "#/components/schemas/DebugExchange"}
        llmStream:
          description: 流式 LLM 结束后异步保存；指标始终采集，正文仅在调用开始时开启 debug 才保存。历史及尚未写入时为 null。
          oneOf:
            - {$ref: "#/components/schemas/LlmStreamLog"}
            - {type: "null"}
    LlmStreamLog:
      type: object
      required: [metrics, content]
      properties:
        metrics: {$ref: "#/components/schemas/LlmStreamMetrics"}
        content:
          oneOf:
            - {$ref: "#/components/schemas/LlmStreamContent"}
            - {type: "null"}
    LlmStreamMetrics:
      type: object
      required: [schemaVersion, firstChunkMs, firstTextMs, durationMs, chunkCount, promptTokens, completionTokens, totalTokens, model, responseId, finishReasons, status, errorCode]
      properties:
        schemaVersion: {type: integer, const: 2}
        firstChunkMs:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: 从流订阅到首个已解析 ChatResponse 片段；不是 HTTP 首字节。
        firstTextMs:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: 首字延迟，从流订阅到首个非空公开文本增量；仅工具或无文本时为 null。
        durationMs: {type: integer, format: int64, minimum: 0}
        chunkCount: {type: integer, format: int64, minimum: 0}
        promptTokens: {type: [integer, "null"], minimum: 0}
        completionTokens: {type: [integer, "null"], minimum: 0}
        totalTokens: {type: [integer, "null"], minimum: 0, description: 仅保存实际用量；缺失或全零补值为 null。}
        model: {type: [string, "null"]}
        responseId: {type: [string, "null"]}
        finishReasons: {type: array, items: {type: string}}
        status: {type: string, enum: [COMPLETED, FAILED, CANCELED]}
        errorCode: {type: [string, "null"], description: 稳定错误分类，不保存异常消息或堆栈。}
    LlmStreamContent:
      type: object
      required: [response, truncated]
      properties:
        response: {type: string, description: 单份模型响应 JSON（有 HTTP 时为聚合的 Chat Completions 响应，否则为 schemaVersion=1 的模型协议），仅省略结构化图片字节；包含实际模型文本、工具调用及元数据（包括推理字段），不做凭据或正则替换；至多 1 MiB，失败或取消保留已收到的部分。流式 HTTP/SSE 响应按分片顺序聚合，只保存这一份响应；exchanges.responseBody 为 null。无 HTTP 采集时使用 SDK 模型汇总；超限或未完整解析标记 truncated。}
        truncated: {type: boolean, description: 日志汇总超限或无法安全序列化，不影响模型调用。}
    CallLogPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CallLog"}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, format: int64, minimum: 0}
    CallLog:
      type: object
      required: [id, projectId, projectTitle, taskId, runId, kind, operation, status, taskStatus, provider, model, traceId, providerRequestId, errorCode, startedAt, respondedAt, durationMs, historical, mock]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        projectTitle: {type: string}
        taskId: {type: [string, "null"], format: uuid}
        runId: {type: [string, "null"], format: uuid}
        kind: {type: string, enum: [LLM, IMAGE, VIDEO, AUDIO]}
        operation: {type: string, enum: [CHAT, SUBMIT, POLL, LEGACY]}
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED, UNKNOWN]
          description: 单次调用结果；异步受理或轮询返回等待也表示本次调用成功，不表示任务已生成完成。
        taskStatus:
          type: [string, "null"]
          enum: [READY, RUNNING, SUBMITTING, WAITING_PROVIDER, UNKNOWN, BLOCKED, SUCCEEDED, FAILED, CANCELED, null]
        provider: {type: [string, "null"]}
        model: {type: [string, "null"]}
        traceId: {type: [string, "null"]}
        providerRequestId:
          type: [string, "null"]
          description: LLM 为响应正文的生成 ID（界面标为生成 ID），媒体为原 Provider 任务 ID；不代表 HTTP 响应头中的请求或追踪 ID。第三方响应关联 ID 见 DebugExchange.responseIdentifiers。
        errorCode: {type: [string, "null"]}
        startedAt: {type: string, format: date-time}
        respondedAt:
          type: [string, "null"]
          format: date-time
          description: 本次受控模型或媒体适配器返回或抛出的时间；适配器内部可能包含下载和媒体处理，不是底层 HTTP 首字节时间。
        durationMs:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: 适配器调用的单调时钟耗时，不含后置审计写入或 Worker 的结果提交；旧适配器内部处理和 Mock 渲染计入其中。
        historical: {type: boolean}
        mock: {type: boolean}
    MediaSettings:
      type: object
      additionalProperties: false
      required: [connections, defaults]
      properties:
        connections:
          type: array
          items: {$ref: "#/components/schemas/MediaConnection"}
        defaults:
          type: array
          items: {$ref: "#/components/schemas/MediaDefault"}
    MediaConnection:
      type: object
      additionalProperties: false
      required: [id, name, platform, enabled, version, connectionVersion, origin,
        keyMask, connectivityStatus, realGenerationTested, capabilities]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        platform: {type: string, enum: [LOCAL, MOCK, COMFYUI, OPENAI, ARK, GOOGLE, VOLCENGINE, AUTODL, RUNNINGHUB]}
        enabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
        connectionVersion: {type: integer, minimum: 1}
        origin: {type: [string, "null"], description: "COMFYUI base URL with its entire path redacted as /[configured-path], RUNNINGHUB HTTPS root without a domain allowlist, or optional OPENAI/GOOGLE HTTPS API base URL; null uses the platform official endpoint."}
        keyMask: {type: [string, "null"]}
        connectivityStatus: {type: string, enum: [NOT_CHECKED]}
        realGenerationTested: {type: boolean}
        capabilities:
          type: array
          items: {$ref: "#/components/schemas/MediaCapability"}
    MediaCapability:
      type: object
      additionalProperties: false
      required: [id, name, enabled, version, capabilityVersion, adapterId, kind,
        minimumSeconds, maximumSeconds, maxReferenceImages, maxReferenceAudios, maxReferenceVideos, supportedVideoInputModes,
        defaultVideoInputMode, supportsEndFrame, supportedImageAspectRatios,
        supportedImageResolutions, supportedImageQualities, supportsTransparentBackground,
        supportsImageMask,
        mappingSha256, settings]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
        capabilityVersion: {type: integer, minimum: 1}
        adapterId: {type: string}
        kind: {type: string, enum: [IMAGE_GENERATION, VIDEO_GENERATION, AUDIO_GENERATION]}
        minimumSeconds: {type: integer, minimum: 0}
        maximumSeconds: {type: integer, minimum: 0}
        maxReferenceImages: {type: integer, minimum: 0}
        maxReferenceAudios: {type: integer, minimum: 0, maximum: 14}
        maxReferenceVideos: {type: integer, minimum: 0, maximum: 14}
        supportedVideoInputModes:
          type: array
          uniqueItems: true
          items: {$ref: "#/components/schemas/VideoInputMode"}
        defaultVideoInputMode:
          oneOf:
            - {$ref: "#/components/schemas/VideoInputMode"}
            - {type: "null"}
        supportsEndFrame: {type: boolean}
        supportedImageAspectRatios:
          type: array
          uniqueItems: true
          items: {type: string, enum: [AUTO, "1:1", "2:3", "3:2", "9:16", "16:9", "3:4", "4:3", "21:9"]}
        supportedImageResolutions:
          type: array
          uniqueItems: true
          items: {type: string, enum: [1K, 2K, 4K]}
        supportedImageQualities:
          type: array
          uniqueItems: true
          items: {type: string, enum: [low, medium, high]}
        supportsTransparentBackground: {type: boolean}
        supportsImageMask: {type: boolean}
        mappingSha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        settings: {$ref: "#/components/schemas/FixedMediaAdapterSettings"}
    FixedMediaAdapterSettings:
      type: object
      additionalProperties: false
      description: Versioned settings within a compiled adapter protocol. New ComfyUI publication requires comfyWorkflow; legacy model-only capabilities retain their snapshot for recovery and metadata changes. OPENAI and GOOGLE accept a compatible model name and a connection API base URL. Defaults fill missing draft fields; limits narrow the published declaration. Pricing is an administrator estimate, never an actual provider charge.
      properties:
        comfyWorkflow: {$ref: "#/components/schemas/ComfyUiWorkflowDefinition"}
        comfyInputs:
          type: array
          readOnly: true
          maxItems: 80
          description: Derived creator input metadata for a published ComfyUI graph. Includes declared scalar parameters and synthesized PROMPT, reference_0 through reference_13 IMAGE slots, and video DURATION_SECONDS. Does not expose the graph or fixed private literals. Ignored on administrator writes and recomputed by the server.
          items: {$ref: "#/components/schemas/RunningHubField"}
        runningHub: {$ref: "#/components/schemas/RunningHubDefinition"}
        workflowId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$', description: AutoDL preset or administrator-published workflow ID. Must match workflowDefinition.id when a definition is present.}
        workflowDefinition: {$ref: '#/components/schemas/AutoDlWorkflowDefinition'}
        videoResolution: {type: string, pattern: '^[1-9][0-9]{2,3}p$', description: "AutoDL default resolution tier, included in videoResolutions; mapped to the workflow's exact enum using the frozen card/project aspect ratio. Unsupported combinations are rejected before task acceptance."}
        videoResolutions:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: {type: string, pattern: '^[1-9][0-9]{2,3}p$'}
          description: AutoDL published resolution tiers, restricted to the selected workflow. Omitted preserves the single videoResolution tier for historical capabilities.
        seed: {type: integer, format: int64, minimum: 1, maximum: 999999999999999, description: "Optional AutoDL seed, only for workflows that declare it."}
        checkpoint: {type: string, maxLength: 160}
        diffusionModel: {type: string, maxLength: 160}
        textEncoder: {type: string, maxLength: 160}
        vae: {type: string, maxLength: 160}
        clipVision: {type: string, maxLength: 160}
        quality: {type: string, enum: [low, medium, high]}
        model: {type: string, maxLength: 120, pattern: "^([A-Za-z0-9][A-Za-z0-9._:/-]{0,119})?$", description: "Empty uses the compiled default; only OPENAI/GOOGLE accept this field. GOOGLE preserves explicit API prefixes such as /v1beta; a bare origin uses /v1. Beta requests use generationConfig.imageConfig; stable requests use generationConfig.responseFormat.image."}
        defaultParameters:
          $ref: "#/components/schemas/ImageGenerationParameters"
          description: "Image defaults; video adapters accept aspectRatio only. Unsupported parameters are rejected."
        defaultDurationSeconds: {type: integer, minimum: 1, maximum: 30}
        minimumSeconds: {type: integer, minimum: 0, maximum: 30}
        maximumSeconds: {type: integer, minimum: 0, maximum: 30}
        maxReferenceImages: {type: integer, minimum: 0, maximum: 14}
        maxReferenceAudios: {type: integer, minimum: 0, maximum: 3}
        maxReferenceVideos: {type: integer, minimum: 0, maximum: 3}
        pricing: {$ref: "#/components/schemas/MediaCapabilityPricing"}
        pricingByResolution:
          type: object
          maxProperties: 16
          propertyNames: {pattern: '^[1-9][0-9]{2,3}p$'}
          additionalProperties: {$ref: '#/components/schemas/MediaCapabilityPricing'}
          description: AutoDL video estimates by a published resolution tier. Matching tier overrides pricing; otherwise pricing is the fallback. Missing both means unknown cost.
    ComfyUiGraph:
      type: object
      minProperties: 1
      maxProperties: 256
      propertyNames: {pattern: '^[0-9]{1,8}$'}
      description: Administrator-imported ComfyUI API-format DAG, at most 256 KiB. Node links and fixed literals are retained; no UI graph, installation commands, transport endpoints or headers are accepted.
      additionalProperties:
        type: object
        additionalProperties: false
        required: [class_type, inputs]
        properties:
          class_type: {type: string, minLength: 1, maxLength: 160}
          inputs:
            type: object
            maxProperties: 128
            additionalProperties: {}
            description: Fixed JSON literals or [nodeId, outputIndex] links. Mapping targets must be scalar literals; links are never overwritten.
          _meta:
            type: object
            additionalProperties: false
            properties:
              title: {type: string, maxLength: 160}
    ComfyUiWorkflowDefinition:
      type: object
      additionalProperties: false
      required: [schemaVersion, graph, bindings, output, width, height, minimumSeconds, maximumSeconds, fps, frameMultiple, frameOffset]
      description: COMFY_IMAGE_V1 / COMFY_VIDEO_V1 administrator-published workflow snapshot. Ordinary users and Agents cannot provide graphs or node mappings. Tasks pin the capability hash and both dimensions. Legacy capabilities without this field retain their fixed graph for recovery.
      properties:
        schemaVersion: {type: integer, enum: [1]}
        graph: {$ref: '#/components/schemas/ComfyUiGraph'}
        bindings:
          type: array
          minItems: 0
          maxItems: 128
          description: Unique target inputs on the selected result ancestry. PROMPT is optional; without it the creator prompt control is disabled. WIDTH/HEIGHT must occur together; video requires DURATION_SECONDS or FRAME_COUNT, and FRAME_COUNT also requires FPS. Multiple targets may share a source.
          items:
            type: object
            additionalProperties: false
            required: [nodeId, inputName, source]
            properties:
              nodeId: {type: string, pattern: '^[0-9]{1,8}$'}
              inputName: {type: string, minLength: 1, maxLength: 160}
              source: {type: string, enum: [PROMPT, NEGATIVE_PROMPT, SEED, WIDTH, HEIGHT, REFERENCE_IMAGE, DURATION_SECONDS, FRAME_COUNT, FPS, BATCH_SIZE]}
              referenceIndex: {type: [integer, "null"], minimum: 0, maximum: 13, description: Required for REFERENCE_IMAGE; zero-based contiguous indices of frozen project image inputs. All mapped images are required.}
        parameters:
          type: [array, "null"]
          maxItems: 64
          description: Optional administrator-declared scalar inputs exposed in the creator extended-parameters table. Supports STRING/NUMBER/INTEGER/BOOLEAN/SELECT with PARAMETER source and native encoding only. Targets must be existing scalar inputs on the selected output ancestry and cannot overlap bindings. Missing defaults derive from the published graph literal. Keys prompt, durationSeconds and reference_* are reserved. Existing schemaVersion=1 definitions without parameters remain valid.
          items: {$ref: "#/components/schemas/RunningHubField"}
        output:
          type: object
          additionalProperties: false
          required: [nodeId, field]
          properties:
            nodeId: {type: string, pattern: '^[0-9]{1,8}$'}
            field: {type: string, enum: [images, gifs, videos], description: Exact history field; image capabilities use images. One PNG/JPEG/WebP or MP4 output is required; ambiguous outputs are rejected. Safe relative output subfolders are supported.}
        width: {type: integer, minimum: 8, maximum: 4096}
        height: {type: integer, minimum: 8, maximum: 4096}
        minimumSeconds: {type: integer, minimum: 0, maximum: 30}
        maximumSeconds: {type: integer, minimum: 0, maximum: 30, description: Both zero for image; 1–30 seconds for video.}
        fps: {type: integer, minimum: 1, maximum: 120}
        frameMultiple: {type: integer, minimum: 1, maximum: 64}
        frameOffset: {type: integer, minimum: 0, maximum: 63, description: Less than frameMultiple. Frame count = floor(durationSeconds * fps / frameMultiple) * frameMultiple + frameOffset. BATCH_SIZE always injects one; the application splits image generation counts into independent tasks.}
    AutoDlWorkflowDefinition:
      type: object
      additionalProperties: false
      required: [schemaVersion, id, label, minimumSeconds, maximumSeconds, promptLimit, mode, imageFields, audioFields, minimumImages, minimumAudios, resolutions, defaultResolution, supportsSeed]
      description: Versioned data-only contract for the fixed AutoDL prompt/duration/video protocol. No graph, node IDs, scripts, endpoints or credentials. New same-protocol workflows need configuration only; other protocols are rejected. Resolution labels are exact provider enum values, not actual pixel guarantees.
      properties:
        schemaVersion: {type: integer, enum: [1]}
        id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$'}
        label: {type: string, minLength: 1, maxLength: 160}
        minimumSeconds: {type: integer, minimum: 1, maximum: 30}
        maximumSeconds: {type: integer, minimum: 1, maximum: 30}
        promptLimit: {type: integer, minimum: 1, maximum: 10000}
        mode: {$ref: '#/components/schemas/VideoInputMode'}
        imageFields:
          type: array
          maxItems: 14
          uniqueItems: true
          items: {type: string, pattern: '^(first_frame|last_frame|ref_image_[0-9]{1,2})$'}
        audioFields:
          type: array
          maxItems: 3
          uniqueItems: true
          items: {type: string, pattern: '^ref_audio_[0-9]$'}
        minimumImages: {type: integer, minimum: 0, maximum: 14}
        minimumAudios: {type: integer, minimum: 0, maximum: 3}
        resolutions:
          type: array
          minItems: 1
          maxItems: 48
          uniqueItems: true
          items: {type: string, pattern: '^[1-9][0-9]{2,3}p(横|竖|\(1:1\))(\([0-9]{1,5}\*[0-9]{1,5}\))?$'}
        defaultResolution: {type: string, pattern: '^[1-9][0-9]{2,3}p$'}
        supportsSeed: {type: boolean}
    RunningHubScalar:
      oneOf:
        - {type: string, maxLength: 20000}
        - {type: number}
        - {type: boolean}
    RunningHubDefinition:
      type: object
      additionalProperties: false
      required: [schemaVersion, protocolVersion, targetType, targetId, fields, outputs]
      description: Data-only local contract. No scripts, endpoints or credentials. Local versions do not freeze remote workflow implementations. Companion ZIP results are skipped without download or extraction; mapped primary media remains required.
      properties:
        schemaVersion: {type: integer, enum: [1]}
        protocolVersion: {type: string, enum: [V2]}
        targetType: {type: string, enum: [WORKFLOW, AI_APP]}
        targetId: {type: string, pattern: "^[0-9]{1,32}$", description: Real workflowId/webappId, not API directory SKU.}
        sourceSha256: {type: [string, "null"], pattern: "^[0-9a-f]{64}$"}
        importSource:
          description: Credential-checked normalized import JSON (256 KiB maximum). WORKFLOW retains its API graph; AI_APP retains only nodeInfoList. Administrator editing and candidate recovery only, never submitted for execution. Optional for older definitions; the complete definition is limited to 1 MiB.
          oneOf:
            - {type: object, additionalProperties: true}
            - {type: array, items: {}}
            - {type: "null"}
        nodeOptions:
          type: [array, "null"]
          maxItems: 2048
          description: Display-only imported workflow node catalog, including nodes without editable inputs. Does not infer output media types or authorize execution. Older definitions may omit it.
          items:
            type: object
            additionalProperties: false
            required: [nodeId, label]
            properties:
              nodeId: {type: string, pattern: "^[0-9]{1,32}$"}
              label: {type: string, minLength: 1, maxLength: 160}
        instanceType: {type: [string, "null"], enum: [default, plus, ultra, null]}
        usePersonalQueue: {type: boolean, default: false}
        addMetadata: {type: boolean, default: false}
        retainSeconds: {type: [integer, "null"], minimum: 10, maximum: 180, description: Additional provider charge; disabled by default.}
        fields:
          type: array
          maxItems: 64
          items: {$ref: "#/components/schemas/RunningHubField"}
        fixedBindings:
          type: [array, "null"]
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [nodeId, fieldName, value]
            properties:
              nodeId: {type: string, pattern: "^[0-9]{1,32}$"}
              fieldName: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]{0,79}$"}
              value: {$ref: "#/components/schemas/RunningHubScalar"}
              encoding: {type: [string, "null"], enum: [NATIVE, STRING, null]}
        outputs:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [kind, primary, maxCount]
            properties:
              nodeId: {type: [string, "null"], pattern: "^[0-9]{1,32}$"}
              kind: {type: string, enum: [IMAGE, VIDEO, AUDIO]}
              primary: {type: boolean}
              maxCount:
                type: integer
                minimum: 1
                maximum: 16
                description: 按 Provider 结果及 ZIP 成员顺序选取此映射的前 N 个媒体结果。超出的结果和未映射附件跳过，不因返回数量超过上限而拒绝整个任务。
    RunningHubField:
      type: object
      additionalProperties: false
      required: [key, label, type, nodeId, fieldName]
      properties:
        key: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_]{0,63}$"}
        label: {type: string, minLength: 1, maxLength: 160}
        description: {type: [string, "null"], maxLength: 1000}
        type: {type: string, enum: [STRING, NUMBER, INTEGER, BOOLEAN, SELECT, IMAGE, AUDIO, VIDEO]}
        required: {type: boolean, default: false}
        advanced: {type: boolean, default: false}
        defaultValue:
          oneOf:
            - {$ref: "#/components/schemas/RunningHubScalar"}
            - {type: "null"}
        minimum: {type: [number, "null"]}
        maximum: {type: [number, "null"]}
        maxLength: {type: [integer, "null"], minimum: 1, maximum: 20000}
        options:
          type: [array, "null"]
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [label, value]
            properties:
              label: {type: string, minLength: 1, maxLength: 160}
              value: {$ref: "#/components/schemas/RunningHubScalar"}
        nodeId: {type: string, pattern: "^[0-9]{1,32}$"}
        fieldName: {type: string, minLength: 1, maxLength: 160, description: "Exact declared node input. RunningHub additionally requires [A-Za-z_][A-Za-z0-9_]{0,79}; ComfyUI permits imported graph input names including symbols and Unicode."}
        source: {type: [string, "null"], enum: [PARAMETER, PROMPT, DURATION_SECONDS, null]}
        encoding: {type: [string, "null"], enum: [NATIVE, STRING, null]}
        resourceFormat: {type: [string, "null"], enum: [FILE_NAME, URL, null]}
        enabledWhen:
          type: [object, "null"]
          additionalProperties: false
          required: [field, value]
          properties:
            field: {type: string}
            value: {$ref: "#/components/schemas/RunningHubScalar"}
    RunningHubImportRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, kind]
      properties:
        targetType: {type: string, enum: [WORKFLOW, AI_APP]}
        targetId: {type: string, pattern: "^[0-9]{1,32}$"}
        kind: {type: string, enum: [IMAGE_GENERATION, VIDEO_GENERATION, AUDIO_GENERATION]}
        source:
          description: Optional sanitized nodeInfoList or ComfyUI API-format JSON (256 KiB maximum). Omit for read-only discovery. No curl execution or credentials.
    RunningHubImportPreview:
      type: object
      additionalProperties: false
      required: [definition, warnings]
      properties:
        definition: {$ref: "#/components/schemas/RunningHubDefinition"}
        warnings:
          type: array
          description: Public discovery warnings localized using Accept-Language. Imported field labels and definition values retain their original content.
          items: {type: string}
    MediaCapabilityPricing:
      type: object
      additionalProperties: false
      required: [amount, currency, unit]
      properties:
        amount: {type: string, pattern: "^[0-9]{1,10}(\\.[0-9]{1,6})?$", description: "Administrator supplied unit price; up to six decimal places."}
        currency: {type: string, enum: [CNY, USD]}
        unit: {type: string, enum: [IMAGE, VIDEO, AUDIO, SECOND], description: "IMAGE for images; VIDEO or SECOND for videos; AUDIO or SECOND for audio (120 second conservative reservation)."}
    MediaDefault:
      type: object
      additionalProperties: false
      required: [kind, capabilityId, version]
      properties:
        kind: {type: string, enum: [IMAGE_GENERATION, VIDEO_GENERATION, AUDIO_GENERATION]}
        capabilityId: {type: [string, "null"], format: uuid, description: "Null when no capability is available in the active deployment mode, including a retained Mock default in CONFIGURED mode."}
        version: {type: integer, format: int64, minimum: 0}
    CreateMediaConnectionRequest:
      type: object
      additionalProperties: false
      required: [name, platform]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        platform: {type: string, enum: [MOCK, COMFYUI, OPENAI, ARK, GOOGLE, VOLCENGINE, AUTODL, RUNNINGHUB]}
