      summary: 汇总与板上镜头或生产节点关联的 Agent 审批批次与结果候选，待处理优先，最多 100 条
      tags: [Projects]
      responses:
        "200":
          description: 最多 100 条关联批次，PENDING、APPROVED 优先，各状态组内按创建时间倒序；镜头关联无需先绑定生产节点。超过上限的待处理批次需回原导演对话处理。决策仍调用既有审批接口，归档结果须用户显式选用并保存分镜。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/AgentMediaApproval"}
