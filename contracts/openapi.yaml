        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: createRun
      summary: 幂等创建一个持久化 Agent Run
      tags: [Runs]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRunRequest"}
      responses:
        "202":
          description: 新建或精确重放的 Run
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ["true", "false"]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentRun"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceStopping"}
  /api/v1/projects/{projectId}/runs/preflight:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      operationId: getRunPreflight
      summary: 运行前查看模型、精确输入和服务端限额
      description: 在一致性只读快照中核验项目没有活动 Run，再预览会话历史；项目已有活动 Run 时返回 409 ACTIVE_RUN_EXISTS。
      tags: [Runs]
      parameters:
        - name: conversationId
          in: query
          description: 缺省预览 Agent 当前会话；新 Agent 可以没有会话。
          schema: {type: string, format: uuid}
        - name: agentId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: 当前配置与输入范围的只读预览；创建时仍以服务端实时快照为准
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunPreflight"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    post:
      operationId: previewSkillRun
      tags: [Skills]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunPreflightRequest"}
      responses:
        "200":
          description: 已鉴权的固定内容或持久操作状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunPreflight"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
