        '200':
          description: Administrator-only catalog candidates; publication is explicit
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, label]
                      properties:
                        id: {type: string}
                        label: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '502': {description: Problem response, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/settings/autodl-workflows/preview:
    post:
      operationId: previewAutoDlWorkflow
