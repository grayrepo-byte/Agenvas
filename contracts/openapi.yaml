          description: 配置状态，不包含凭证明文或密文
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LlmSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    put:
      operationId: replaceLlmSettings
      summary: 用完整新凭证替换活动模型配置版本
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReplaceLlmSettingsRequest"}
      responses:
        "200":
          description: 新版本的脱敏状态
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LlmSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/settings/diagnostics:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getSystemDiagnostics
      summary: 读取管理员本地系统诊断，不连接或生成付费 Provider 请求
      tags: [Settings]
      responses:
        "200":
          description: 数据库、存储和 Provider 配置状态及七天内任务错误摘要
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemDiagnostics"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/settings/llm/diagnose:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
