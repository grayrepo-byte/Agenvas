    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - name: operation
        in: path
        required: true
        schema: {$ref: "#/components/schemas/MediaFunction"}
    put:
      operationId: updateMediaFunction
      summary: 通过 CAS 为图片或视频功能绑定已发布且输入输出兼容的能力
      description: capabilityId=null 停用入口执行；图片与视频以 IMAGE_/VIDEO_ 前缀区分。图片几何操作只支持固定本地处理；图片深度与放大支持本地或单图片输入的 RunningHub，生成式图片工具还支持已启用的 OpenAI/Google 参考图能力或 ComfyUI 固定图片参考编辑模板，透明输出工具须支持透明背景。深度和音轨分离可选内置本地能力，视频高清必须绑定兼容的第三方 AI 能力。当前云端支持 RunningHub 的单视频输入及匹配主输出类型，固定 ComfyUI 图生视频模板不兼容，不伪装成视频后处理。新适配器须实现并声明兼容协议后才可绑定。
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, capabilityId]
              properties:
                expectedVersion: {type: integer, format: int64, minimum: 0}
                capabilityId: {type: [string, "null"], format: uuid}
      responses:
        "200":
          description: 保存后的所有功能设置
