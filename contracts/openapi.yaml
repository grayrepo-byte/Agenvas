  /api/v1/settings/media-connections/{connectionId}/capabilities:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - name: connectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: createMediaCapability
      summary: 幂等发布一个已安装的固定适配器能力
      tags: [Settings]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMediaCapabilityRequest"}
      responses:
        "200":
          description: 发布后的脱敏配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/settings/media-connections/{connectionId}/capabilities/{capabilityId}:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - name: connectionId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: capabilityId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: updateMediaCapability
      summary: 使用 expectedVersion 修改能力并保留已发布版本
      description: RunningHub capabilities may change their primary media type by switching between RUNNINGHUB_IMAGE, RUNNINGHUB_VIDEO and RUNNINGHUB_AUDIO with a matching primary output. This creates a new immutable capability version and clears its previous media type default selection with a version increment. Existing task bindings retain their original version; other adapters keep their media type fixed.
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMediaCapabilityRequest"}
      responses:
        "200":
          description: 修改后的脱敏配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      operationId: deleteMediaCapability
      summary: 使用 expectedVersion 删除能力并清空默认选择及功能绑定
      description: Removes the capability from settings and published catalogs. Immutable versions and existing drafts remain available for accepted task recovery and reference cleanup. New runs and edits are rejected. Built-in LOCAL capabilities cannot be deleted.
      tags: [Settings]
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        "200":
          description: 删除后的脱敏配置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MediaSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
