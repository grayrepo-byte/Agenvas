    MediaFunction:
      type: string
      enum: [IMAGE_SMART_EDIT, IMAGE_COSTUME_EXTRACT, IMAGE_RELIGHT, IMAGE_OUTPAINT, IMAGE_THREE_VIEW, IMAGE_LAYER_SPLIT, IMAGE_EXPRESSION_EDIT, IMAGE_REMOVE_BACKGROUND, IMAGE_OBJECT_REMOVE, IMAGE_VIEW_ANGLE, IMAGE_DEPTH_MAP, IMAGE_UPSCALE, IMAGE_RESIZE, IMAGE_CROP, IMAGE_ROTATE, IMAGE_FLIP_HORIZONTAL, IMAGE_FLIP_VERTICAL, VIDEO_DEPTH_MAP, VIDEO_EXTRACT_AUDIO, VIDEO_UPSCALE]
    MediaFunctionSetting:
      type: object
      required: [operation, capabilityId, version]
      properties:
        operation: {$ref: "#/components/schemas/MediaFunction"}
        capabilityId: {type: [string, "null"], format: uuid}
        version: {type: integer, format: int64, minimum: 0}
    VideoCompositionPreview:
      type: object
      additionalProperties: false
      required: [durationMs, frames, fontFamily, shots]
      properties:
        durationMs: {type: integer, minimum: 1, maximum: 60000}
        frames: {type: integer, minimum: 1, maximum: 1800}
        fontFamily: {type: string, minLength: 1, maxLength: 80}
        shots:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [videoVersionId, timelineStartMs, durationMs, lines]
            properties:
              videoVersionId: {type: string, format: uuid}
              timelineStartMs: {type: integer, minimum: 0, maximum: 59999}
              durationMs: {type: integer, minimum: 1, maximum: 60000}
              lines:
                type: array
                maxItems: 30
                items:
                  type: object
                  additionalProperties: false
                  required: [audioVersionId, startMs, endMs, trimStartMs, trimEndMs, speed]
                  properties:
                    audioVersionId: {type: string, format: uuid}
                    startMs: {type: integer, minimum: 0, maximum: 59999}
                    endMs: {type: integer, minimum: 1, maximum: 60000}
                    trimStartMs: {type: integer, minimum: 0, maximum: 599999}
                    trimEndMs: {type: integer, minimum: 1, maximum: 600000}
                    speed: {type: number, minimum: 1, maximum: 1.15}
    VideoCompositionRequest:
      type: object
      additionalProperties: false
      required: [title, shots]
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        rationale: {type: string, maxLength: 2000, description: 面向用户的简短编排依据，不保存模型私有推理}
        originalAudioMode: {type: string, enum: [MUTE, BACKGROUND, KEEP], default: MUTE}
        output:
          type: object
          additionalProperties: false
          properties:
            resolution: {type: string, enum: [720P, 1080P], default: 720P}
            aspectRatio: {type: string, enum: ['16:9', '9:16', '1:1'], default: '16:9'}
        music:
          type: object
          additionalProperties: false
          required: [audioVersionId]
          properties:
            audioVersionId: {type: string, format: uuid}
            sourceStartMs: {type: integer, minimum: 0, maximum: 599999, default: 0}
            volume: {type: number, minimum: 0, maximum: 1, default: 0.2}
        subtitles:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [text, startMs, endMs]
            properties:
              text: {type: string, minLength: 1, maxLength: 500}
              startMs: {type: integer, minimum: 0, maximum: 59999}
              endMs: {type: integer, minimum: 1, maximum: 60000}
        shots:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required: [videoVersionId, lines]
            properties:
              videoVersionId: {type: string, format: uuid}
              sourceStartMs: {type: integer, minimum: 0, maximum: 599999, default: 0}
              durationMs:
                type: integer
                minimum: 100
                maximum: 600000
                description: 取源时长；省略时取素材剩余长度；成片时长按速度换算并受60秒总限约束
              speed: {type: number, minimum: 0.5, maximum: 2, default: 1}
              fadeMs: {type: integer, minimum: 0, maximum: 500, default: 0, description: 每镜开头及结尾的淡黑时长，不重叠镜头}
              lines:
                type: array
                maxItems: 30
                items:
                  type: object
                  additionalProperties: false
                  required: [audioVersionId]
                  properties:
                    audioVersionId: {type: string, format: uuid}
                    startMs: {type: integer, minimum: 0, maximum: 59999, description: 可选镜内锚点；省略时依声音活动自动排布}
    RunAudioTrimRequest:
      type: object
      additionalProperties: false
      required: [canvasItemId, sourceVersionId, expectedCanvasItemVersion, startMs, endMs]
      properties:
        canvasItemId: {type: string, format: uuid}
        sourceVersionId: {type: string, format: uuid}
        expectedCanvasItemVersion: {type: integer, format: int64, minimum: 0}
        startMs: {type: integer, minimum: 0, maximum: 599900, description: 包含此起点，单位毫秒}
        endMs: {type: integer, minimum: 100, maximum: 600000, description: 不包含此终点，至少比起点晚100ms，且不超过来源时长}
        format: {type: string, enum: [WAV, MP3], default: WAV}
    RunVideoOperationRequest:
      type: object
      additionalProperties: false
      required: [canvasItemId, sourceVersionId, expectedCanvasItemVersion, operation, expectedFunctionVersion, expectedCapabilityVersion, parameters]
      properties:
        canvasItemId: {type: string, format: uuid}
        sourceVersionId: {type: string, format: uuid}
        expectedCanvasItemVersion: {type: integer, format: int64, minimum: 0}
        operation: {$ref: "#/components/schemas/VideoOperation"}
        expectedFunctionVersion: {type: integer, format: int64, minimum: 0}
        expectedCapabilityVersion: {type: integer, minimum: 1}
        prompt: {type: [string, "null"], maxLength: 4000}
        parameters:
          type: object
          additionalProperties: false
          properties:
            format: {type: string, enum: [WAV, MP3], description: 仅本地音频提取；缺省WAV，长素材可显式选MP3}
            trackIndex: {type: integer, minimum: 0, maximum: 31, description: 仅本地音频提取，音轨索引从0开始}
            dynamicValues:
              type: object
              additionalProperties: {type: [string, number, boolean]}
    RunImageOperationRequest:
      type: object
      additionalProperties: false
      required: [canvasItemId, sourceVersionId, expectedCanvasItemVersion, operation, expectedFunctionVersion, expectedCapabilityVersion, parameters]
      properties:
        canvasItemId: {type: string, format: uuid}
        sourceVersionId: {type: string, format: uuid}
        expectedCanvasItemVersion: {type: integer, format: int64, minimum: 0}
        operation:
          type: string
          enum: [SMART_EDIT, COSTUME_EXTRACT, RELIGHT, OUTPAINT, THREE_VIEW, LAYER_SPLIT,
            EXPRESSION_EDIT, REMOVE_BACKGROUND, OBJECT_REMOVE, VIEW_ANGLE,
            DEPTH_MAP, UPSCALE, RESIZE, CROP, ROTATE, FLIP_HORIZONTAL, FLIP_VERTICAL]
        instruction: {type: [string, "null"], maxLength: 4000}
        expectedFunctionVersion: {type: integer, format: int64, minimum: 0}
        expectedCapabilityVersion: {type: integer, minimum: 1}
        referenceVersionIds:
          type: array
          maxItems: 15
          uniqueItems: true
          items: {type: string, format: uuid}
        maskAssetId: {type: [string, "null"], format: uuid}
        markupAssetId:
          type: [string, "null"]
          format: uuid
          description: "SMART_EDIT only. Same-project READY transparent PNG containing annotations, matching the oriented first source image. At most 16,777,216 pixels and 20 MiB. Mutually exclusive with maskAssetId; requires supportsImageMarkup."
        parameters: {$ref: "#/components/schemas/ImageOperationParameters"}
    ImageOperationParameters:
      type: object
      additionalProperties: false
      properties:
        dynamicValues:
          type: object
          additionalProperties: {type: [string, number, boolean]}
        resizeMode: {type: string, enum: [PERCENTAGE, LONGEST_EDGE], description: "RESIZE requires exactly the value for the selected mode; dimensions round to the nearest pixel (minimum 1), output is limited to 40 MP."}
        percentage: {type: number, minimum: 0.01, maximum: 1000}
        longestEdge: {type: integer, minimum: 1, maximum: 40000}
        scale: {type: integer, enum: [2, 4]}
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        width: {type: number, exclusiveMinimum: 0, maximum: 1}
        height: {type: number, exclusiveMinimum: 0, maximum: 1}
        quarterTurns: {type: integer, enum: [1, 2, 3]}
        aspectRatio: {type: string, enum: ["1:1", "2:3", "3:2", "9:16", "16:9", "3:4", "4:3", "21:9"]}
        threeViewType: {type: string, enum: [CHARACTER, FACE, PROP, SCENE_GRID]}
        lightingPreset:
          type: string
          enum: [GOLDEN_HOUR, BLUE_HOUR, OVERCAST_SOFT, MOONLIGHT, SOFT_STUDIO, NEON_NIGHT]
        brightness: {type: integer, minimum: -100, maximum: 100}
        colorTemperature: {type: integer, minimum: 2000, maximum: 10000}
        lightX: {type: number, minimum: 0, maximum: 1}
        lightY: {type: number, minimum: 0, maximum: 1}
        layerTarget: {type: string, enum: [FOREGROUND, BACKGROUND]}
        viewAngle:
          type: string
          enum: [FRONT, LEFT_THREE_QUARTER, RIGHT_THREE_QUARTER, LEFT_PROFILE,
            RIGHT_PROFILE, HIGH_ANGLE, LOW_ANGLE, BACK]
    RunTextGenerationRequest:
      type: object
      additionalProperties: false
      required: [prompt, expectedArtifactVersion, expectedCurrentVersionId]
      properties:
        prompt: {type: string, minLength: 1, maxLength: 20000}
        expectedArtifactVersion: {type: integer, format: int64, minimum: 0}
        expectedCurrentVersionId: {type: string, format: uuid}
    DirectMediaQueueStatus:
      type: object
      additionalProperties: false
      required: [waitingAhead, reason]
      properties:
        waitingAhead: {type: integer, format: int64, minimum: 0}
        reason:
          type: string
          enum: [NOT_QUEUED, WAITING_WORKER]
    MediaDraft:
      type: object
      additionalProperties: false
      required: [projectId, canvasItemId, prompt, parameters, durationSeconds, capabilityId, styleId,
        videoInputMode, mediaInputs, mentions, displayMode, version, createdAt, updatedAt]
      properties:
        projectId: {type: string, format: uuid}
        canvasItemId: {type: string, format: uuid}
        prompt: {type: string, maxLength: 20000}
        parameters: {$ref: "#/components/schemas/ImageGenerationParameters"}
        durationSeconds: {type: [integer, "null"], minimum: 1, maximum: 60, description: "草稿保存 1–60 整数秒并在能力切换时保留原时长；运行按所选适配器的范围校验。未声明时长字段的 RunningHub 视频和可灵动作控制可以为 null。"}
        capabilityId: {type: [string, "null"], format: uuid}
        styleId: {type: [string, "null"], format: uuid, description: Image/video only. Backend appends the selected preset after rendering media mentions; prompt remains user text. Disabled selections fail submission explicitly.}
        videoInputMode:
          oneOf:
            - {$ref: "#/components/schemas/VideoInputMode"}
            - {type: "null"}
        mediaInputs:
          type: array
          items: {$ref: "#/components/schemas/MediaInput"}
        mentions:
          type: array
          items: {$ref: "#/components/schemas/PromptMediaMention"}
        displayMode: {type: string, enum: [DRAFT, RESULT]}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AudioGenerationParameters:
      type: object
      additionalProperties: false
      properties:
        speaker: {type: string, pattern: "^[A-Za-z0-9_-]{0,120}$"}
        speechRate: {type: integer, minimum: -50, maximum: 100}
        loudnessRate: {type: integer, minimum: -50, maximum: 100}
        pitchRate: {type: integer, minimum: -12, maximum: 12}
    ImageGenerationParameters:
      type: object
      additionalProperties: false
      description: 媒体草稿的原子生成参数；图片使用图片字段，视频使用 aspectRatio 和协议支持的 videoResolution，音频使用 speaker 和 speechRate。缺省字段由服务端按兼容默认值补齐并在 Task 中冻结。
      properties:
        dynamicValues:
          type: object
          maxProperties: 78
          additionalProperties: {$ref: "#/components/schemas/RunningHubScalar"}
          description: RunningHub named inputs or ComfyUI declared scalar inputs and reference_0 through reference_13 slots. Media values are exact version UUIDs matched against deduplicated mediaInputs; the same version may supply multiple named slots. ComfyUI drafts without the dynamicValues property retain legacy positional assignment; an explicit empty object means all slots are unassigned. Arbitrary graph targets and URLs are rejected.
        speaker: {type: string, pattern: "^[A-Za-z0-9_-]{0,120}$"}
        speechRate: {type: integer, minimum: -50, maximum: 100}
        loudnessRate: {type: integer, minimum: -50, maximum: 100}
        pitchRate: {type: integer, minimum: -12, maximum: 12}
        aspectRatio: {type: string, enum: [AUTO, "1:1", "2:3", "3:2", "9:16", "16:9", "3:4", "4:3", "21:9"]}
        videoResolution: {type: string, pattern: '^[1-9][0-9]{2,3}p$', description: "AutoDL published resolution tier, MINIMAX_H3 768p/1440p (official 768P/2K), or KLING_VIDEO_3 720p/1080p/2160p (official 720p/1080p/4k). Omitted uses the capability default. Frozen into accepted tasks."}
        resolution: {type: string, enum: [1K, 2K, 4K]}
        quality: {type: string, enum: [low, medium, high, xhigh, max]}
        transparentBackground: {type: boolean}
        generationCount: {type: integer, enum: [1, 2, 4]}
    VideoInputMode:
      type: string
      enum: [TEXT, START_END, GENERAL_REFERENCE]
    MediaInputRole:
      type: string
      enum: [REFERENCE, START_FRAME, END_FRAME, AUDIO_REFERENCE, VIDEO_REFERENCE]
    SaveMediaInput:
      type: object
      additionalProperties: false
      required: [versionId, role, color]
      properties:
        versionId: {type: string, format: uuid}
        role: {$ref: "#/components/schemas/MediaInputRole"}
        color: {type: string, pattern: "^#[0-9A-F]{6}$"}
    MediaInputSource:
      type: object
      additionalProperties: false
      required: [id, type, connectionId]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [MANUAL, CONNECTION]}
        connectionId: {type: [string, "null"], format: uuid}
    MediaInput:
      type: object
      additionalProperties: false
      required: [versionId, artifactId, role, order, color, sources]
      properties:
        versionId: {type: string, format: uuid}
        artifactId: {type: string, format: uuid}
        role: {$ref: "#/components/schemas/MediaInputRole"}
        order: {type: integer, minimum: 0}
        color: {type: string, pattern: "^#[0-9A-F]{6}$"}
        sources:
          type: array
          items: {$ref: "#/components/schemas/MediaInputSource"}
    PromptMediaMention:
      type: object
      additionalProperties: false
      required: [versionId, role]
      properties:
        versionId: {type: string, format: uuid}
        role: {$ref: "#/components/schemas/MediaInputRole"}
    CanvasConnection:
      type: object
      additionalProperties: false
      required: [id, projectId, sourceCanvasItemId, targetCanvasItemId, relationType,
        sourceArtifactVersionId, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        sourceCanvasItemId: {type: string, format: uuid}
        targetCanvasItemId: {type: string, format: uuid}
        relationType: {type: string, enum: [MEDIA_INPUT, MEDIA_DERIVATION, PROMPT_INPUT]}
        sourceArtifactVersionId: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CanvasConnectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CanvasConnection"}}
    CreateCanvasConnectionRequest:
      description: "PROMPT_INPUT connects saved text to media nodes, follows saved text edits at acceptance, and needs no target draft version. sourceVersionId checks the text resource default at connection time. MEDIA_INPUT retains exact media version and draft CAS semantics."
      type: object
      additionalProperties: false
      required: [sourceCanvasItemId, targetCanvasItemId, sourceVersionId, relationType]
      properties:
        sourceCanvasItemId: {type: string, format: uuid}
        targetCanvasItemId: {type: string, format: uuid}
        sourceVersionId: {type: string, format: uuid}
        relationType: {type: string, enum: [MEDIA_INPUT, PROMPT_INPUT]}
        expectedTargetDraftVersion: {type: integer, format: int64, minimum: 0}
    DisconnectCanvasConnectionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0, description: Rejects delayed deletion of an older connection incarnation after copy redo.}
        expectedTargetDraftVersion: {type: integer, format: int64, minimum: 0}
    CanvasConnectionResult:
      type: object
      additionalProperties: false
      required: [connection, draft]
      properties:
        connection: {$ref: "#/components/schemas/CanvasConnection"}
        draft:
          oneOf:
            - {$ref: "#/components/schemas/MediaDraft"}
            - {type: "null"}
    DuplicateCanvasItemRequest:
      type: object
      additionalProperties: false
      required: [targetItemId, expectedSourceVersion, expectedSourceDraftVersion,
        x, y, width, height, zIndex]
      properties:
        targetItemId: {type: string, format: uuid}
        expectedSourceVersion: {type: integer, format: int64, minimum: 0}
        expectedSourceDraftVersion: {type: integer, format: int64, minimum: 0}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
    DuplicateCanvasItemResponse:
      type: object
      additionalProperties: false
      required: [item, draft]
      properties:
        item: {$ref: "#/components/schemas/CanvasItem"}
        draft: {$ref: "#/components/schemas/MediaDraft"}
    ReviseArtifactRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, content]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        title: {type: string, minLength: 1, maxLength: 160}
        content: {$ref: "#/components/schemas/WritableArtifactContent"}
    SelectArtifactVersionRequest:
      type: object
      additionalProperties: false
      required: [versionId, expectedVersion]
      properties:
        versionId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    SelectMediaVersionRequest:
      type: object
      additionalProperties: false
      required: [versionId, expectedVersion]
      properties:
        versionId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    UploadCanvasItemVersionRequest:
      type: object
      additionalProperties: false
      required: [targetItemId, expectedVersion, content]
      properties:
        targetItemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        purpose:
          type: string
          enum: [UPLOAD, BRUSH_MARKUP, DIRECTOR_3D]
          description: 不传时为 UPLOAD。BRUSH_MARKUP 和 DIRECTOR_3D 直接保存客户端合成图片，不调用模型或创建生成任务。前者必须固定来源图片版本并派生独立节点；后者可首次填充空图片节点，否则固定来源版本并派生独立节点。
        sourceVersionId:
          type: [string, "null"]
          format: uuid
          description: BRUSH_MARKUP 必填；DIRECTOR_3D 在空图片节点首次填充时为空，已有图片时必填。必须等于来源节点当前选用图片版本；普通上传不传。
        directorScene:
          $ref: "#/components/schemas/DirectorScene"
          description: 仅 DIRECTOR_3D 必填；保存到结果版本的 frozenInput.directorScene，用于重新打开导演台。
        content: {$ref: "#/components/schemas/WritableArtifactContent"}
    DirectorScene:
      description: 新场景使用 v2 三轴缩放；v1 统一缩放场景保留原样提交与重放，不改写既有版本。
      oneOf:
        - {$ref: "#/components/schemas/DirectorSceneV1"}
        - {$ref: "#/components/schemas/DirectorSceneV2"}
    DirectorSceneV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, aspectRatio, camera, objects]
      properties:
        schemaVersion: {type: integer, enum: [1]}
        aspectRatio: {type: string, enum: ["16:9", "9:16", "1:1", "4:3"]}
        camera: {$ref: "#/components/schemas/DirectorCamera"}
        objects:
          type: array
          maxItems: 32
          items: {$ref: "#/components/schemas/DirectorObjectV1"}
    DirectorSceneV2:
      type: object
      additionalProperties: false
      required: [schemaVersion, aspectRatio, camera, objects]
      properties:
        schemaVersion: {type: integer, enum: [2]}
        aspectRatio: {type: string, enum: ["16:9", "9:16", "1:1", "4:3"]}
        camera: {$ref: "#/components/schemas/DirectorCamera"}
        objects:
          type: array
          maxItems: 32
          items: {$ref: "#/components/schemas/DirectorObjectV2"}
    DirectorCamera:
      type: object
      additionalProperties: false
      required: [azimuth, elevation, distance, target, focalLength]
      properties:
        azimuth: {type: number, minimum: -180, maximum: 180}
        elevation: {type: number, minimum: -80, maximum: 80}
        distance: {type: number, minimum: 1, maximum: 50}
        target: {$ref: "#/components/schemas/DirectorVector3"}
        focalLength: {type: number, minimum: 18, maximum: 120}
    DirectorObjectV1:
      type: object
      additionalProperties: false
      required: [id, name, kind, position, rotation, scale, color]
      properties:
        id: {type: string, minLength: 1, maxLength: 64, pattern: '\S'}
        name: {type: string, minLength: 1, maxLength: 80, pattern: '\S'}
        kind: {type: string, enum: [ACTOR, BOX, SPHERE, CYLINDER]}
        position: {$ref: "#/components/schemas/DirectorVector3"}
        rotation: {type: number, minimum: -180, maximum: 180}
        scale: {type: number, minimum: 0.1, maximum: 5}
        color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
    DirectorObjectV2:
      type: object
      additionalProperties: false
      required: [id, name, kind, position, rotation, scale, color]
      properties:
        id: {type: string, minLength: 1, maxLength: 64, pattern: '\S'}
        name: {type: string, minLength: 1, maxLength: 80, pattern: '\S'}
        kind: {type: string, enum: [ACTOR, BOX, SPHERE, CYLINDER]}
        position: {$ref: "#/components/schemas/DirectorVector3"}
        rotation: {type: number, minimum: -180, maximum: 180}
        scale:
          type: object
          additionalProperties: false
          required: [x, y, z]
          description: 独立轴缩放倍率，X 为宽、Y 为高、Z 为深；每轴作用于对象的基础几何尺寸。
          properties:
            x: {type: number, minimum: 0.1, maximum: 5}
            y: {type: number, minimum: 0.1, maximum: 5}
            z: {type: number, minimum: 0.1, maximum: 5}
        color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
    DirectorVector3:
      type: object
      additionalProperties: false
      required: [x, y, z]
      properties:
        x: {type: number, minimum: -20, maximum: 20}
        y: {type: number, minimum: -20, maximum: 20}
        z: {type: number, minimum: -20, maximum: 20}
    ArtifactInputReference:
      type: object
      additionalProperties: false
      required: [versionId, role, order, kind]
      properties:
        versionId: {type: string, format: uuid}
        role: {type: string, minLength: 1, maxLength: 64}
        order: {type: integer, minimum: 0}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
    FrozenPromptInput:
      type: object
      additionalProperties: false
      required: [connectionId, canvasItemId, artifactId, versionId, title, text]
      properties:
        connectionId: {type: string, format: uuid}
        canvasItemId: {type: string, format: uuid}
        artifactId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        title: {type: string}
        text: {type: string}
    MediaFrozenInput:
      type: object
      additionalProperties: true
      description: Immutable input of a media Task and its result; schema 7 fixes applicable applied character snapshots without resolving later profile revisions.
      properties:
        schemaVersion: {type: integer, minimum: 1, maximum: 7}
