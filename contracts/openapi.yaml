            image/jpeg:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
            video/mp4:
              schema: {type: string, format: binary}
        "206": {description: 部分文件，返回 Content-Range}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ObjectStorageFailure"}
        "416": {description: 请求的字节范围不可用}
    head:
      operationId: headAssetContent
      summary: 查询私有素材的大小及 MIME
      tags: [Assets]
      parameters:
        - name: Range
          in: header
          schema: {type: string}
      responses:
