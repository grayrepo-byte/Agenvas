  /api/v1/settings/system-logs:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: listSystemLogs
      summary: 读取当前后端进程的 stdout / stderr
      description: |
        仅管理员可读，Cache-Control 为 no-store。最多保留最近 2000 行，单行最多 8192 字节；
        在换行后采集，超长行尾部丢弃并标记 truncated。按 sequence 正序返回最新的匹配行。
        search 在脱敏后的内容上进行不区分大小写的字面匹配。重启后 processId 改变且日志重新开始。
        droppedCount 是本次进程因容量淘汰的总行数，matchedCount 是保留范围内的匹配总数。
        日志不持久化，不包含 stdin、原生文件描述符写入、子进程或其他容器输出。
      tags: [Settings]
      parameters:
        - name: stream
          in: query
          schema: {type: string, enum: [STDOUT, STDERR]}
        - name: search
          in: query
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
      responses:
        "200":
          description: 当前进程的脱敏输出快照
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemLogSnapshot"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/call-logs:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: listCallLogs
      summary: 分页读取本人项目与系统诊断的调用审计元数据
      description: |
        按 startedAt、id 倒序稳定排序。返回当前管理员自己的项目调用，以及仅活动管理员可见的全局模型诊断；不包含请求或响应正文、密钥和 endpoint。
        UNKNOWN 筛选同时匹配调用结果未知及当前 Task 状态 UNKNOWN，便于核对历史请求。
        historical=true 是旧检查点投影，startedAt 为原检查点时间；traceId、respondedAt、durationMs 不可追溯时为 null，不据此推算响应时间。
      tags: [Audit]
      parameters:
        - name: projectId
          in: query
          schema: {type: string, format: uuid}
        - name: kind
          in: query
          schema: {type: string, enum: [LLM, IMAGE, VIDEO, AUDIO]}
        - name: status
          in: query
          schema: {type: string, enum: [RUNNING, SUCCEEDED, FAILED, UNKNOWN]}
        - name: traceId
          in: query
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        - name: from
          in: query
          description: 调用开始时间下界（包含）
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: 调用开始时间上界（包含），不得早于 from
          schema: {type: string, format: date-time}
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: 调用日志页，越权或不存在的 projectId 返回空页
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallLogPage"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/settings/call-log-retention:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getCallLogRetentionSettings
      summary: 读取调用日志保留策略（默认永久，仅管理员）
      tags: [Audit]
      responses:
        "200":
          description: 持久化设置；Cache-Control 为 no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallLogRetentionSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updateCallLogRetentionSettings
      summary: 设置调用日志保留天数
      description: null 表示永久保留，天数范围 1–3650。仅更新策略，不自动清理；管理员手动清理所有状态的过期完整执行，包括未结束及 UNKNOWN。以完成时间（未结束使用创建时间）、最近任务活动及检查点时间判断过期。调用日志、debug 正文、模型回合、工具执行及 Provider 提交账本在同一事务删除，未结束执行先停止本地编排并递增任务租约 epoch，再清理；不承诺外部请求停止或退款，不再恢复或核对已清理请求。保留业务任务、Run 身份、产物和素材；旧对话的执行明细会消失。缩短策略也影响历史记录，删除不可恢复，改回永久不能恢复已清理日志。默认永久保证升级不主动删除数据。不会触发 Provider 请求。
      tags: [Audit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [retentionDays, expectedVersion]
              properties:
                retentionDays: {type: [integer, "null"], minimum: 1, maximum: 3650}
                expectedVersion: {type: integer, minimum: 1}
      responses:
        "200":
          description: 保存后的策略和版本
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallLogRetentionSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/settings/call-log-retention/cleanup:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: cleanupCallLogs
      summary: 手动清理到期调用日志与执行账本
      description: 仅管理员显式请求执行，无定时任务；使用已保存且版本匹配的保留策略，null 永久保留时返回零。每批策略行加锁并检查 expectedVersion，所有状态的过期执行均可清理，未结束与 UNKNOWN 先停止本地执行、递增任务租约 epoch、释放该 Run 活动槽，再同事务删除日志与账本并保存状态事件；近期有活动、边界时刻或被并发事务锁定的整个执行暂缓。不承诺外部请求停止或退款，清理后不再恢复或核对原请求；每次至多十批，每批至多 1000 个执行单位。batchLimitReached=true 表示可能还有待清理记录，须再次手动执行。多个批次分别提交，后续失败或设置冲突不能恢复前面已提交的批次；不得自动重试。保留业务身份和结果，不触发 Provider 请求。
      tags: [Audit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: {type: integer, minimum: 1}
      responses:
        "200":
          description: 本次实际清理的执行单位数量；Cache-Control 为 no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallLogCleanupResult"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/settings/prompts:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: listPrompts
      summary: 统一提示词管理列表（仅管理员）
      description: 内置功能提示词包括文字生成、图片提示词反推及角色、脸部、道具三视图和场景宫格；可编辑但不可删除。图片反推使用 image.reverse-prompt；四种视图分别由固定用途标识 image.three-view.character、image.three-view.face、image.three-view.prop 和 image.three-view.scene-grid 消费。
      tags: [Settings]
      responses:
        "200":
          description: 固定内置导演与功能提示词；Cache-Control no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createPrompt
      summary: 新建功能提示词
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePromptRequest"}
      responses:
        "201":
          description: 已创建的条目；自定义功能条目须由对应消费功能显式接入
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptDefinition"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "409": {$ref: "#/components/responses/Conflict"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/settings/prompts/{id}:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getPrompt
      summary: 读取提示词条目（仅管理员）
      tags: [Settings]
      responses:
        "200":
          description: 提示词条目；Cache-Control no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptDefinition"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updatePrompt
      summary: 乐观修改名称、说明和提示词正文（仅管理员）
      description: key 与 kind 不可变；已复制的 Agent 和冻结的 Task/Run 不随修改而改变。
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdatePromptRequest"}
      responses:
        "200":
          description: 保存结果；Cache-Control no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptDefinition"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      operationId: deletePrompt
      summary: 乐观删除自定义提示词（仅管理员）
      description: 内置条目返回 PROMPT_IN_USE/409，已有 Agent/Task 保留复制内容。
      tags: [Settings]
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "204": {description: 已删除；Cache-Control no-store}
        "400": {$ref: "#/components/responses/ValidationError"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/settings/director:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getDirectorSettings
      summary: 读取全局导演上下文与恢复设置（仅管理员）
      tags: [Settings]
      responses:
        "200":
          description: 当前持久设置；Cache-Control 为 no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DirectorSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updateDirectorSettings
      summary: 以版本比较保存全局导演设置
      description: 保存后新请求立即读取，不需要重启。已冻结模型请求、压缩计划、恢复期限和修复链上限保持原值。不会触发模型调用或更改权限与媒体审批。响应预留至少1024且小于窗口一半；摘要至少256且不超过输入预算四分之一。环境变量不再覆盖这些设置。
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateDirectorSettingsRequest"}
      responses:
        "200":
          description: 保存后的设置和递增版本；Cache-Control 为 no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DirectorSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/settings/debug:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getDebugSettings
      summary: 读取系统 debug 模式（默认关闭，仅管理员）
      tags: [Audit]
      responses:
        "200":
          description: 持久化设置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DebugSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updateDebugSettings
      summary: 修改系统 debug 模式
      description: 调用开始时固定开关。启用后保存脱敏原始 HTTP 地址及正文（每个正文最多 64 MiB，超限或未读完明确标注）；可能包含提示词、个人信息和素材，并显著增加数据库及备份体积。仅提取 DebugExchange.responseIdentifiers 定义的固定响应关联 ID；其余 header（含 Authorization、Cookie、Set-Cookie）均不保存。普通及流式 LLM 的请求、响应及 HTTP/SSE 正文仅按结构化 image_url 字段省略图片字节，其余字段、工具 Schema、参数和模型文本原样保留，不对正文进行凭据或正则替换。本次服务端登记的中继 URL 查询签名及其正文回显也隐藏，其他远程 URL 保留。独立请求地址隐藏认证信息，媒体调用继续过滤凭据与私有推理。关闭停止新增正文，历史记录按日志保留设置清理，旧调用不会补录。不会触发 Provider 请求。
      tags: [Audit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [debugMode, expectedVersion]
              properties:
                debugMode: {type: boolean}
                expectedVersion: {type: integer, minimum: 1}
      responses:
        "200":
          description: 更新后的设置与版本
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DebugSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/call-logs/{id}/debug:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getCallDebug
      summary: 查看本人项目或活动管理员系统诊断的 debug 调用详情
      description: 单独按需读取正文；Cache-Control 为 no-store。captured=false 表示调用开始时 debug 未启用。captured=true 且 exchanges 为空表示没有已采集的 HTTP 交换（例如 Mock、尚未开始网络调用或采集写入失败）。不伪造 Mock 的 HTTP 请求。仅提取固定白名单响应关联 ID，其他 header（含 Authorization、Cookie、Set-Cookie）均省略；LLM 正文不做凭据替换，保留实际请求与响应内容及推理字段，流式响应只保存一份于 llmStream.content.response，exchanges 只保留请求、HTTP 状态和响应关联 ID，媒体调用继续过滤凭据与私有推理。每个正文至多 64 MiB，超限或未读完标记 truncated，无法解析的 JSON 正文或 SSE data 事件省略，旧内容不补录。UTF8 为正文文本（LLM JSON 仅将结构化 image_url 中的图片 data URI 整值替换为 [image bytes omitted] 占位符后序列化，工具 Schema、参数、数值和普通文本保留，同时隐藏本次服务端登记的中继 URL 查询签名及其正文回显；非 LLM JSON 沿用凭据过滤），BASE64 为二进制正文，MULTIPART_JSON 为字段与文件内容，OMITTED 表示无法安全采集。请求已发送但无响应时响应字段为 null。旧历史投影无此详情，不补录。
      tags: [Audit]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Debug 详情
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallDebug"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/auth/setup-status:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getSetupStatus
      summary: 查询是否需要初始化管理员
      tags: [Identity]
      security: []
      responses:
        "200":
          description: 初始化状态
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupStatus"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/auth/csrf:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getCsrfToken
      summary: 获取浏览器写请求所需的 CSRF token
      tags: [Identity]
      security: []
      responses:
        "200":
          description: CSRF token
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CsrfToken"}
  /api/v1/auth/setup:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: setupAdministrator
      summary: 一次性创建管理员
      description: 仅提交登录名与密码；数据库永久记录初始化完成，并发只有一次成功，后续调用返回 409 SETUP_ALREADY_COMPLETED。
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetupRequest"}
      responses:
        "201":
          description: 管理员已创建
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/auth/login:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: login
      summary: 创建数据库持久化会话
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: 已登录管理员
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/logout:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: logout
      summary: 退出并失效当前会话
      tags: [Identity]
      responses:
        "204": {description: 会话已失效}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/auth/me:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getCurrentUser
      summary: 获取当前管理员
      tags: [Identity]
      responses:
        "200":
          description: 当前管理员
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/auth/change-password:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: changePassword
      summary: 修改密码并失效其他会话
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangePasswordRequest"}
      responses:
        "204": {description: 密码已修改}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/account/mcp-tokens:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: listMcpTokens
      summary: 查询当前用户的 MCP 凭据元数据
      description: 仅接受网页登录 Session；MCP Bearer 凭据不能调用管理 API。结果不包含 Token 明文或散列。
      tags: [Identity]
      responses:
        "200":
          description: 当前用户的凭据；Cache-Control no-store
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/McpTokenSummary"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createMcpToken
      summary: 创建用户级 MCP 凭据
      description: 网页 Session 与 CSRF 校验。READ 必选，凭据每次使用时仍校验当前用户及项目权限。明文仅本次响应提供，不能放入 URL、浏览器持久存储或模型上下文。
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMcpTokenRequest"}
      responses:
        "201":
          description: 凭据已创建；明文仅展示一次
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/McpTokenCreatedResponse"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/Unavailable"}
