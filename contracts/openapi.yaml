    RunningHubImportRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, kind]
      properties:
        targetType: {type: string, enum: [WORKFLOW, AI_APP]}
        targetId: {type: string, pattern: "^[0-9]{1,32}$"}
        kind: {type: string, enum: [IMAGE_GENERATION, VIDEO_GENERATION, AUDIO_GENERATION]}
        source:
          description: Optional sanitized nodeInfoList or ComfyUI API-format JSON (256 KiB maximum). Omit for read-only discovery. No curl execution or credentials.
    RunningHubImportPreview:
      type: object
      additionalProperties: false
      required: [definition, warnings, recommendedFieldKeys, targetName]
      properties:
        definition: {$ref: "#/components/schemas/RunningHubDefinition"}
        fieldInsights:
          type: array
          maxItems: 1024
          description: Per-field discovery evidence for administrator review. Matched by nodeId and fieldName when candidate keys are merged. These suggestions are not persisted in the capability or used to authorize execution.
          items: {$ref: "#/components/schemas/RunningHubFieldInsight"}
        targetName:
          type: [string, "null"]
          maxLength: 160
          description: Optional trimmed AI app or workflow display name from read-only discovery. Null when unavailable or importing local JSON. Autofills an empty capability name only; not retained in the imported input contract.
        recommendedFieldKeys:
          type: array
          maxItems: 1024
          uniqueItems: true
          description: Suggested creator-facing candidate keys (unambiguous canvas prompt, media, negative prompt, duration, aspect ratio, dimensions, resolution, frame rate and quality). Types, bounds and valid defaults use declared input and widget metadata; sampler/model internals and ambiguous fields remain manual. Existing administrator mappings and selections take precedence when importing again. Editor selection only; never stored in a capability or used to authorize execution.
          items: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_]{0,63}$"}
        warnings:
          type: array
          description: Public discovery warnings localized using Accept-Language. Imported field labels and definition values retain their original content.
          items: {type: string}
    RunningHubFieldInsight:
      type: object
      additionalProperties: false
      required: [key, nodeId, fieldName, confidence, reasons]
      properties:
        key: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_]{0,63}$"}
        nodeId: {type: string, pattern: "^[0-9]{1,32}$"}
        fieldName: {type: string, pattern: "^[A-Za-z_][A-Za-z0-9_.]{0,79}$"}
        confidence: {type: string, enum: [DECLARED, INFERRED, UNCERTAIN]}
        reasons:
          type: array
          uniqueItems: true
          maxItems: 16
          items:
            type: string
            enum: [TYPE_DECLARATION, WIDGET_TYPE, JSON_VALUE, UPLOAD_WIDGET, NAME_HINT, DIRECT_CREATIVE_CONNECTION, PRIMARY_PROMPT, NEGATIVE_PROMPT, AMBIGUOUS_PROMPT, CONFLICTING_MEDIA_METADATA, MISSING_ENUM_OPTIONS, RESOURCE_URL_NODE, RESOURCE_FILE_NODE, RESOURCE_FORMAT_UNCERTAIN, EXPLICIT_GROUP, MISSING_TYPE_METADATA]
    MediaCapabilityPricing:
