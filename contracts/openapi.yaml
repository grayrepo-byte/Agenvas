    post:
      operationId: cancelImagePrompt
      summary: 取消排队或运行中的图片提示词反推
      description: 原子停止本系统后续处理；不保证服务方已经停止或退款。取消后的晚到响应不能发布提示词。重复取消重放 CANCELED 状态。
