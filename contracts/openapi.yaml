        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/artifacts/{artifactId}/image-operations:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - {$ref: "#/components/parameters/ArtifactId"}
    post:
      operationId: runImageOperation
      summary: 按图片功能设置固定来源并创建独立结果节点与图片处理任务
      description: 按 IMAGE_ 前缀功能绑定解析处理能力，核对 expectedFunctionVersion 和 expectedCapabilityVersion；不接受客户端选择能力。单图片输入的 RunningHub 契约固定来源槽、冻结普通参数及完整契约；同键重放原任务且不读取新设置。派生结果节点使用空白媒体草稿，不继承来源提示词、参数、能力或图片输入；操作输入固定在任务及结果来源中。节点标题为来源节点当前标题加「 · 操作名称」，超长时截短来源部分以保留操作后缀；完成或重放不覆盖后续改名。THREE_VIEW 首次受理按类型读取统一管理的内置功能提示词，追加可选主体说明，冻结最终正文及 promptKey/promptVersion；修改管理配置只影响新命令，同键重放及在途任务保留原输入。
      tags: [Tasks]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunImageOperationRequest"}
      responses:
        "200":
          description: 已受理并创建结果节点，或按相同幂等键返回原任务
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/projects/{projectId}/video-compositions:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      operationId: composeVideo
      summary: 按分镜和台词对应关系智能排布配音并本地合成
      description: 固定有序视频片段与配音精确版本，后台分析原片和配音的声音能量/静音区间并自动适配。声音活动不等于语音识别；无可靠窗口时回退时长排布并记录警告。最多12镜、30句、总时长60秒，素材总大小1GiB，单个音视频最多10分钟。最多1.15倍保音高加速，无法完整容纳时失败，不截断配音。输出720p/1080p、16:9/9:16/1:1、30fps的新视频节点，逐镜向下对齐整帧（少于34ms）并记录实际时间表；支持零配音、取源裁切、0.5–2倍视频速度、首尾淡黑、定时字幕与背景音乐；默认去除原声，KEEP保留完整原声，BACKGROUND保留15%原声（包括原对白）。本地处理无Provider费用，复用Task查询/取消/显式重试；同键异参冲突。
      tags: [Tasks]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VideoCompositionRequest"}
      responses:
        "200":
          description: 已受理或重放的本地合成任务，不代表合成完成
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/video-compositions/preview:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      operationId: previewVideoComposition
      summary: 只读分析剪辑配音的精确时间表
      description: 复用导出的取源授权、声音活动分析与配音排布，不创建任务、节点、事件或费用；在事务外执行有界FFmpeg分析，每实例最多两个并发预览。仅返回时间与字体，不返回本机路径或媒体正文。浏览器以此同步配音，修改镜头后需重新读取；字幕、配乐与画幅变化无需重新分析。规划端点不执行最终atempo编码，实际导出保留其完整音频边界校验。
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VideoCompositionRequest"}
      responses:
        "200":
          description: 当前输入的只读预览时间表
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VideoCompositionPreview"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "429": {$ref: "#/components/responses/ValidationError"}
        "503": {$ref: "#/components/responses/ValidationError"}
  /api/v1/projects/{projectId}/artifacts/{artifactId}/audio-trims:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - {$ref: "#/components/parameters/ArtifactId"}
    post:
      operationId: runAudioTrim
      summary: 裁剪固定音频片段并创建独立派生节点
      description: 使用整数毫秒的起止位置截取当前选用音频，返回持久本地Task。来源最多10分钟/50MiB，片段至少100ms且必须完整落在来源内；输出固定双声道48kHz，WAV为PCM16、MP3为192kbps。WAV超过50MiB预算时受理前拒绝，可缩短片段或改用MP3。结果追加到同一Artifact的独立派生音频节点，使用空白草稿和精确来源；原节点及资源默认版本不变。取消或目标改变后结果仅归档，不重建已删除节点。无Provider调用或费用，同键同参重放原Task，同键异参冲突。裁剪结果可经现有AUDIO_REFERENCE用于音色参考，所选模型的格式/时长限制仍独立校验；裁剪不执行人声分离或创建声纹模型。
      tags: [Tasks]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunAudioTrimRequest"}
      responses:
        "200":
          description: 已受理或重放的裁剪Task，不代表处理完成
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/projects/{projectId}/artifacts/{artifactId}/video-operations:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - {$ref: "#/components/parameters/ArtifactId"}
    post:
      operationId: runVideoOperation
      summary: 按功能设置固定来源视频并创建独立处理结果节点与任务
      description: 深度视频和视频高清派生同一视频产物的独立节点；音频分离创建独立音频产物/节点和来源视频产物的无声视频派生节点，同一任务提交两个结果。所有结果使用空白草稿及可删除派生线，来源选择不变。固定功能设置版本、能力版本、来源视频版本及参数；同键异参冲突。视频高清只执行管理员绑定的兼容 AI 能力。本地深度输出最长边 518px、12fps、无音轨的相对深度视频；本地音频分离默认读取第一音轨，可选择音轨索引和WAV/MP3，输出双声道48kHz PCM WAV或192kbps MP3，并直接复制原视频流、移除音轨为无声MP4；云端音频输出也配套本地无声视频。两个目标独立核对选择epoch/草稿版本，目标删除不重建，归档重试不重新生成。本地深度输入限30秒、200MiB、3840×2160像素数；本地音频提取输入限10分钟、500MiB、4000万像素，输出音频限50MiB，WAV超预算受理前拒绝。RunningHub 使用已发布的单视频输入契约，不接受任意工作流或请求。
      tags: [Tasks]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunVideoOperationRequest"}
      responses:
        "200":
          description: 已受理或相同幂等键的原任务
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
