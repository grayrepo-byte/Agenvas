      type: object
      additionalProperties: false
      required: [agentId, agentVersion, agentName, agentInstruction, modelAvailable, providerAdapter, modelId, toolCalling, policySnapshot, conversationId, conversationVersion, conversationTurnCount, memoryTruncated, creativeSkills]
      properties:
