    get:
      operationId: listRunActions
      summary: 列出已提交工具动作的公开摘要
      description: 仅返回服务端生成的业务结果摘要，按 stepIndex、登记时间和 id 排序；不返回模型消息、工具参数、完整结果或私有推理。
      tags: [Runs]
      responses:
        "200":
          description: 最多 40 个已提交动作；尚无动作时返回空数组
          content:
            application/json:
              schema:
                type: array
                maxItems: 40
                items: {$ref: "#/components/schemas/RunAction"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/runs/{runId}/media-approvals:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: runId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listAgentMediaApprovals
      summary: 列出本 Run 的媒体生成审批批次
      description: 仅返回同项目、同 Run 的审批与安全生成预览，不包含连接地址、凭据或模型私有消息。
      tags: [Runs]
      responses:
        "200":
          description: 审批列表；尚无审批时返回空数组
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AgentMediaApproval"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/runs/{runId}/media-approvals/{approvalId}:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: runId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: approvalId
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: reviseAgentMediaApproval
      summary: 修改待审批视频的能力与生成参数并重新估算费用
      description: 仅 PENDING 且未过期批次可修改。保留提示词、精确素材、目标及镜头依据；输入不兼容则事务回滚。不创建 Task，不延长期限。保存后以返回的新版本另行批准。
      tags: [Runs]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AgentMediaApprovalRevisionRequest"}
      responses:
        "200":
          description: 已重新校验的待审批批次与费用摘要
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentMediaApproval"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
    get:
      operationId: getAgentMediaApproval
      summary: 获取媒体审批、固定输出与最终结果
      tags: [Runs]
      responses:
        "200":
          description: 审批状态与安全预览
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentMediaApproval"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/runs/{runId}/media-approvals/{approvalId}/decision:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: runId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: approvalId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: decideAgentMediaApproval
      summary: 以 CAS 和幂等键批准或拒绝整个固定批次
      description: >-
        APPROVE 只授权当前审批快照；重新核验草稿、能力和输入版本后受理持久媒体任务。
        REJECT 不提交 Provider，并同事务撤回草稿未变、无媒体结果且无独立生成任务的空输出节点及连线；
        用户已编辑或已开始创作的节点保留，审批与产物审计保留。相同幂等键和请求返回同一审批的当前状态，不重复受理；
        同键不同请求、版本变化或非 PENDING 审批返回冲突。
        尚为 PENDING 的过期审批转为 EXPIRED，返回 200 并通知 Agent。批准前没有第三方生成调用。
      tags: [Runs]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AgentMediaApprovalDecisionRequest"}
      responses:
        "200":
          description: 决策后的审批；媒体生成异步执行
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentMediaApproval"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/runs/{runId}/cancel:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: runId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: cancelRun
      summary: 幂等取消 Run 并停止后续编排
      tags: [Runs]
      responses:
        "200":
          description: 取消后的 Run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentRun"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/runs/{runId}/tasks:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: runId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listRunTasks
      summary: 列出本轮全部任务和已完成的媒体输出
      tags: [Tasks]
      responses:
        "200":
          description: 持久化任务列表
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Task"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/tasks/{taskId}:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: taskId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getTask
      summary: 获取一个持久化 Task 的状态
      tags: [Tasks]
      responses:
        "200":
          description: Task 状态与归一化结果
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/tasks/{taskId}/new-attempt:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: taskId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: createManualUnknownAttempt
      summary: 为结果未知或已受理但阻断的直连媒体任务创建独立的新尝试
      description: 仅接受未取消的 UNKNOWN（无外部请求 ID）或 BLOCKED（已有外部请求 ID）直连媒体任务。重试创建新的生成任务并独立预留用量；保留原任务、请求 ID、输入与费用记录，原任务不再占用发起卡片。不会恢复原请求查询。已变化的任务版本或能力配置返回冲突。
      tags: [Tasks]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 120}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ManualUnknownAttemptRequest"}
      responses:
        "200":
          description: 新尝试；同幂等键重放返回相同任务，原任务和用量预留仍保留
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/canvas/editor:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
    get:
      operationId: getCanvasEditor
      summary: Read authoritative canvas items and persistent presentation groups
      tags: [Canvas]
      responses:
        "200":
          description: Canvas editor state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CanvasEditorState"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/canvas/edits:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      operationId: editCanvas
      summary: Atomically edit presentation, groups or copy up to 100 nodes with internal topology
      description: Command identities and request fingerprints are durable. The latest 100 receipt snapshots per project are retained; retries after their snapshot expires return CANVAS_EDIT_EXPIRED and never execute again. Copies freeze saved text/media/character state and remap the complete selected internal topology. External edges, history and tasks are not copied; fixed external media inputs become manual. Group membership changes must explicitly include all changed nodes. Locked nodes may be renamed, unlocked or copied, but cannot move or change group. No provider calls are made.
      tags: [Canvas]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CanvasEditRequest"}
      responses:
        "200":
          description: Authoritative state and replay receipt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CanvasEditResponse"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/canvas/edits/{receiptId}/replay:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - name: receiptId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: replayCanvasEdit
      summary: Undo or redo one retained presentation receipt under semantic and revision preconditions
      description: Only receipt-owned presentation changes are replayed. Clone undo refuses any subsequent content, draft, selection, role, connection, task, approval or composition usage. Redo restores fixed clone content and never rereads a changed source. A stale, expired or unsafe receipt returns 409 without partial changes. Existing delete/connect commands have no undo receipt.
      tags: [Canvas]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CanvasEditReplayRequest"}
      responses:
        "200":
          description: Authoritative state with the incremented receipt revision and direction
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CanvasEditResponse"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/canvas/commands:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
    post:
