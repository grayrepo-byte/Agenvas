components:
  securitySchemes:
    McpBearer:
      type: http
      scheme: bearer
      description: 用户级 MCP 访问令牌，仅用于明确列出的 MCP 接口。
  schemas:
    CharacterNodeSelection: {"type": "object", "additionalProperties": false, "required": ["characterId", "characterVersion", "lookId", "viewVersionIds", "useAppearance", "useVoice"], "properties": {"characterId": {"type": "string", "format": "uuid"}, "characterVersion": {"type": "integer", "format": "int64", "minimum": 1}, "lookId": {"type": ["string", "null"], "format": "uuid"}, "viewVersionIds": {"type": "array", "maxItems": 14, "uniqueItems": true, "items": {"type": "string", "format": "uuid"}}, "useAppearance": {"type": "boolean"}, "useVoice": {"type": "boolean"}}}
    CharacterNodeConnection: {"type": "object", "additionalProperties": false, "required": ["id", "sourceCanvasItemId", "targetCanvasItemId", "version"], "properties": {"id": {"type": "string", "format": "uuid"}, "sourceCanvasItemId": {"type": "string", "format": "uuid"}, "targetCanvasItemId": {"type": "string", "format": "uuid"}, "version": {"type": "integer", "format": "int64", "minimum": 0}}}
    CharacterNode: {"type": "object", "additionalProperties": false, "required": ["canvasItemId", "selection", "snapshot", "version", "newerVersionAvailable", "connections"], "properties": {"canvasItemId": {"type": "string", "format": "uuid"}, "selection": {"$ref": "#/components/schemas/CharacterNodeSelection"}, "snapshot": {"$ref": "#/components/schemas/CharacterSnapshot"}, "version": {"type": "integer", "format": "int64", "minimum": 0}, "newerVersionAvailable": {"type": "boolean"}, "connections": {"type": "array", "items": {"$ref": "#/components/schemas/CharacterNodeConnection"}}}}
    CreateCharacterNode: {"type": "object", "additionalProperties": false, "required": ["selection", "x", "y", "width", "height", "zIndex", "groupId", "locked"], "properties": {"selection": {"$ref": "#/components/schemas/CharacterNodeSelection"}, "x": {"type": "number", "minimum": -1000000, "maximum": 1000000}, "y": {"type": "number", "minimum": -1000000, "maximum": 1000000}, "width": {"type": "number", "minimum": 120, "maximum": 2000}, "height": {"type": "number", "minimum": 80, "maximum": 2000}, "zIndex": {"type": "integer", "minimum": -1000, "maximum": 1000}, "groupId": {"type": ["string", "null"], "format": "uuid"}, "locked": {"type": "boolean"}}}
    SaveCharacterNodeSelection: {"type": "object", "additionalProperties": false, "required": ["expectedItemVersion", "expectedSelectionVersion", "selection"], "properties": {"expectedItemVersion": {"type": "integer", "format": "int64", "minimum": 0}, "expectedSelectionVersion": {"type": "integer", "format": "int64", "minimum": 0}, "selection": {"$ref": "#/components/schemas/CharacterNodeSelection"}}}
    ConnectCharacterNode: {"type": "object", "additionalProperties": false, "required": ["connectionId", "sourceCanvasItemId", "targetCanvasItemId", "expectedSourceItemVersion", "expectedSourceSelectionVersion", "expectedTargetItemVersion"], "properties": {"connectionId": {"type": "string", "format": "uuid"}, "sourceCanvasItemId": {"type": "string", "format": "uuid"}, "targetCanvasItemId": {"type": "string", "format": "uuid"}, "expectedSourceItemVersion": {"type": "integer", "format": "int64", "minimum": 0}, "expectedSourceSelectionVersion": {"type": "integer", "format": "int64", "minimum": 0}, "expectedTargetItemVersion": {"type": "integer", "format": "int64", "minimum": 0}}}
    DisconnectCharacterNode: {"type": "object", "additionalProperties": false, "required": ["expectedVersion"], "properties": {"expectedVersion": {"type": "integer", "format": "int64", "minimum": 0}}}
    PreviewCharacterNodeBindings: {"type": "object", "additionalProperties": false, "required": ["expectedBindingVersion", "expectedDraftVersion", "clearMode"], "properties": {"expectedBindingVersion": {"type": "integer", "format": "int64", "minimum": 0}, "expectedDraftVersion": {"type": "integer", "format": "int64", "minimum": 0}, "clearMode": {"$ref": "#/components/schemas/CharacterClearMode"}}}
    ApplyCharacterNodeBindings: {"type": "object", "additionalProperties": false, "required": ["expectedBindingVersion", "expectedDraftVersion", "clearMode", "commandId", "previewHash"], "properties": {"expectedBindingVersion": {"type": "integer", "format": "int64", "minimum": 0}, "expectedDraftVersion": {"type": "integer", "format": "int64", "minimum": 0}, "clearMode": {"$ref": "#/components/schemas/CharacterClearMode"}, "commandId": {"type": "string", "format": "uuid"}, "previewHash": {"type": "string", "pattern": "^[a-f0-9]{64}$"}}}
    CharacterNodeBindingPreview: {"type": "object", "additionalProperties": false, "required": ["previewHash", "characterPreview", "connections"], "properties": {"previewHash": {"type": "string", "pattern": "^[a-f0-9]{64}$"}, "characterPreview": {"$ref": "#/components/schemas/CharacterBindingPreview"}, "connections": {"type": "array", "items": {"$ref": "#/components/schemas/CharacterNodeConnection"}}}}
    CharacterNodeConnectionList: {"type": "object", "additionalProperties": false, "required": ["items"], "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/CharacterNodeConnection"}}}}
    CanvasCharacterNodeEntry: {"type": "object", "additionalProperties": false, "required": ["item", "artifact", "selectedVersion", "characterNode"], "properties": {"item": {"type": "object", "additionalProperties": false, "required": ["id", "projectId", "subjectType", "subjectId", "selectedVersionId", "title", "x", "y", "width", "height", "zIndex", "groupId", "locked", "version", "createdAt", "updatedAt"], "properties": {"id": {"type": "string", "format": "uuid"}, "projectId": {"type": "string", "format": "uuid"}, "subjectType": {"type": "string", "const": "CHARACTER"}, "subjectId": {"type": "string", "format": "uuid"}, "selectedVersionId": {"type": "null"}, "title": {"type": "string"}, "x": {"type": "number"}, "y": {"type": "number"}, "width": {"type": "number"}, "height": {"type": "number"}, "zIndex": {"type": "integer"}, "groupId": {"type": ["string", "null"], "format": "uuid"}, "locked": {"type": "boolean"}, "version": {"type": "integer", "format": "int64", "minimum": 0}, "createdAt": {"type": "string", "format": "date-time"}, "updatedAt": {"type": "string", "format": "date-time"}}}, "artifact": {"type": "null"}, "selectedVersion": {"type": "null"}, "characterNode": {"$ref": "#/components/schemas/CharacterNode"}}}
    CharacterLibraryView:
      type: "object"
      additionalProperties: false
      required: ["mediaId", "purpose", "description"]
      properties:
        mediaId:
          type: "string"
          format: "uuid"
        purpose:
          type: "string"
          maxLength: 120
          minLength: 1
        description:
          type: "string"
          maxLength: 2000
    CharacterLibraryLook:
      type: "object"
      additionalProperties: false
      required: ["id", "name", "clothing", "expression", "description", "views"]
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          maxLength: 160
          minLength: 1
        clothing:
          type: "string"
          maxLength: 2000
        expression:
          type: "string"
          maxLength: 2000
        description:
          type: "string"
          maxLength: 4000
        views:
          type: "array"
          maxItems: 14
          items:
            "$ref": "#/components/schemas/CharacterLibraryView"
    CharacterLibraryVoice:
      type: "object"
      additionalProperties: false
      required: ["mediaId", "speakerId", "description"]
      properties:
        mediaId:
          oneOf:
            -
              type: "string"
              format: "uuid"
            -
              type: "null"
        speakerId:
          oneOf:
            -
              type: "string"
              maxLength: 120
            -
              type: "null"
        description:
          type: "string"
          maxLength: 2000
    CharacterLibraryContent:
      type: "object"
      additionalProperties: false
      required: ["name", "persona", "appearance", "identityViews", "looks", "voice"]
      properties:
        name:
          type: "string"
          maxLength: 160
          minLength: 1
        persona:
          type: "string"
          maxLength: 4000
        appearance:
          type: "string"
          maxLength: 4000
        identityViews:
          type: "array"
          maxItems: 14
          items:
            allOf:
              -
                "$ref": "#/components/schemas/CharacterLibraryView"
              -
                type: "object"
                properties:
                  purpose:
                    type: "string"
                    minLength: 1
                    maxLength: 101
        looks:
          type: "array"
          maxItems: 20
          items:
            "$ref": "#/components/schemas/CharacterLibraryLook"
        voice:
          oneOf:
            -
              "$ref": "#/components/schemas/CharacterLibraryVoice"
            -
              type: "null"
      description: "Persona and appearance with the project heading must fit 4000 characters. Identity views plus each look deduplicate to at most 14 images; merged view descriptions must fit 2000 characters."
    CharacterLibraryProfile:
      type: "object"
      additionalProperties: false
      required: ["id", "content", "version", "archived", "createdAt", "updatedAt"]
      properties:
        id:
          type: "string"
          format: "uuid"
        content:
          "$ref": "#/components/schemas/CharacterLibraryContent"
        version:
          type: "integer"
          format: "int64"
          minimum: 1
        archived:
          type: "boolean"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    CharacterLibrarySave:
      type: "object"
      additionalProperties: false
      required: ["commandId", "expectedVersion", "content"]
      properties:
        commandId:
          type: "string"
          format: "uuid"
        expectedVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        content:
          "$ref": "#/components/schemas/CharacterLibraryContent"
    CharacterLibraryArchive:
      type: "object"
      additionalProperties: false
      required: ["commandId", "expectedVersion"]
      properties:
        commandId:
          type: "string"
          format: "uuid"
        expectedVersion:
          type: "integer"
          format: "int64"
          minimum: 1
    CharacterLibraryPage:
      type: "object"
      additionalProperties: false
      required: ["items", "nextCursor"]
      properties:
        items:
          type: "array"
          maxItems: 100
          items:
            "$ref": "#/components/schemas/CharacterLibraryProfile"
        nextCursor:
          oneOf:
            -
              type: "string"
              format: "uuid"
            -
              type: "null"
    CharacterLibraryMediaSource:
      type: "object"
      additionalProperties: false
      required: ["commandId", "sourceType", "entryId", "expectedEntryVersion", "projectId", "versionId"]
      properties:
        commandId:
          type: "string"
          format: "uuid"
        sourceType:
          type: "string"
          enum: ["LIBRARY_ENTRY", "PROJECT_VERSION"]
        entryId:
          oneOf:
            -
              type: "string"
              format: "uuid"
            -
              type: "null"
        expectedEntryVersion:
          oneOf:
            -
              type: "integer"
              format: "int64"
              minimum: 0
            -
              type: "null"
        projectId:
          oneOf:
            -
              type: "string"
              format: "uuid"
            -
              type: "null"
        versionId:
          oneOf:
            -
              type: "string"
              format: "uuid"
            -
              type: "null"
    CharacterLibraryPublish:
      type: "object"
      additionalProperties: false
      required: ["commandId", "expectedVersion", "sourceProjectId", "sourceCharacterId", "sourceCharacterVersion", "identityVersionIds"]
      properties:
        commandId:
          type: "string"
          format: "uuid"
        expectedVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        sourceProjectId:
          type: "string"
          format: "uuid"
        sourceCharacterId:
          type: "string"
          format: "uuid"
        sourceCharacterVersion:
          type: "integer"
          format: "int64"
          minimum: 1
        identityVersionIds:
          type: "array"
          maxItems: 14
          items:
            type: "string"
            format: "uuid"
    CharacterLibraryTransfer:
      type: "object"
      additionalProperties: false
      required: ["libraryId", "libraryVersion", "characterId", "expectedCharacterVersion"]
      properties:
        libraryId:
          type: "string"
          format: "uuid"
        libraryVersion:
          type: "integer"
          format: "int64"
          minimum: 1
        characterId:
          type: "string"
          format: "uuid"
        expectedCharacterVersion:
          type: "integer"
          format: "int64"
          minimum: 0
    CharacterLibraryImport:
      type: "object"
      additionalProperties: false
      required: ["libraryId", "libraryVersion", "characterId", "expectedCharacterVersion", "commandId", "previewHash"]
      properties:
        libraryId:
          type: "string"
          format: "uuid"
        libraryVersion:
          type: "integer"
          format: "int64"
          minimum: 1
        characterId:
          type: "string"
          format: "uuid"
        expectedCharacterVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        commandId:
          type: "string"
          format: "uuid"
        previewHash:
          type: "string"
          pattern: "^[a-f0-9]{64}$"
    CharacterLibraryTransferPreview:
      type: "object"
      additionalProperties: false
      required: ["libraryId", "libraryVersion", "characterId", "expectedCharacterVersion", "previewHash", "content", "currentCharacter", "affectedItems", "changes"]
      properties:
        libraryId:
          type: "string"
          format: "uuid"
        libraryVersion:
          type: "integer"
          format: "int64"
          minimum: 1
        characterId:
          type: "string"
          format: "uuid"
        expectedCharacterVersion:
          type: "integer"
          format: "int64"
          minimum: 0
        previewHash:
          type: "string"
        content:
          "$ref": "#/components/schemas/CharacterLibraryContent"
        currentCharacter:
          oneOf:
            - {$ref: "#/components/schemas/CharacterProfile"}
            - {type: "null"}
          description: Current full project content that will be replaced; null for new imports.
        affectedItems:
          type: "array"
          maxItems: 10000
          items:
            type: "object"
            additionalProperties: false
            required: ["canvasItemId", "title", "bindingVersion"]
            properties:
              canvasItemId:
                type: "string"
                format: "uuid"
              title:
                type: "string"
              bindingVersion:
                type: "integer"
                format: "int64"
                minimum: 1
        changes:
          type: "array"
          maxItems: 100
          items:
            type: "string"
    CharacterLibraryCommand:
      type: "object"
      additionalProperties: false
      required: ["id", "status", "result", "errorCode", "errorDetail"]
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum: ["ACCEPTED", "ARCHIVING", "SUCCEEDED", "FAILED"]
        result:
          type: ["object", "null"]
          additionalProperties: true
        errorCode:
          oneOf:
            -
              type: "string"
            -
              type: "null"
        errorDetail:
          oneOf:
            -
              type: "string"
            -
              type: "null"
    CharacterLibraryLink:
      type: "object"
      additionalProperties: false
      required: ["characterId", "libraryId", "libraryVersion", "currentLibraryVersion", "libraryArchived", "projectCharacterVersion", "hasUpdate"]
      properties:
        characterId:
          type: "string"
          format: "uuid"
        libraryId:
          type: "string"
          format: "uuid"
        libraryVersion:
          type: "integer"
          format: "int64"
          minimum: 1
        currentLibraryVersion:
          type: "integer"
          format: "int64"
          minimum: 1
        libraryArchived:
          type: "boolean"
        projectCharacterVersion:
          type: "integer"
          format: "int64"
          minimum: 1
        hasUpdate:
          type: "boolean"
    CharacterLibraryLinks:
      type: "object"
      additionalProperties: false
      required: ["items"]
      properties:
        items:
          type: "array"
          maxItems: 200
          items:
            "$ref": "#/components/schemas/CharacterLibraryLink"
    ReferenceCatalogPrivateImage:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceId
        - snapshotId
        - entryId
        - variantId
        - sha256
        - byteSize
        - contentType
        - width
        - height
        - previewUrl
        - cached
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
        snapshotId:
          type: string
          format: uuid
        entryId:
          type: string
        variantId:
          type: string
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        byteSize:
          type: integer
          format: int64
          minimum: 1
        contentType:
          type: string
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        previewUrl:
          type: string
        cached:
          type: boolean
    ReferenceCatalogPrivateImages:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceCatalogPrivateImage'
    CacheReferenceCatalogPrivateImage:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - snapshotId
        - entryId
        - variantId
        - commandKey
      properties:
        sourceId:
          type: string
          maxLength: 100
        snapshotId:
          type: string
          format: uuid
        entryId:
          type: string
          maxLength: 100
        variantId:
          type: string
          maxLength: 100
        commandKey:
          type: string
