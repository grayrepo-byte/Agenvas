            schema: {$ref: "#/components/schemas/ApproveExportProposalRequest"}
      responses:
        "200":
          description: 已审批或同哈希精确重放
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExportProposalApproval"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/export-proposals/{proposalId}/reject:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
      - name: proposalId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: rejectExportProposal
      summary: 拒绝未审批的 Agent 导出提案且不创建任务
      tags: [Exports]
      responses:
        "200":
          description: 已拒绝或精确重放
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExportProposal"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/projects/{projectId}/exports/{taskId}:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
      - name: taskId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getMediaExport
      summary: 读取一个项目导出任务
      tags: [Exports]
      responses:
        "200":
          description: 持久导出状态与结果
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/exports/{taskId}/cancel:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
      - name: taskId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: cancelMediaExport
      summary: 取消排队导出或请求终止本地 FFmpeg 进程
      tags: [Exports]
      responses:
        "200":
          description: 取消后的当前任务状态
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/projects/{projectId}/canvas/commands:
    parameters:
      - {$ref: "#/components/parameters/ProjectId"}
    post:
      operationId: applyCanvasCommands
      summary: 原子批量保存画布展示命令
      tags: [Canvas]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CanvasCommandBatchRequest"}
      responses:
        "200":
          description: 保存后的权威画布
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Canvas"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
components:
  schemas:
    MediaSettings:
      type: object
      additionalProperties: false
      required: [connections, defaults]
      properties:
        connections:
          type: array
          items: {$ref: "#/components/schemas/MediaConnection"}
        defaults:
          type: array
          items: {$ref: "#/components/schemas/MediaDefault"}
    MediaConnection:
      type: object
      additionalProperties: false
      required: [id, name, platform, enabled, version, connectionVersion, origin,
        keyMask, connectivityStatus, realGenerationTested, capabilities]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        platform: {type: string, enum: [MOCK, COMFYUI, OPENAI, ARK, GOOGLE]}
        enabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
        connectionVersion: {type: integer, minimum: 1}
        origin: {type: [string, "null"]}
        keyMask: {type: [string, "null"]}
        connectivityStatus: {type: string, enum: [NOT_CHECKED]}
        realGenerationTested: {type: boolean}
        capabilities:
          type: array
          items: {$ref: "#/components/schemas/MediaCapability"}
    MediaCapability:
      type: object
      additionalProperties: false
      required: [id, name, enabled, version, capabilityVersion, adapterId, kind,
        minimumSeconds, maximumSeconds, mappingSha256, settings]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        enabled: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
        capabilityVersion: {type: integer, minimum: 1}
        adapterId: {type: string}
        kind: {type: string, enum: [IMAGE_GENERATION, VIDEO_GENERATION]}
        minimumSeconds: {type: integer, minimum: 0}
        maximumSeconds: {type: integer, minimum: 0}
        mappingSha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        settings: {$ref: "#/components/schemas/FixedMediaAdapterSettings"}
    FixedMediaAdapterSettings:
      type: object
      additionalProperties: false
      description: Fixed adapters accept only their declared settings; model IDs and endpoints are not editable.
      properties:
        checkpoint: {type: string, maxLength: 160}
        diffusionModel: {type: string, maxLength: 160}
        textEncoder: {type: string, maxLength: 160}
        vae: {type: string, maxLength: 160}
        clipVision: {type: string, maxLength: 160}
        quality: {type: string, enum: [low, medium, high]}
    MediaDefault:
      type: object
      additionalProperties: false
      required: [kind, capabilityId, version]
      properties:
        kind: {type: string, enum: [IMAGE_GENERATION, VIDEO_GENERATION]}
        capabilityId: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0}
    CreateMediaConnectionRequest:
      type: object
      additionalProperties: false
      required: [name, platform]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        platform: {type: string, enum: [MOCK, COMFYUI, OPENAI, ARK, GOOGLE]}
        origin: {type: [string, "null"], maxLength: 500}
        apiKey: {type: [string, "null"], maxLength: 4096}
    UpdateMediaConnectionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, name, enabled]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 160}
        enabled: {type: boolean}
        origin: {type: [string, "null"], maxLength: 500}
        apiKey: {type: [string, "null"], maxLength: 4096}
    CreateMediaCapabilityRequest:
      type: object
      additionalProperties: false
      required: [name, adapterId]
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        adapterId: {type: string, minLength: 1, maxLength: 80}
        settings: {$ref: "#/components/schemas/FixedMediaAdapterSettings"}
    UpdateMediaCapabilityRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, name, enabled, adapterId]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 160}
        enabled: {type: boolean}
        adapterId: {type: string, minLength: 1, maxLength: 80}
        settings: {$ref: "#/components/schemas/FixedMediaAdapterSettings"}
    SetMediaDefaultRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, capabilityId]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        capabilityId: {type: string, format: uuid}
    SystemDiagnostics:
      type: object
      additionalProperties: false
      required: [checkedAt, database, storage, llmMode, llmConfigured,
        llmToolCallingVerified, mediaMode, imageConfigured, videoConfigured, recentErrors]
      properties:
        checkedAt: {type: string, format: date-time}
        database: {type: string, enum: [AVAILABLE, UNAVAILABLE]}
        storage: {type: string, enum: [AVAILABLE, UNAVAILABLE]}
        llmMode: {type: string, enum: [MOCK, CONFIGURED]}
        llmConfigured: {type: boolean}
        llmToolCallingVerified: {type: boolean}
        mediaMode: {type: string, enum: [MOCK, COMFYUI]}
        imageConfigured: {type: boolean}
        videoConfigured: {type: boolean}
        recentErrors:
          type: array
          items: {$ref: "#/components/schemas/RecentTaskError"}
    RecentTaskError:
      type: object
      additionalProperties: false
      required: [status, count, lastAt]
      properties:
        status: {type: string, enum: [FAILED, UNKNOWN, BLOCKED]}
        count: {type: integer, format: int64, minimum: 1}
        lastAt: {type: string, format: date-time}
    LlmSettings:
      type: object
      additionalProperties: false
      required: [configured, version, endpoint, modelId, keyMask,
        toolCallingVerified, updatedAt]
      properties:
        configured: {type: boolean}
        version: {type: integer, minimum: 0}
        endpoint: {type: [string, "null"], maxLength: 500}
        modelId: {type: [string, "null"], maxLength: 160}
        keyMask: {type: [string, "null"], maxLength: 16}
        toolCallingVerified: {type: boolean}
        updatedAt: {type: [string, "null"], format: date-time}
    ReplaceLlmSettingsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, endpoint, modelId, apiKey]
      properties:
        expectedVersion: {type: integer, minimum: 0}
        endpoint: {type: string, minLength: 1, maxLength: 500, format: uri}
        modelId: {type: string, minLength: 1, maxLength: 160}
        apiKey: {type: string, minLength: 8, maxLength: 4096, writeOnly: true}
    DiagnoseLlmRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, acknowledgeCost]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        acknowledgeCost: {type: boolean}
    UsageEntry:
      type: object
      additionalProperties: false
      required: [id, runId, taskId, operationKey, entryType, quantity, estimatedCost,
        actualCost, currency, costStatus, costSource, providerConfigVersion,
        workflowVersion, modelId, createdAt]
      properties:
        id: {type: string, format: uuid}
        runId: {type: [string, "null"], format: uuid}
        taskId: {type: [string, "null"], format: uuid}
        operationKey: {type: string}
        entryType: {type: string, enum: [RESERVATION, SETTLEMENT, RELEASE]}
        quantity:
          type: object
          additionalProperties: false
          required: [imageCount, videoCount, videoSeconds, exportCount,
            llmRequestCount, inputTokens, outputTokens]
          properties:
            imageCount: {type: integer, minimum: 0}
            videoCount: {type: integer, minimum: 0}
            videoSeconds: {type: string, pattern: "^[0-9]+\\.[0-9]{3}$"}
            exportCount: {type: integer, minimum: 0}
            llmRequestCount: {type: integer, minimum: 0}
            inputTokens: {type: [integer, "null"], minimum: 0}
            outputTokens: {type: [integer, "null"], minimum: 0}
        estimatedCost: {type: [string, "null"], pattern: "^[0-9]+(\\.[0-9]+)?$"}
        actualCost: {type: [string, "null"], pattern: "^[0-9]+(\\.[0-9]+)?$"}
        currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        costStatus: {type: string, enum: [KNOWN, ESTIMATED, UNKNOWN]}
        costSource: {type: string}
        providerConfigVersion: {type: [integer, "null"], minimum: 1}
        workflowVersion: {type: [string, "null"]}
        modelId: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
    ProjectExportManifest:
      type: object
      additionalProperties: false
      required: [schemaVersion, generatedAt, snapshotSeq, project, artifacts, assets]
      properties:
        schemaVersion: {type: integer, const: 1}
        generatedAt: {type: string, format: date-time}
        snapshotSeq: {type: integer, format: int64, minimum: 0}
        project: {$ref: "#/components/schemas/ManifestProject"}
        artifacts:
          type: array
          items: {$ref: "#/components/schemas/ManifestArtifact"}
        assets:
          type: array
          items: {$ref: "#/components/schemas/ManifestAsset"}
    ManifestProject:
      type: object
      additionalProperties: false
      required: [id, name, aspectRatio, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        aspectRatio: {$ref: "#/components/schemas/AspectRatio"}
        status: {$ref: "#/components/schemas/ProjectStatus"}
        createdAt: {type: string, format: date-time}
    ManifestArtifact:
      type: object
      additionalProperties: false
      required: [id, kind, title, currentVersionId, versions]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
        title: {type: string}
        currentVersionId: {type: string, format: uuid}
        archivedAt: {type: [string, "null"], format: date-time}
        versions:
          type: array
          items: {$ref: "#/components/schemas/ManifestArtifactVersion"}
    ManifestArtifactVersion:
      type: object
      additionalProperties: false
      required: [id, versionNo, schemaVersion, createdAt, content]
      properties:
        id: {type: string, format: uuid}
        versionNo: {type: integer, minimum: 1}
        schemaVersion: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        content: {$ref: "#/components/schemas/ManifestVersionContent"}
    ManifestVersionContent:
      type: object
      description: 按产物类型白名单复制的创作字段；排除任意 parameters、sourceTaskId 和内部配置
      additionalProperties: false
      properties:
        format: {type: string}
        text: {type: string}
        name: {type: string}
        description: {type: string}
        appearance: {type: string}
        referenceVersionIds: {type: array, items: {type: string, format: uuid}}
        location: {type: string}
        timeOfDay: {type: string}
        lighting: {type: string}
        style: {type: string}
        order: {type: integer}
        durationMs: {type: integer}
        durationSeconds: {type: integer, minimum: 1, maximum: 30}
        camera: {type: string}
        action: {type: string}
        characterVersionIds: {type: array, items: {type: string, format: uuid}}
        sceneVersionId: {type: string, format: uuid}
        selectedImageVersionId: {type: [string, "null"], format: uuid}
        selectedVideoVersionId: {type: [string, "null"], format: uuid}
        assetId: {type: string, format: uuid}
        prompt: {type: string}
        negativePrompt: {type: string}
        providerConfigVersion: {type: integer}
        workflowVersion: {type: string}
        keyframeVersionId: {type: string, format: uuid}
    ManifestAsset:
      type: object
      additionalProperties: false
      required: [id, mediaKind, contentType, byteSize, sha256, durationMs, createdAt]
      properties:
        id: {type: string, format: uuid}
        mediaKind: {type: string, enum: [IMAGE, VIDEO]}
        contentType: {type: string}
        byteSize: {type: integer, format: int64, minimum: 1}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        width: {type: [integer, "null"]}
        height: {type: [integer, "null"]}
        durationMs: {type: [integer, "null"], minimum: 1, maximum: 60000}
        thumbnailSha256: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
    MediaExportSegment:
      type: object
      additionalProperties: false
      required: [videoArtifactId, videoVersionId, startSeconds, endSeconds]
      properties:
        videoArtifactId: {type: string, format: uuid}
        videoVersionId: {type: string, format: uuid}
        startSeconds: {type: integer, minimum: 0, maximum: 59}
        endSeconds: {type: integer, minimum: 1, maximum: 60}
    CreateMediaExportRequest:
      type: object
      additionalProperties: false
      required: [segments]
      properties:
        segments:
          type: array
          minItems: 1
          maxItems: 6
          items: {$ref: "#/components/schemas/MediaExportSegment"}
    ExportProposalSegmentV1:
      type: object
      additionalProperties: false
      required: [videoArtifactId, videoVersionId, assetId, assetSha256, startMs, endMs, shotArtifactId, shotVersionId]
      properties:
        videoArtifactId: {type: string, format: uuid}
        videoVersionId: {type: string, format: uuid}
        assetId: {type: string, format: uuid}
        assetSha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        startMs: {type: integer, minimum: 0, maximum: 60000}
        endMs: {type: integer, minimum: 1, maximum: 60000}
        shotArtifactId: {type: string, format: uuid}
        shotVersionId: {type: string, format: uuid}
    ExportProposalSegmentV2:
      type: object
      additionalProperties: false
      required: [videoArtifactId, videoVersionId, assetId, assetSha256, startSeconds, endSeconds, shotArtifactId, shotVersionId]
      properties:
        videoArtifactId: {type: string, format: uuid}
        videoVersionId: {type: string, format: uuid}
        assetId: {type: string, format: uuid}
        assetSha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        startSeconds: {type: integer, minimum: 0, maximum: 59}
        endSeconds: {type: integer, minimum: 1, maximum: 60}
        shotArtifactId: {type: string, format: uuid}
        shotVersionId: {type: string, format: uuid}
    ExportProposalInputV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, aspectRatio, outputFormat, segments, durationMs]
      properties:
        schemaVersion: {type: integer, const: 1}
        aspectRatio: {type: string, enum: [LANDSCAPE_16_9, PORTRAIT_9_16, SQUARE_1_1]}
        outputFormat: {type: string, const: SILENT_MP4_720P_24FPS}
        segments:
          type: array
          minItems: 1
          maxItems: 6
          items: {$ref: "#/components/schemas/ExportProposalSegmentV1"}
        durationMs: {type: integer, minimum: 1, maximum: 60000}
    ExportProposalInputV2:
      type: object
      additionalProperties: false
      required: [schemaVersion, aspectRatio, outputFormat, segments, durationSeconds]
      properties:
        schemaVersion: {type: integer, const: 2}
        aspectRatio: {type: string, enum: [LANDSCAPE_16_9, PORTRAIT_9_16, SQUARE_1_1]}
        outputFormat: {type: string, const: SILENT_MP4_720P_24FPS}
        segments:
          type: array
          minItems: 1
          maxItems: 6
          items: {$ref: "#/components/schemas/ExportProposalSegmentV2"}
        durationSeconds: {type: integer, minimum: 1, maximum: 60}
    ExportProposalInput:
      oneOf:
        - {$ref: "#/components/schemas/ExportProposalInputV1"}
        - {$ref: "#/components/schemas/ExportProposalInputV2"}
    ExportProposal:
      type: object
      additionalProperties: false
      required: [id, runId, status, input, proposalHash, projectVersion, approvedTaskId, createdAt, decidedAt]
      properties:
        id: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED, STALE]}
        input: {$ref: "#/components/schemas/ExportProposalInput"}
        proposalHash: {type: string, pattern: "^[0-9a-f]{64}$"}
        projectVersion: {type: integer, format: int64, minimum: 0}
        approvedTaskId: {type: [string, "null"], format: uuid}
        createdAt: {type: string, format: date-time}
        decidedAt: {type: [string, "null"], format: date-time}
    ApproveExportProposalRequest:
      type: object
      additionalProperties: false
      required: [proposalHash]
      properties:
        proposalHash: {type: string, pattern: "^[0-9a-f]{64}$"}
    ExportProposalApproval:
      type: object
      additionalProperties: false
      required: [proposal, task, replayed]
      properties:
        proposal: {$ref: "#/components/schemas/ExportProposal"}
        task: {$ref: "#/components/schemas/Task"}
        replayed: {type: boolean}
    SetupStatus:
      type: object
      additionalProperties: false
      required: [setupRequired]
      properties:
        setupRequired: {type: boolean}
    CsrfToken:
      type: object
      additionalProperties: false
      required: [headerName, token]
      properties:
        headerName: {type: string, const: X-XSRF-TOKEN}
        token: {type: string, minLength: 1}
    SetupRequest:
      type: object
      additionalProperties: false
      required: [loginName, password]
      properties:
        loginName:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[A-Za-z0-9._-]+$"
        password: {type: string, minLength: 12, maxLength: 128}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [loginName, password]
      properties:
        loginName: {type: string, minLength: 3, maxLength: 64}
        password: {type: string, minLength: 1, maxLength: 128}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, minLength: 1, maxLength: 128}
        newPassword: {type: string, minLength: 12, maxLength: 128}
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, loginName, role]
      properties:
        id: {type: string, format: uuid}
        loginName: {type: string}
        role: {type: string, const: ADMIN}
    AspectRatio:
      type: string
      enum: [LANDSCAPE_16_9, PORTRAIT_9_16, SQUARE_1_1]
    ProjectStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name, aspectRatio]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        aspectRatio: {$ref: "#/components/schemas/AspectRatio"}
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 120}
        aspectRatio: {$ref: "#/components/schemas/AspectRatio"}
    ArchiveProjectRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
    Project:
      type: object
      additionalProperties: false
      required: [id, name, aspectRatio, status, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        aspectRatio: {$ref: "#/components/schemas/AspectRatio"}
        status: {$ref: "#/components/schemas/ProjectStatus"}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        archivedAt:
          type: [string, "null"]
          format: date-time
    ProjectList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Project"}
        nextCursor:
          type: [string, "null"]
    Asset:
      type: object
      additionalProperties: false
      required: [id, projectId, mediaKind, contentType, byteSize, sha256, width, height, durationMs, createdAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        mediaKind: {type: string, enum: [IMAGE, VIDEO]}
        contentType: {type: string}
        byteSize: {type: integer, format: int64, minimum: 1}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        width: {type: [integer, "null"], minimum: 1}
        height: {type: [integer, "null"], minimum: 1}
        durationMs: {type: [integer, "null"], minimum: 1, maximum: 60000}
        createdAt: {type: string, format: date-time}
    ArtifactKind:
      type: string
      enum: [TEXT, IMAGE, VIDEO, CHARACTER, SCENE, SHOT]
    ArtifactContent:
      oneOf:
        - {$ref: "./artifact-schemas/text-v1.schema.json"}
        - {$ref: "./artifact-schemas/image-v1.schema.json"}
        - {$ref: "./artifact-schemas/video-v1.schema.json"}
        - {$ref: "./artifact-schemas/character-v1.schema.json"}
        - {$ref: "./artifact-schemas/scene-v1.schema.json"}
        - {$ref: "./artifact-schemas/shot-v1.schema.json"}
        - {$ref: "./artifact-schemas/shot-v2.schema.json"}
    WritableArtifactContent:
      oneOf:
        - {$ref: "./artifact-schemas/text-v1.schema.json"}
        - {$ref: "./artifact-schemas/image-v1.schema.json"}
        - {$ref: "./artifact-schemas/video-v1.schema.json"}
        - {$ref: "./artifact-schemas/character-v1.schema.json"}
        - {$ref: "./artifact-schemas/scene-v1.schema.json"}
        - {$ref: "./artifact-schemas/shot-v2.schema.json"}
    ShotSceneEdit:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        location: {type: string, minLength: 1, maxLength: 500}
        timeOfDay: {type: string, minLength: 1, maxLength: 80}
        lighting: {type: string, minLength: 1, maxLength: 1000}
        style: {type: string, minLength: 1, maxLength: 1000}
    ReviseShotForRedoRequest:
      type: object
      additionalProperties: false
      required: [expectedShotVersionId, expectedShotArtifactVersion, description, camera, action, durationSeconds]
      properties:
        expectedShotVersionId: {type: string, format: uuid}
        expectedShotArtifactVersion: {type: integer, format: int64, minimum: 0}
        description: {type: string, minLength: 1, maxLength: 4000}
        camera: {type: string, minLength: 1, maxLength: 1000}
        action: {type: string, minLength: 1, maxLength: 2000}
        durationSeconds: {type: integer, minimum: 1, maximum: 30}
        scene: {$ref: "#/components/schemas/ShotSceneEdit"}
    ShotRedoResult:
      type: object
      additionalProperties: false
      required: [shot, scene]
      properties:
        shot: {$ref: "#/components/schemas/Artifact"}
        scene:
          oneOf:
            - {$ref: "#/components/schemas/Artifact"}
            - {type: "null"}
    CreateArtifactRequest:
      type: object
      additionalProperties: false
      required: [kind, title, content]
      properties:
        kind: {$ref: "#/components/schemas/ArtifactKind"}
        title: {type: string, minLength: 1, maxLength: 160}
        content: {$ref: "#/components/schemas/WritableArtifactContent"}
    ReviseArtifactRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, content]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        title: {type: string, minLength: 1, maxLength: 160}
        content: {$ref: "#/components/schemas/WritableArtifactContent"}
    SelectArtifactVersionRequest:
      type: object
      additionalProperties: false
      required: [versionId, expectedVersion]
      properties:
        versionId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    ArtifactInputReference:
      type: object
      additionalProperties: false
      required: [versionId, role, order, kind]
      properties:
        versionId: {type: string, format: uuid}
        role: {type: string, minLength: 1, maxLength: 64}
        order: {type: integer, minimum: 0}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
    ArtifactVersion:
      type: object
      additionalProperties: false
      required: [id, versionNo, schemaVersion, content, inputReferences, createdByKind, createdAt]
      properties:
        id: {type: string, format: uuid}
        versionNo: {type: integer, minimum: 1}
        schemaVersion: {type: integer, enum: [1, 2]}
        content: {$ref: "#/components/schemas/ArtifactContent"}
        inputReferences:
          type: array
          items: {$ref: "#/components/schemas/ArtifactInputReference"}
        createdByKind: {type: string, enum: [USER, AGENT, TASK]}
        runId: {type: [string, "null"], format: uuid}
        createdAt: {type: string, format: date-time}
    Artifact:
      type: object
      additionalProperties: false
      required: [id, projectId, kind, title, currentVersionId, version, createdAt, updatedAt, currentVersion]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
        title: {type: string, minLength: 1, maxLength: 160}
        currentVersionId: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        currentVersion: {$ref: "#/components/schemas/ArtifactVersion"}
    ArtifactVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ArtifactVersion"}
    AgentBindingRequest:
      type: object
      additionalProperties: false
      required: [artifactId, selectedVersionId]
      properties:
        artifactId: {type: string, format: uuid}
        selectedVersionId: {type: string, format: uuid}
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name, instruction, bindings]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        instruction: {type: string, minLength: 1, maxLength: 8000}
        bindings:
          type: array
          maxItems: 40
          items: {$ref: "#/components/schemas/AgentBindingRequest"}
    UpdateAgentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, name, instruction, bindings]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 120}
        instruction: {type: string, minLength: 1, maxLength: 8000}
        bindings:
          type: array
          maxItems: 40
          items: {$ref: "#/components/schemas/AgentBindingRequest"}
    AgentBinding:
      type: object
      additionalProperties: false
      required: [id, artifactId, selectedVersionId, bindingType]
      properties:
        id: {type: string, format: uuid}
        artifactId: {type: string, format: uuid}
        selectedVersionId: {type: string, format: uuid}
        bindingType: {type: string, const: INPUT}
    Agent:
      type: object
      additionalProperties: false
      required: [id, projectId, profileKey, profileVersion, name, instruction, outputGroupId, version, createdAt, updatedAt, bindings]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        profileKey: {type: string, const: creator}
        profileVersion: {type: integer, minimum: 1}
        name: {type: string}
        instruction: {type: string}
        outputGroupId: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        bindings:
          type: array
          items: {$ref: "#/components/schemas/AgentBinding"}
    AgentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Agent"}
    AgentRunStatus:
      type: string
      enum: [QUEUED, RUNNING, WAITING_APPROVAL, WAITING_TASKS, BLOCKED, CANCEL_REQUESTED, CANCELED, FAILED, SUCCEEDED]
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [agentId, instruction]
      properties:
        agentId: {type: string, format: uuid}
        instruction: {type: string, minLength: 1, maxLength: 20000}
        expectedAgentVersion: {type: integer, format: int64, minimum: 0}
        expectedModelConfigSource:
          type: string
          maxLength: 80
          description: 运行前预览中的模型配置来源；须与 expectedModelConfigVersion 同时提交
        expectedModelConfigVersion:
          type: integer
          minimum: 1
          description: 运行前预览中的模型配置版本；配置变化时创建返回 409
        expectedSystemPromptVersion:
          type: integer
          minimum: 1
          description: 运行前预览中的系统提示词版本；规则变化时创建返回 409
        redoShotArtifactId:
          type: string
          format: uuid
          description: 可选单镜头重做范围；必须为 Agent 明确绑定的当前镜头版本
        selectedItemIds:
          type: array
          maxItems: 20
          uniqueItems: true
          description: 启动 Run 时选中的同项目画布卡片；仅供上下文指向，不授予工具修改权限
          items: {type: string, format: uuid}
    RunContextSnapshot:
      type: object
      additionalProperties: true
      required: [agentId, agentVersion, profileKey, profileVersion, outputGroupId, bindings]
      properties:
        agentId: {type: string, format: uuid}
        agentVersion: {type: integer, format: int64, minimum: 0}
        profileKey: {type: string}
        profileVersion: {type: integer, minimum: 1}
        outputGroupId: {type: string, format: uuid}
        bindings:
          type: array
          items: {$ref: "#/components/schemas/RunInputSnapshot"}
        selection:
          type: array
          maxItems: 20
          description: 创建 Run 时由服务端核对并固定的画布选择；不扩大工具权限
          items:
            type: object
            additionalProperties: false
            required: [itemId, subjectType, subjectId]
            properties:
              itemId: {type: string, format: uuid}
              subjectType: {type: string, enum: [ARTIFACT, AGENT]}
              subjectId: {type: string, format: uuid}
              versionId: {type: string, format: uuid}
              kind: {$ref: "#/components/schemas/ArtifactKind"}
    RunInputSnapshot:
      type: object
      additionalProperties: false
      required: [artifactId, selectedVersionId, bindingType]
      properties:
        artifactId: {type: string, format: uuid}
        selectedVersionId: {type: string, format: uuid}
        bindingType: {type: string, const: INPUT}
    RunPreflightBinding:
      type: object
      additionalProperties: false
      required: [artifactId, selectedVersionId, artifactTitle, artifactKind]
      properties:
        artifactId: {type: string, format: uuid}
        selectedVersionId: {type: string, format: uuid}
        artifactTitle: {type: string}
        artifactKind: {$ref: "#/components/schemas/ArtifactKind"}
    RunPreflight:
      type: object
      additionalProperties: false
      required: [agentId, agentVersion, agentName, agentInstruction, bindings, modelAvailable, providerAdapter, modelId, toolCalling, policySnapshot]
      properties:
        agentId: {type: string, format: uuid}
        agentVersion: {type: integer, format: int64, minimum: 0}
        agentName: {type: string}
        agentInstruction: {type: string}
        bindings:
          type: array
          items: {$ref: "#/components/schemas/RunPreflightBinding"}
        modelAvailable: {type: boolean}
        providerAdapter: {type: [string, "null"]}
        modelId: {type: [string, "null"]}
        toolCalling: {type: boolean}
        policySnapshot: {$ref: "#/components/schemas/RunPolicySnapshot"}
    RunPolicySnapshot:
      type: object
      additionalProperties: false
      description: >-
        New Run policies are schema v2 and pin systemPromptVersion=2. Historical v1
        snapshots lack this field and cannot safely start an uncheckpointed model turn.
      required: [schemaVersion, modelConfigSource, modelConfigVersion, maxModelTurns, maxToolExecutions, maxImages, maxVideos, maxShots]
      properties:
        schemaVersion: {type: integer, enum: [1, 2]}
        systemPromptVersion: {type: integer, enum: [1, 2], description: Required on new v2 snapshots; absent on historical v1 snapshots.}
        modelConfigSource: {type: string}
        modelConfigVersion: {type: integer, minimum: 1}
        maxModelTurns: {type: integer, minimum: 1}
        maxToolExecutions: {type: integer, minimum: 1}
        maxImages: {type: integer, minimum: 0}
        maxVideos: {type: integer, minimum: 0}
        maxShots: {type: integer, minimum: 1}
    AgentRun:
      type: object
      additionalProperties: false
      required: [id, projectId, agentInstanceId, status, instruction, contextSnapshot, policySnapshot, profileVersion, nextStepIndex, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        agentInstanceId: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/AgentRunStatus"}
        instruction: {type: string}
        contextSnapshot: {$ref: "#/components/schemas/RunContextSnapshot"}
        policySnapshot: {$ref: "#/components/schemas/RunPolicySnapshot"}
        profileVersion: {type: integer, minimum: 1}
        nextStepIndex: {type: integer, minimum: 0}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    AgentRunSummary:
      type: object
      additionalProperties: false
      required: [id, agentInstanceId, status, instruction, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        agentInstanceId: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/AgentRunStatus"}
        instruction: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    AgentRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AgentRunSummary"}
        nextCursor: {type: [string, "null"]}
    ExecutionPlanStep:
      type: object
      additionalProperties: false
      required: [stepKey, ordinal, kind, shotArtifactId, shotVersionId, imageArtifactId, imageVersionId, outputSlotKey, input, dependencyKeys, binding]
      properties:
        stepKey: {type: string, minLength: 1}
        ordinal: {type: integer, minimum: 0}
        kind: {$ref: "#/components/schemas/TaskKind"}
        shotArtifactId: {type: string, format: uuid}
        shotVersionId: {type: string, format: uuid}
        imageArtifactId: {type: [string, "null"], format: uuid}
        imageVersionId: {type: [string, "null"], format: uuid}
        outputSlotKey: {type: string, minLength: 1}
        input: {type: object, additionalProperties: true}
        dependencyKeys:
          type: array
          items: {type: string}
        binding:
          oneOf:
            - {$ref: "#/components/schemas/MediaCapabilityBinding"}
            - {type: "null"}
    MediaCapabilityBinding:
      type: object
      additionalProperties: false
      required: [connectionId, connectionVersion, capabilityId, capabilityVersion, adapterId, mappingSha256]
      properties:
        connectionId: {type: string, format: uuid}
        connectionVersion: {type: integer, minimum: 1}
        capabilityId: {type: string, format: uuid}
        capabilityVersion: {type: integer, minimum: 1}
        adapterId: {type: string}
        mappingSha256: {type: string, pattern: "^[0-9a-f]{64}$"}
    MediaCapabilityCandidate:
      type: object
      additionalProperties: false
      required: [binding, connectionName, capabilityName, kind, minimumSeconds,
        maximumSeconds, realGenerationTested, settings]
      properties:
        binding: {$ref: "#/components/schemas/MediaCapabilityBinding"}
        connectionName: {type: string}
        capabilityName: {type: string}
        kind: {type: string, enum: [IMAGE_GENERATION, VIDEO_GENERATION]}
        minimumSeconds: {type: integer, minimum: 0}
        maximumSeconds: {type: integer, minimum: 0}
        realGenerationTested: {type: boolean}
        settings: {$ref: "#/components/schemas/FixedMediaAdapterSettings"}
    ExecutionPlan:
      type: object
      additionalProperties: false
      required: [id, projectId, runId, revision, stage, status, objective, plan, inputSnapshot, inputSnapshotHash, planHash, providerConfigVersion, workflowVersion, estimate, createdAt, updatedAt, steps]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        stage: {type: string, enum: [IMAGE, VIDEO]}
        status: {type: string, enum: [NEEDS_INPUT, PENDING, APPROVED, REJECTED, STALE]}
        objective: {type: string}
        plan: {type: object, additionalProperties: true}
        inputSnapshot: {type: object, additionalProperties: true}
        inputSnapshotHash: {type: string, pattern: "^[0-9a-f]{64}$"}
        planHash: {type: string, pattern: "^[0-9a-f]{64}$"}
        providerConfigVersion: {type: integer, minimum: 1}
        workflowVersion: {type: string}
        estimate: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        steps:
          type: array
          items: {$ref: "#/components/schemas/ExecutionPlanStep"}
    ApproveExecutionPlanRequest:
      type: object
      additionalProperties: false
      required: [planHash, confirmedStepKeys]
      properties:
        planHash: {type: string, pattern: "^[0-9a-f]{64}$"}
        confirmedStepKeys:
          type: array
          items: {type: string}
    ReviseExecutionPlanStepRequest:
      type: object
      additionalProperties: false
      required: [expectedPlanHash, inputPatch]
      properties:
        expectedPlanHash: {type: string, pattern: "^[0-9a-f]{64}$"}
        capabilityId: {type: [string, "null"], format: uuid}
        inputPatch:
          type: object
          additionalProperties: false
          properties:
            prompt: {type: string}
            negativePrompt: {type: [string, "null"]}
            imageArtifactId: {type: [string, "null"], format: uuid}
            imageVersionId: {type: [string, "null"], format: uuid}
    ExecutionPlanApproval:
      type: object
      additionalProperties: false
      required: [approvalId, plan, tasks, replayed]
      properties:
        approvalId: {type: string, format: uuid}
        plan: {$ref: "#/components/schemas/ExecutionPlan"}
        tasks:
          type: array
          items: {$ref: "#/components/schemas/Task"}
        replayed: {type: boolean}
    SelectShotKeyframeRequest:
      type: object
      additionalProperties: false
      required: [shotVersionId, imageArtifactId, imageVersionId, expectedVersion]
      properties:
        shotVersionId: {type: string, format: uuid}
        imageArtifactId: {type: string, format: uuid}
        imageVersionId: {type: string, format: uuid}
        expectedVersion: {type: [integer, "null"], format: int64, minimum: 0}
    ShotKeyframeSelection:
      type: object
      additionalProperties: false
      required: [projectId, shotArtifactId, shotVersionId, imageArtifactId, imageVersionId, sourceTaskId, selectedByUserId, version, createdAt, updatedAt]
      properties:
        projectId: {type: string, format: uuid}
        shotArtifactId: {type: string, format: uuid}
        shotVersionId: {type: string, format: uuid}
        imageArtifactId: {type: string, format: uuid}
        imageVersionId: {type: string, format: uuid}
        sourceTaskId: {type: string, format: uuid}
        selectedByUserId: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TaskKind:
      type: string
      enum: [AGENT_TURN, IMAGE_GENERATION, VIDEO_GENERATION, MEDIA_EXPORT, ASSET_INGEST]
    TaskStatus:
      type: string
      enum: [PENDING, READY, RUNNING, SUBMITTING, WAITING_PROVIDER, UNKNOWN, BLOCKED, SUCCEEDED, FAILED, CANCELED]
    ManualUnknownAttemptRequest:
      type: object
      additionalProperties: false
      required: [expectedTaskVersion, riskAcknowledgement]
      properties:
        expectedTaskVersion: {type: integer, format: int64, minimum: 0}
        riskAcknowledgement:
          type: string
          enum: [ACCEPT_POSSIBLE_DUPLICATE_COST]
    ProviderAttempt:
      type: object
      additionalProperties: false
      required: [id, taskId, status, requestKey, reconcilable, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        status: {type: string, enum: [SUBMITTING, ACCEPTED, UNKNOWN, REJECTED]}
        requestKey:
          type: string
          format: uuid
          description: 提交前生成的随机关联键，不是幂等保证或已受理证明
        candidateRequestId:
          type: [string, "null"]
          format: uuid
          description: 仅新协议明确把关联键作为 Provider 查询 ID 发出时有值；旧 attempt 为空，仍不是已受理证明
        reconcilable:
          type: boolean
          description: 仅表示账本具有候选 ID 与提交时 endpoint 指纹；仍须验证当前配置与原 Provider 响应
        providerRequestId: {type: [string, "null"]}
        replacementTaskId:
          type: [string, "null"]
          format: uuid
          description: 用户明确接受重复费用后创建的新尝试；原 UNKNOWN 仍保留
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ReconciliationResult:
      type: object
      additionalProperties: false
      required: [outcome, taskId, taskStatus]
      properties:
        outcome: {type: string, enum: [NO_EVIDENCE, RESUMED]}
        taskId: {type: string, format: uuid}
        taskStatus: {$ref: "#/components/schemas/TaskStatus"}
        providerRequestId: {type: [string, "null"]}
    Task:
      type: object
      additionalProperties: false
      required: [id, projectId, runId, stepKey, kind, status, cancelRequested, input, attemptNo, nextActionAt, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        runId: {type: [string, "null"], format: uuid}
        planId: {type: [string, "null"], format: uuid}
        stepKey: {type: string}
        kind: {$ref: "#/components/schemas/TaskKind"}
        status: {$ref: "#/components/schemas/TaskStatus"}
        cancelRequested: {type: boolean, description: "已要求停止本系统后续编排，不表示外部任务已停止或退款"}
        input: {type: object, additionalProperties: true}
        output:
          oneOf:
            - {type: object, additionalProperties: true}
            - {type: "null"}
        providerId: {type: [string, "null"], format: uuid}
        providerRequestId: {type: [string, "null"]}
        attemptNo: {type: integer, minimum: 1}
        nextActionAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
        errorCode: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    CanvasSubjectType:
      type: string
      enum: [ARTIFACT, AGENT]
    CanvasItem:
      type: object
      additionalProperties: false
      required: [id, subjectType, subjectId, x, y, width, height, zIndex, locked, version, artifact, agent]
      properties:
        id: {type: string, format: uuid}
        subjectType: {$ref: "#/components/schemas/CanvasSubjectType"}
        subjectId: {type: string, format: uuid}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
        locked: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
        artifact:
          oneOf:
            - {$ref: "#/components/schemas/Artifact"}
            - {type: "null"}
        agent:
          oneOf:
            - {$ref: "#/components/schemas/Agent"}
            - {type: "null"}
    Canvas:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CanvasItem"}
    ProjectSnapshot:
      type: object
      additionalProperties: false
      required: [project, canvas, agents, activeRun, activeTasks, unknownTasks, snapshotSeq]
      properties:
        project: {$ref: "#/components/schemas/Project"}
        canvas: {$ref: "#/components/schemas/Canvas"}
        agents:
          type: array
          items: {$ref: "#/components/schemas/Agent"}
        activeRun:
          oneOf:
            - {$ref: "#/components/schemas/AgentRun"}
            - {type: "null"}
        activeTasks:
          type: array
          items: {$ref: "#/components/schemas/Task"}
        unknownTasks:
          type: array
          description: 最近 100 个未核对的外部提交，取消 Run 后仍可见
          items: {$ref: "#/components/schemas/Task"}
        snapshotSeq: {type: integer, format: int64, minimum: 0}
    ProjectEvent:
      type: object
      additionalProperties: false
      required: [projectId, seq, eventId, type, schemaVersion, aggregateId, aggregateVersion, payload, occurredAt]
      properties:
        projectId: {type: string, format: uuid}
        seq: {type: integer, format: int64, minimum: 1}
        eventId: {type: string, format: uuid}
        type: {type: string, minLength: 3, maxLength: 120}
        schemaVersion: {type: integer, minimum: 1}
        aggregateId: {type: string, format: uuid}
        aggregateVersion: {type: integer, format: int64, minimum: 0}
        payload: {type: object, additionalProperties: true}
        occurredAt: {type: string, format: date-time}
    PlaceArtifactCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, artifactId, x, y, width, height, zIndex]
      properties:
        type: {type: string, const: PLACE_ARTIFACT}
        itemId: {type: string, format: uuid}
        artifactId: {type: string, format: uuid}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
        locked: {type: boolean, default: false}
    PlaceAgentCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, agentId, x, y, width, height, zIndex]
      properties:
        type: {type: string, const: PLACE_AGENT}
        itemId: {type: string, format: uuid}
        agentId: {type: string, format: uuid}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
        locked: {type: boolean, default: false}
    UpdateLayoutCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, expectedVersion, x, y, width, height, zIndex]
      properties:
        type: {type: string, const: UPDATE_LAYOUT}
        itemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
    SetCanvasItemLockedCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, expectedVersion, locked]
      properties:
        type: {type: string, const: SET_LOCKED}
        itemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        locked: {type: boolean}
    RemoveCanvasItemCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, expectedVersion]
      properties:
        type: {type: string, const: REMOVE}
        itemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    CanvasCommand:
      oneOf:
        - {$ref: "#/components/schemas/PlaceArtifactCommand"}
        - {$ref: "#/components/schemas/PlaceAgentCommand"}
        - {$ref: "#/components/schemas/UpdateLayoutCommand"}
        - {$ref: "#/components/schemas/SetCanvasItemLockedCommand"}
        - {$ref: "#/components/schemas/RemoveCanvasItemCommand"}
      discriminator:
        propertyName: type
        mapping:
          PLACE_ARTIFACT: "#/components/schemas/PlaceArtifactCommand"
          PLACE_AGENT: "#/components/schemas/PlaceAgentCommand"
          UPDATE_LAYOUT: "#/components/schemas/UpdateLayoutCommand"
          SET_LOCKED: "#/components/schemas/SetCanvasItemLockedCommand"
          REMOVE: "#/components/schemas/RemoveCanvasItemCommand"
    CanvasCommandBatchRequest:
      type: object
      additionalProperties: false
      required: [commands]
      properties:
        commands:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/CanvasCommand"}
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, traceId, retryable]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        traceId: {type: string}
        retryable: {type: boolean}
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
  responses:
    ValidationError:
      description: 请求参数无效
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unauthenticated:
      description: 未登录或凭据不正确
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: CSRF、初始化凭据或权限校验失败
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: 初始化或乐观版本冲突
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: 资源不存在或当前用户无权访问
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    RateLimited:
      description: 认证尝试次数过多
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    InternalError:
      description: 服务端错误
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ProviderFailure:
      description: 原 Provider 请求核对不可用或身份不匹配，任务仍为 UNKNOWN
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unavailable:
      description: 部署凭证加密主密钥尚未配置
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ServiceStopping:
      description: 实例正在关闭，拒绝创建新的 Agent Run；稍后以新的请求重试
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: {type: string, format: uuid}
