      type: object
      additionalProperties: false
      required: [alias, usage, required, purpose]
      properties:
        alias: {type: string, maxLength: 64}
        libraryEntryId: {type: [string, "null"], format: uuid}
        expectedLibraryVersion: {type: [integer, "null"], format: int64, minimum: 0}
        sourceVersionId: {type: [string, "null"], format: uuid}
        sourceAlias: {type: [string, "null"]}
        usage: {type: string, enum: [GUIDE, PROVIDER_REFERENCE]}
        required: {type: boolean}
        purpose: {type: string, maxLength: 1024}
        contentHash: {type: [string, "null"]}
    SkillDraft:
      type: object
      additionalProperties: false
      required: [skillId, version, skillMd, outputKinds, inputSlots, resources, assets]
      properties:
        skillId: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        skillMd: {type: string, maxLength: 8000}
        outputKinds: {type: array, maxItems: 4, items: {$ref: "#/components/schemas/ArtifactKind"}}
        inputSlots: {type: array, maxItems: 14, items: {$ref: "#/components/schemas/SkillInputSlot"}}
        resources: {type: array, maxItems: 8, items: {$ref: "#/components/schemas/SkillResource"}}
        assets: {type: array, maxItems: 14, items: {$ref: "#/components/schemas/SkillDraftAsset"}}
    SaveSkillDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, skillMd, outputKinds, inputSlots, resources, assets]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        skillMd: {type: string, maxLength: 8000}
        outputKinds: {type: array, maxItems: 4, items: {$ref: "#/components/schemas/ArtifactKind"}}
        inputSlots: {type: array, maxItems: 14, items: {$ref: "#/components/schemas/SkillInputSlot"}}
        resources: {type: array, maxItems: 8, items: {$ref: "#/components/schemas/SkillResource"}}
        assets: {type: array, maxItems: 14, items: {$ref: "#/components/schemas/SkillDraftAsset"}}
    SkillPublishedAsset:
      type: object
      additionalProperties: false
      required: [alias, kind, title, contentHash, usage, required, purpose]
      properties:
        alias: {type: string}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
        title: {type: string}
        contentHash: {type: string}
        usage: {type: string, enum: [GUIDE, PROVIDER_REFERENCE]}
        required: {type: boolean}
        purpose: {type: string}
        contentUrl: {type: string}
        thumbnailUrl: {type: string}
    SkillVersionSummary:
      type: object
      additionalProperties: false
      required: [id, skillId, versionNumber, name, description, bundleHash, createdAt]
      properties:
        id: {type: string, format: uuid}
        skillId: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        versionNumber: {type: integer, format: int64, minimum: 0}
        bundleHash: {type: string}
        createdAt: {type: string, format: date-time}
    SkillVersionList:
      type: array
      items: {$ref: "#/components/schemas/SkillVersionSummary"}
    SkillVersion:
      type: object
      additionalProperties: false
      required: [id, skillId, versionNumber, bundleHash, name, description, skillMd, outputKinds, inputSlots, resources, assets, createdAt]
      properties:
        id: {type: string, format: uuid}
        skillId: {type: string, format: uuid}
        versionNumber: {type: integer, format: int64, minimum: 0}
        bundleHash: {type: string}
        name: {type: string}
        description: {type: string}
        skillMd: {type: string, maxLength: 16000}
        outputKinds: {type: array, maxItems: 4, items: {$ref: "#/components/schemas/ArtifactKind"}}
        inputSlots: {type: array, maxItems: 14, items: {$ref: "#/components/schemas/SkillInputSlot"}}
        resources: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/SkillVersionResource"}}
        assets: {type: array, items: {$ref: "#/components/schemas/SkillPublishedAsset"}}
        createdAt: {type: string, format: date-time}
    PublishSkillRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftVersion, commandKey]
      properties:
        expectedDraftVersion: {type: integer, format: int64, minimum: 0}
        commandKey: {type: string, minLength: 1, maxLength: 200}
    CopySkillVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftVersion]
      properties:
        expectedDraftVersion: {type: integer, format: int64, minimum: 0}
    CopySkillRequest:
      type: object
      additionalProperties: false
      required: [title, skillVersionId]
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        skillVersionId: {type: string, format: uuid}
    SkillOperation:
      type: object
      additionalProperties: false
      required: [id, skillId, status, resultVersionId, errorCode, errorDetail]
      properties:
        id: {type: string, format: uuid}
        skillId: {type: string, format: uuid}
        status: {type: string, enum: [ACCEPTED, ARCHIVING, SUCCEEDED, FAILED]}
        resultVersionId: {type: [string, "null"], format: uuid}
        errorCode: {type: [string, "null"]}
        errorDetail: {type: [string, "null"]}
    SkillMediaBytes:
      type: string
      format: binary
    SkillVersionRef:
      type: object
      additionalProperties: false
      required: [skillId, skillVersionId]
      properties:
        skillId: {type: string, format: uuid}
        skillVersionId: {type: string, format: uuid}
    AgentSkillBinding:
      type: object
      additionalProperties: false
      required: [agentVersion, skills]
      properties:
        agentVersion: {type: integer, format: int64, minimum: 0}
        skills: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/SkillVersionRef"}}
    SaveAgentSkillBindingRequest:
      type: object
      additionalProperties: false
      required: [expectedAgentVersion, skills]
      properties:
        expectedAgentVersion: {type: integer, format: int64, minimum: 0}
        skills: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/SkillVersionRef"}}
    SkillRunInput:
      type: object
      additionalProperties: false
      required: [alias, artifactVersionId]
      properties:
        alias: {type: string, maxLength: 64}
        artifactVersionId: {type: string, format: uuid}
    SkillRunChoice:
      type: object
      additionalProperties: false
      required: [skillId, skillVersionId, inputs]
      properties:
        skillId: {type: string, format: uuid}
        skillVersionId: {type: string, format: uuid}
        inputs: {type: array, maxItems: 14, items: {$ref: "#/components/schemas/SkillRunInput"}}
    SkillSelection:
      type: object
      additionalProperties: false
      required: [mode, skills]
      description: Ordered available Skill catalogue. NONE and DEFAULT use an empty list; VERSIONS selects one to one hundred distinct Skills, each pinned to one version. Selection does not imply activation.
      properties:
        mode: {type: string, enum: [DEFAULT, NONE, VERSIONS]}
        skills: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/SkillRunChoice"}}
    RunPreflightRequest:
      type: object
      additionalProperties: false
      required: [agentId]
      properties:
        agentId: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        skillSelection: {$ref: "#/components/schemas/SkillSelection"}
    RunSkillSummary:
      type: object
      additionalProperties: false
      required: [skillId, skillVersionId, title, versionNumber, bundleHash, inputSlots, resources, assets]
      properties:
        skillId: {type: string, format: uuid}
        skillVersionId: {type: string, format: uuid}
        title: {type: string}
        versionNumber: {type: integer, format: int64, minimum: 0}
        bundleHash: {type: string}
        inputSlots: {type: array, items: {$ref: "#/components/schemas/SkillInputSlot"}}
        resources: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/SkillVersionResource"}}
        assets: {type: array, items: {$ref: "#/components/schemas/SkillPublishedAsset"}}
    ThirdPartyImagePrompt:
      type: object
      required:
      - id
      - sourceId
      - title
      - prompt
      - description
      - coverUrl
      - tags
      - author
      - sourceUrl
      - createdAt
      - referenceImageUrls
      - imageMode
      - imageModel
      properties:
        id: &id001
          type: string
        sourceId: &id002
          type: string
        title: &id003
          type: string
          maxLength: 500
        prompt: &id004
          type: string
          maxLength: 20000
        description: &id005
          type: string
        coverUrl: &id006
          type: string
        tags: &id007
          type: array
          items:
            type: string
        author: &id008
          type: string
        sourceUrl: &id009
          type: string
        createdAt: &id010
          type: string
        referenceImageUrls:
          type: array
          items:
            type: string
          maxItems: 8
        imageMode:
          type: string
          enum:
          - generate
          - edit
        imageModel:
          type: string
    ThirdPartyPromptReference:
      type: object
      required:
      - kind
      - role
      - url
      properties:
        kind: &id013
          type: string
          enum:
          - IMAGE
          - VIDEO
          - AUDIO
        role: &id014
          type: string
          enum:
          - REFERENCE
          - START_FRAME
          - END_FRAME
          - VIDEO_REFERENCE
          - AUDIO_REFERENCE
        url:
          type: string
          format: uri
    ThirdPartyImageGeneration:
      type: object
      required:
      - prompt
      - imageModel
      - referenceImageUrls
      properties:
        prompt:
          type: string
        imageModel:
          type: string
        referenceImageUrls:
          type: array
          items:
            type: string
    ThirdPartyVideoPrompt:
      type: object
      required:
      - id
      - sourceId
      - title
      - prompt
      - description
      - coverUrl
      - tags
      - author
      - sourceUrl
      - createdAt
      - videoMode
      - videoModel
      - references
      - imageGeneration
      properties:
        id: *id001
        sourceId: *id002
        title: *id003
        prompt: {type: string, maxLength: 64000}
        description: *id005
        coverUrl: *id006
        tags: *id007
        author: *id008
        sourceUrl: *id009
        createdAt: *id010
        videoMode:
          type: string
          enum:
          - text_to_video
          - image_to_video
          - video_reference
          - omni_reference
          - text_to_image_to_video
        videoModel:
          type: string
        references:
          type: array
          items:
            $ref: '#/components/schemas/ThirdPartyPromptReference'
          maxItems: 16
        imageGeneration:
          oneOf:
          - $ref: '#/components/schemas/ThirdPartyImageGeneration'
          - type: 'null'
        previewVideoUrl:
          type: string
          description: Generated example video for preview only; never a generation input.
        missingReferences:
          type: array
          maxItems: 16
          description: Required upstream inputs whose files were not published. Such entries can be browsed but cannot be imported.
          items:
            type: object
            required: [kind, label]
            properties:
              kind: *id013
              label: {type: string, maxLength: 160}
    ThirdPartyPromptEntry:
      type: object
      required:
      - id
      - sourceId
      - targetKind
      - image
      - video
      - version
      - cachedAt
      - updatedAt
      properties:
        id:
          type: string
        sourceId:
          type: string
        targetKind: &id011
          type: string
          enum:
          - IMAGE
          - VIDEO
        image:
          oneOf:
          - $ref: '#/components/schemas/ThirdPartyImagePrompt'
          - type: 'null'
        video:
          oneOf:
          - $ref: '#/components/schemas/ThirdPartyVideoPrompt'
          - type: 'null'
        version:
          type: integer
          minimum: 0
        cachedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ThirdPartyPromptPage:
      type: object
      required:
      - items
      - total
      - offset
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThirdPartyPromptEntry'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
    ThirdPartyPromptSource:
      type: object
      required:
      - id
      - name
      - targetKind
      - format
      - url
      - model
      - enabled
      - version
      - nextSyncAt
      - lastSyncedAt
      - lastError
      - promptCount
      - syncing
      properties:
        id:
          type: string
        name:
          type: string
        targetKind: *id011
        format:
          type: string
          enum:
          - NATIVE_JSON
          - GITHUB_MARKDOWN
          - DAVID_JSON
          - BEATAPI_JSON
          - IMAGE_PROMPT_GALLERY_JSON
        url:
          type: string
        model:
          type: string
        enabled: &id012
          type: boolean
        version:
          type: integer
        nextSyncAt:
          type: string
          format: date-time
        lastSyncedAt:
          type:
          - string
          - 'null'
          format: date-time
        lastError:
          type:
          - string
          - 'null'
        promptCount:
          type: integer
        syncing: *id012
    ThirdPartyPromptSyncSettings:
      type: object
      required: [enabled, deploymentEnabled, version]
      properties:
        enabled:
          type: boolean
          description: Persistent administrator opt-in; false on first adoption, including upgrades
        deploymentEnabled:
          type: boolean
          description: False when the operator disabled scheduling independently of administrator consent
        version:
          type: integer
          format: int64
          minimum: 0
    UpdateThirdPartyPromptSyncSettings:
      type: object
      required: [enabled, expectedVersion]
      properties:
        enabled:
          type: boolean
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    ThirdPartyPromptSources:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThirdPartyPromptSource'
    CreateThirdPartyPromptSource:
      type: object
      required:
      - id
      - name
      - targetKind
      - url
      properties:
        id:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,79}$
        name:
          type: string
          maxLength: 160
        targetKind: *id011
        url:
          type: string
          format: uri
          maxLength: 4096
    UpdateThirdPartyPromptSource:
      type: object
      required:
      - enabled
      - expectedVersion
      properties:
        enabled: *id012
        expectedVersion:
          type: integer
          minimum: 0
    ThirdPartyPromptSync:
      type: object
      required:
      - sourceId
      - state
      - inserted
      - updated
      - received
      properties:
        sourceId:
          type: string
        state:
          type: string
          enum:
          - SUCCESS
          - FAILED
          - RUNNING
          - DISABLED
          - SUPERSEDED
        inserted:
          type: integer
        updated:
          type: integer
        received:
          type: integer
    ImportThirdPartyPrompt:
      type: object
      required:
      - promptId
      - expectedVersion
      - commandKey
      properties:
        promptId:
          type: string
          maxLength: 512
        expectedVersion:
          type: integer
          minimum: 0
        commandKey:
          type: string
          maxLength: 200
    ImportedThirdPartyReference:
      type: object
      required:
      - versionId
      - assetId
      - title
      - kind
      - role
      - thumbnailUrl
      properties:
        versionId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        title:
          type: string
        kind: *id013
        role: *id014
        thumbnailUrl:
          type: string
  responses:
    ValidationError:
      description: 请求参数无效
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unauthenticated:
      description: 未登录或凭据不正确
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: CSRF、初始化凭据或权限校验失败
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: 初始化或乐观版本冲突
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: 资源不存在或当前用户无权访问
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    RateLimited:
      description: 认证尝试次数过多
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    InternalError:
      description: 服务端错误
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ProviderFailure:
      description: 原 Provider 请求核对不可用或身份不匹配，任务仍为 UNKNOWN
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ObjectStorageFailure:
      description: 对象存储连接、权限或网络不可用；生成结果只重试归档，不重新生成
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unavailable:
      description: 部署凭证加密主密钥尚未配置
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ServiceStopping:
      description: 实例正在关闭，拒绝创建新的 Agent Run；稍后以新的请求重试
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  headers:
    ContentLanguage:
      description: 协商后的界面语言；不改变用户内容、枚举或错误码。
      schema: {type: string, enum: [en, zh, ru, ja]}
    VaryLanguage:
      description: 包含 Accept-Language，避免不同语言的响应共用缓存。
      schema: {type: string}
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 支持 en、zh、ru、ja 及其地区变体，按质量权重选择；缺失、不支持或无效时回退 zh。
      schema: {type: string}
      example: ru-RU, en;q=0.8
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CanvasItemId:
      name: canvasItemId
      in: path
      required: true
      schema: {type: string, format: uuid}
