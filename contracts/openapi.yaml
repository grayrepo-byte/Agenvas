        "400":
          description: "Invalid input"
        "401":
          description: "Authentication required"
        "404":
          description: "Resource unavailable"
        "409":
          description: "Version or command conflict"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CharacterLibrarySave"
