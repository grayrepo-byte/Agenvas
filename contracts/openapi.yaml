openapi: 3.1.0
info:
  title: Agenvas API
  version: 0.1.0
  description: |
    Agenvas 的权威 HTTP 合约。覆盖当前已实现的身份、项目、画布、Agent、Task 与私有素材切片；未实现的 MVP 能力继续按开发清单加入。
    部署者设置 AGENVAS_RECOVERY_MODE=true 后，/api/v1/projects 与 /api/v1/settings 下的非 GET/HEAD/OPTIONS 请求统一返回 HTTP 503 ProblemDetail，code=RECOVERY_MODE_READ_ONLY；身份登录与只读核对仍可用。恢复模式同时关闭后台调度，不能把 503 当作业务版本冲突重试。
    服务端为每次 HTTP 请求生成 X-Request-Id 响应头；ProblemDetail.traceId 与它相同。客户端同名请求头不会被信任或回显。
    所有 API 接受 Accept-Language 语言协商（en、zh、ru、ja，地区变体按基础语言匹配；不支持、缺失或无效时回退 zh，q=0 不选用）。响应携带 Content-Language 与 Vary: Accept-Language，包括认证和 CSRF 错误。Problem 的 title、detail、fieldErrors.message 使用协商语言；code、状态、字段路径、ID 和用户内容不随语言变化。语言偏好仅由浏览器保存，无账号配置 API 或数据库迁移。
servers:
  - url: /
paths:
  /api/v1/settings/system-logs:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: listSystemLogs
      summary: 读取当前后端进程的 stdout / stderr
      description: |
        仅管理员可读，Cache-Control 为 no-store。最多保留最近 2000 行，单行最多 8192 字节；
        在换行后采集，超长行尾部丢弃并标记 truncated。按 sequence 正序返回最新的匹配行。
        search 在脱敏后的内容上进行不区分大小写的字面匹配。重启后 processId 改变且日志重新开始。
        droppedCount 是本次进程因容量淘汰的总行数，matchedCount 是保留范围内的匹配总数。
        日志不持久化，不包含 stdin、原生文件描述符写入、子进程或其他容器输出。
      tags: [Settings]
      parameters:
        - name: stream
          in: query
          schema: {type: string, enum: [STDOUT, STDERR]}
        - name: search
          in: query
          schema: {type: string, maxLength: 200}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
      responses:
        "200":
          description: 当前进程的脱敏输出快照
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemLogSnapshot"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/call-logs:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: listCallLogs
      summary: 分页读取管理员本人项目的调用审计元数据
      description: |
        按 startedAt、id 倒序稳定排序。仅返回当前管理员自己的项目，不包含请求或响应正文、密钥和 endpoint。
        UNKNOWN 筛选同时匹配调用结果未知及当前 Task 状态 UNKNOWN，便于核对历史请求。
        historical=true 是旧检查点投影，startedAt 为原检查点时间；traceId、respondedAt、durationMs 不可追溯时为 null，不据此推算响应时间。
      tags: [Audit]
      parameters:
        - name: projectId
          in: query
          schema: {type: string, format: uuid}
        - name: kind
          in: query
          schema: {type: string, enum: [LLM, IMAGE, VIDEO, AUDIO]}
        - name: status
          in: query
          schema: {type: string, enum: [RUNNING, SUCCEEDED, FAILED, UNKNOWN]}
        - name: traceId
          in: query
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
        - name: from
          in: query
          description: 调用开始时间下界（包含）
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: 调用开始时间上界（包含），不得早于 from
          schema: {type: string, format: date-time}
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: 调用日志页，越权或不存在的 projectId 返回空页
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallLogPage"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/settings/call-log-retention:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getCallLogRetentionSettings
      summary: 读取调用日志保留策略（默认永久，仅管理员）
      tags: [Audit]
      responses:
        "200":
          description: 持久化设置；Cache-Control 为 no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallLogRetentionSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updateCallLogRetentionSettings
      summary: 设置调用日志保留天数
      description: null 表示永久保留，天数范围 1–3650。仅更新策略，不自动清理；管理员手动清理所有状态的过期完整执行，包括未结束及 UNKNOWN。以完成时间（未结束使用创建时间）、最近任务活动及检查点时间判断过期。调用日志、debug 正文、模型回合、工具执行及 Provider 提交账本在同一事务删除，未结束执行先停止本地编排并递增任务租约 epoch，再清理；不承诺外部请求停止或退款，不再恢复或核对已清理请求。保留业务任务、Run 身份、产物和素材；旧对话的执行明细会消失。缩短策略也影响历史记录，删除不可恢复，改回永久不能恢复已清理日志。默认永久保证升级不主动删除数据。不会触发 Provider 请求。
      tags: [Audit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [retentionDays, expectedVersion]
              properties:
                retentionDays: {type: [integer, "null"], minimum: 1, maximum: 3650}
                expectedVersion: {type: integer, minimum: 1}
      responses:
        "200":
          description: 保存后的策略和版本
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallLogRetentionSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/settings/call-log-retention/cleanup:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: cleanupCallLogs
      summary: 手动清理到期调用日志与执行账本
      description: 仅管理员显式请求执行，无定时任务；使用已保存且版本匹配的保留策略，null 永久保留时返回零。每批策略行加锁并检查 expectedVersion，所有状态的过期执行均可清理，未结束与 UNKNOWN 先停止本地执行、递增任务租约 epoch、释放该 Run 活动槽，再同事务删除日志与账本并保存状态事件；近期有活动、边界时刻或被并发事务锁定的整个执行暂缓。不承诺外部请求停止或退款，清理后不再恢复或核对原请求；每次至多十批，每批至多 1000 个执行单位。batchLimitReached=true 表示可能还有待清理记录，须再次手动执行。多个批次分别提交，后续失败或设置冲突不能恢复前面已提交的批次；不得自动重试。保留业务身份和结果，不触发 Provider 请求。
      tags: [Audit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: {type: integer, minimum: 1}
      responses:
        "200":
          description: 本次实际清理的执行单位数量；Cache-Control 为 no-store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallLogCleanupResult"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/settings/debug:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getDebugSettings
      summary: 读取系统 debug 模式（默认关闭，仅管理员）
      tags: [Audit]
      responses:
        "200":
          description: 持久化设置
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DebugSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updateDebugSettings
      summary: 修改系统 debug 模式
      description: 调用开始时固定开关。启用后保存脱敏原始 HTTP 地址及正文（每个正文最多 64 MiB，超限或未读完明确标注）；可能包含提示词、个人信息和素材，并显著增加数据库及备份体积。所有 header 均不保存，正文中的鉴权字段、已知请求凭证和模型私有推理始终移除。关闭停止新增正文，历史记录按日志保留设置清理，旧调用不会补录。不会触发 Provider 请求。
      tags: [Audit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [debugMode, expectedVersion]
              properties:
                debugMode: {type: boolean}
                expectedVersion: {type: integer, minimum: 1}
      responses:
        "200":
          description: 更新后的设置与版本
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DebugSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/call-logs/{id}/debug:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getCallDebug
      summary: 查看本人项目的脱敏原始调用详情
      description: 单独按需读取正文；Cache-Control 为 no-store。captured=false 表示调用开始时 debug 未启用。captured=true 且 exchanges 为空表示没有已采集的 HTTP 交换（例如 Mock、尚未开始网络调用或采集写入失败）。不伪造 Mock 的 HTTP 请求。所有 header 均省略；正文移除凭证与私有推理。UTF8 为正文文本（JSON 脱敏后序列化），BASE64 为二进制正文，MULTIPART_JSON 为字段与文件内容，OMITTED 表示无法安全采集。请求已发送但无响应时响应字段为 null。旧历史投影无此详情，不补录。
      tags: [Audit]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Debug 详情
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallDebug"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v1/auth/setup-status:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getSetupStatus
      summary: 查询是否需要初始化管理员
      tags: [Identity]
      security: []
      responses:
        "200":
          description: 初始化状态
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupStatus"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/auth/csrf:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getCsrfToken
      summary: 获取浏览器写请求所需的 CSRF token
      tags: [Identity]
      security: []
      responses:
        "200":
          description: CSRF token
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CsrfToken"}
  /api/v1/auth/setup:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: setupAdministrator
      summary: 一次性创建管理员
      tags: [Identity]
      security: []
      parameters:
        - name: X-Agenvas-Bootstrap-Secret
          in: header
          required: true
          schema: {type: string, minLength: 24, maxLength: 512}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetupRequest"}
      responses:
        "201":
          description: 管理员已创建
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v1/auth/login:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: login
      summary: 创建数据库持久化会话
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: 已登录管理员
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/auth/logout:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: logout
      summary: 退出并失效当前会话
      tags: [Identity]
      responses:
        "204": {description: 会话已失效}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v1/auth/me:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getCurrentUser
      summary: 获取当前管理员
      tags: [Identity]
      responses:
        "200":
          description: 当前管理员
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CurrentUser"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/auth/change-password:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: changePassword
      summary: 修改密码并失效其他会话
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangePasswordRequest"}
      responses:
        "204": {description: 密码已修改}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/RateLimited"}
  /api/v1/settings/storage:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getStorageSettings
      summary: Read administrator storage destinations without credentials
      responses:
        '200':
          description: Storage configuration; null activeProfileId means local storage
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/settings/storage/profiles:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: createStorageProfile
      summary: Save an encrypted immutable destination without activating it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStorageProfileRequest' }
      responses:
        '200':
          description: Saved destinations; creating a profile does not switch the default
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageSettings' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/settings/storage/active:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    put:
      operationId: activateStorageProfile
      summary: Switch future archives only; existing assets retain their location
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateStorageProfileRequest' }
      responses:
        '200':
          description: New default destination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageSettings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/settings/storage/profiles/{profileId}/credentials:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - in: path
        name: profileId
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: rotateStorageCredentials
      summary: Rotate credentials for the same immutable location, including historical assets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotateStorageCredentialsRequest' }
      responses:
        '200':
          description: Updated credential mask; no secrets are returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageSettings' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/settings/llm:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getLlmSettings
      summary: 读取管理员模型配置的脱敏状态
      tags: [Settings]
      responses:
        "200":
          description: 配置状态，不包含凭证明文或密文
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LlmSettings"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
    put:
      operationId: replaceLlmSettings
      summary: 用完整新凭证替换活动模型配置版本
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReplaceLlmSettingsRequest"}
      responses:
        "200":
          description: 新版本的脱敏状态
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LlmSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/settings/diagnostics:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: getSystemDiagnostics
      summary: 读取管理员本地系统诊断，不连接或生成付费 Provider 请求
      tags: [Settings]
      responses:
        "200":
          description: 数据库、存储和 Provider 配置状态及七天内任务错误摘要
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemDiagnostics"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /api/v1/settings/llm/diagnose:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    post:
      operationId: diagnoseLlmSettings
      summary: 管理员显式发起最多两次可能计费的工具协议诊断
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DiagnoseLlmRequest"}
      responses:
        "200":
          description: 完成诊断后的脱敏配置状态
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LlmSettings"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422":
          description: 模型未完成完整工具协议
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "502":
          description: 模型连接或调用失败
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /api/v1/settings/autodl-workflows:
    get:
      operationId: listAutoDlWorkflows
      tags: [Settings]
      summary: Read the public official AutoDL catalog without submitting generation
      responses:
        '200':
          description: Administrator-only catalog candidates; publication is explicit
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
