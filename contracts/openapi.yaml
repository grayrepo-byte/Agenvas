  "/api/v1/projects/{projectId}/canvas/character-nodes/{itemId}/selection": {"put": {"operationId": "saveCharacterNodeSelection", "tags": ["Canvas"], "parameters": [{"in": "path", "name": "projectId", "required": true, "schema": {"type": "string", "format": "uuid"}}, {"in": "path", "name": "itemId", "required": true, "schema": {"type": "string", "format": "uuid"}}], "responses": {"200": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CharacterNode"}}}}, "400": {"$ref": "#/components/responses/ValidationError"}, "401": {"$ref": "#/components/responses/Unauthenticated"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}, "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SaveCharacterNodeSelection"}}}}}}
