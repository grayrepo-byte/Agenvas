          type: string
          format: uuid
          description: 必须属于此项目与 Agent；缺省使用当前会话，没有则同事务创建。
        expectedConversationVersion:
          type: integer
          format: int64
          minimum: 0
          description: 运行前预览的会话历史版本；已有新消息时返回 CONVERSATION_VERSION_CONFLICT。
        instruction: {type: string, minLength: 1, maxLength: 20000}
        expectedAgentVersion: {type: integer, format: int64, minimum: 0}
        expectedModelConfigSource:
          type: string
          maxLength: 80
          description: 运行前预览中的模型配置来源；须与 expectedModelConfigVersion 同时提交
        expectedModelConfigVersion:
          type: integer
          minimum: 1
          description: 运行前预览中的模型配置版本；配置变化时创建返回 409
        expectedSystemPromptVersion:
          type: integer
          minimum: 1
          description: 运行前预览中的系统提示词版本；规则变化时创建返回 409
        skillSelection: {$ref: "#/components/schemas/SkillSelection"}
        selectedItemIds:
          type: array
          maxItems: 20
          uniqueItems: true
          description: 启动 Run 时选中的同项目画布卡片；仅供上下文指向，不授予工具修改权限
          items: {type: string, format: uuid}
    RunContextSnapshot:
      type: object
      additionalProperties: true
      required: [agentId, agentVersion, profileKey, profileVersion, outputGroupId, bindings]
      properties:
        agentId: {type: string, format: uuid}
        agentVersion: {type: integer, format: int64, minimum: 0}
        profileKey: {type: string}
        profileVersion: {type: integer, minimum: 1}
        outputGroupId: {type: string, format: uuid}
        conversationId:
          type: string
          format: uuid
          description: 新 Run 冻结的会话作用域；升级前旧快照保持原值，可能没有此字段
        conversationHistoryThroughTurn:
          type: integer
          format: int64
          minimum: 0
          description: 创建 Run 前已受理的会话消息水位；仅终态历史可进入记忆
        conversationMemory: {$ref: "#/components/schemas/ConversationMemory"}
        bindings:
          type: array
          items: {$ref: "#/components/schemas/RunInputSnapshot"}
        selection:
          type: array
          maxItems: 20
          description: 创建 Run 时由服务端核对并固定的画布选择；不扩大工具权限
          items:
            type: object
            additionalProperties: false
            required: [itemId, subjectType, subjectId]
            properties:
              itemId: {type: string, format: uuid}
              subjectType: {type: string, enum: [ARTIFACT, AGENT]}
              subjectId: {type: string, format: uuid}
              versionId: {type: string, format: uuid}
              kind: {$ref: "#/components/schemas/ArtifactKind"}
    ConversationMemory:
      type: object
      additionalProperties: false
      description: 创建 Run 时冻结的公开用户指令、assistant 回复与已提交业务动作摘要；不包含私有推理、原始协议、工具参数或凭证，也不授予额外权限
      required: [entries, truncated, priorRunCount]
      properties:
        entries:
          type: array
          maxItems: 20
          description: 按时间正序保留首轮及最近轮次；所有 content 合计最多 32000 个 Unicode 码点
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: {type: string, enum: [USER, ASSISTANT]}
              content: {type: string, maxLength: 32000}
        truncated: {type: boolean}
        priorRunCount: {type: integer, minimum: 0}
    RunInputSnapshot:
      type: object
      additionalProperties: false
      required: [artifactId, selectedVersionId]
      properties:
        artifactId: {type: string, format: uuid}
        selectedVersionId: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
        title: {type: string}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        source: {type: string, const: CONVERSATION_OUTPUT}
    RunPreflightBinding:
      type: object
      additionalProperties: false
      required: [artifactId, selectedVersionId, artifactTitle, artifactKind]
      properties:
        artifactId: {type: string, format: uuid}
        selectedVersionId: {type: string, format: uuid}
        artifactTitle: {type: string}
        artifactKind: {$ref: "#/components/schemas/ArtifactKind"}
    RunPreflight:
      type: object
      additionalProperties: false
      required: [agentId, agentVersion, agentName, agentInstruction, bindings, modelAvailable, providerAdapter, modelId, toolCalling, policySnapshot, conversationId, conversationVersion, conversationTurnCount, inheritedBindingCount, memoryTruncated]
      properties:
        agentId: {type: string, format: uuid}
        agentVersion: {type: integer, format: int64, minimum: 0}
        agentName: {type: string}
        agentInstruction: {type: string}
        conversationId: {type: [string, "null"], format: uuid}
        conversationVersion: {type: [integer, "null"], format: int64, minimum: 0}
        conversationTurnCount: {type: integer, format: int64, minimum: 0}
        inheritedBindingCount: {type: integer, minimum: 0, maximum: 40}
        creativeSkill:
          oneOf:
            - {$ref: "#/components/schemas/RunSkillSummary"}
            - {type: "null"}
        memoryTruncated: {type: boolean, description: 历史消息或继承产物超过本轮上下文预算，完整记录仍保留。}
        bindings:
          type: array
          items: {$ref: "#/components/schemas/RunPreflightBinding"}
        modelAvailable: {type: boolean}
        providerAdapter: {type: [string, "null"]}
        modelId: {type: [string, "null"]}
        toolCalling: {type: boolean}
        policySnapshot: {$ref: "#/components/schemas/RunPolicySnapshot"}
    RunPolicySnapshot:
      type: object
      additionalProperties: false
      description: >-
        New Run policies are schema v3 and pin systemPromptVersion=7 plus their context-appropriate tool allowlist. Version 7 separates program-owned tool/approval protocol from the unmodified frozen card creative system prompt; managed prompts cannot change server authorization. IMAGE previews are sent only after committed read_artifacts requests, never automatically at Run start; Skill resource reading is exposed only when frozen resources exist. Historical v1
        snapshots lack this field and cannot safely start an uncheckpointed model turn.
      required: [schemaVersion, modelConfigSource, modelConfigVersion, maxModelTurns, maxToolExecutions]
      properties:
        schemaVersion: {type: integer, enum: [1, 2, 3]}
        toolPolicyVersion: {type: integer, enum: [1]}
        allowedTools: {type: array, uniqueItems: true, items: {type: string}}
        systemPromptVersion: {type: integer, enum: [1, 2, 3, 4, 5, 6, 7], description: New v3 snapshots pin version 7; historical versions 1/2/3/4/5/6 retain their original rules and creative message roles; absent on historical v1 snapshots.}
        modelConfigSource: {type: string}
        modelConfigVersion: {type: integer, minimum: 1}
        maxModelTurns: {type: integer, minimum: 1}
        maxToolExecutions: {type: integer, minimum: 1}
    AgentRun:
      type: object
      additionalProperties: false
      required: [id, projectId, agentInstanceId, conversationId, conversationTurn, status, instruction, contextSnapshot, policySnapshot, profileVersion, nextStepIndex, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        agentInstanceId: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        conversationTurn: {type: integer, format: int64, minimum: 1}
        status: {$ref: "#/components/schemas/AgentRunStatus"}
        instruction: {type: string}
        contextSnapshot: {$ref: "#/components/schemas/RunContextSnapshot"}
        policySnapshot: {$ref: "#/components/schemas/RunPolicySnapshot"}
        profileVersion: {type: integer, minimum: 1}
        nextStepIndex: {type: integer, minimum: 0}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    AgentRunSummary:
      type: object
      additionalProperties: false
      required: [id, agentInstanceId, conversationId, conversationTurn, status, instruction, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        agentInstanceId: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        conversationTurn: {type: integer, format: int64, minimum: 1}
        status: {$ref: "#/components/schemas/AgentRunStatus"}
        instruction: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    AgentRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AgentRunSummary"}
        nextCursor: {type: [string, "null"]}
    RunAction:
      type: object
      additionalProperties: false
      required: [id, stepIndex, toolName, status, summary, completedAt]
      properties:
        id: {type: string, format: uuid}
        stepIndex: {type: integer, minimum: 0}
        toolName: {type: string}
        status:
          type: string
          enum: [SUCCEEDED]
          description: 动作提交时的业务结果状态；不是当前计划、媒体任务或工具账本状态。
        summary: {type: string, description: 服务端生成的可公开动作摘要。}
        completedAt: {type: string, format: date-time}
    MediaCapabilityBinding:
      type: object
      additionalProperties: false
      required: [connectionId, connectionVersion, capabilityId, capabilityVersion, adapterId, mappingSha256]
      properties:
        connectionId: {type: string, format: uuid}
        connectionVersion: {type: integer, minimum: 1}
        capabilityId: {type: string, format: uuid}
        capabilityVersion: {type: integer, minimum: 1}
        adapterId: {type: string}
        mappingSha256: {type: string, pattern: "^[0-9a-f]{64}$"}
    MediaCapabilityCandidate:
      type: object
      additionalProperties: false
      required: [binding, connectionName, capabilityName, kind, minimumSeconds,
        maximumSeconds, realGenerationTested, settings]
      properties:
        binding: {$ref: "#/components/schemas/MediaCapabilityBinding"}
        connectionName: {type: string}
        capabilityName: {type: string}
        kind: {type: string, enum: [IMAGE_GENERATION, VIDEO_GENERATION, AUDIO_GENERATION]}
        minimumSeconds: {type: integer, minimum: 0}
        maximumSeconds: {type: integer, minimum: 0}
        realGenerationTested: {type: boolean}
        settings: {$ref: "#/components/schemas/FixedMediaAdapterSettings"}
    TaskKind:
      type: string
      enum: [AGENT_TURN, TEXT_GENERATION, IMAGE_GENERATION, VIDEO_GENERATION, AUDIO_GENERATION]
    TaskStatus:
      type: string
      enum: [READY, RUNNING, SUBMITTING, WAITING_PROVIDER, UNKNOWN, BLOCKED, SUCCEEDED, FAILED, CANCELED]
    ManualUnknownAttemptRequest:
      type: object
      additionalProperties: false
      required: [expectedTaskVersion]
      properties:
        expectedTaskVersion: {type: integer, format: int64, minimum: 0}
    Task:
      type: object
      additionalProperties: false
      required: [id, projectId, runId, stepKey, kind, status, cancelRequested, input, attemptNo, nextActionAt, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        runId: {type: [string, "null"], format: uuid}
        stepKey: {type: string}
        kind: {$ref: "#/components/schemas/TaskKind"}
        status: {$ref: "#/components/schemas/TaskStatus"}
        cancelRequested: {type: boolean, description: "已要求停止本系统后续编排，不表示外部任务已停止或退款"}
        input: {type: object, additionalProperties: true}
        output:
          description: |
            AGENT_TURN 执行中的 assistantStream 为持久公开回答进度，结构为
            AssistantTurnStream；这不是已提交的工具响应。完整回合提交后
            assistantText 为最终公开文本。失败或取消保留 INTERRUPTED 文本。
            modelRetry 是 AgentModelRetry 投影；READY 使用 nextActionAt 显示下次重试时间。
          oneOf:
            - type: object
              additionalProperties: true
              properties:
                modelRetry: {$ref: "#/components/schemas/AgentModelRetry"}
            - {type: "null"}
        providerRequestId: {type: [string, "null"]}
        attemptNo: {type: integer, minimum: 1}
        nextActionAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
        errorCode: {type: [string, "null"], description: "稳定安全原因码；Agent 模型临时故障按 modelRetry 有界重试，达到次数/期限为 LLM_RETRY_EXHAUSTED；媒体提交不自动重试。"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    AgentModelRetry:
      type: object
      additionalProperties: false
      description: "同一固定模型请求的持久退避信息；首次调用外最多重试 10 次，首次失败起 5 分钟内。成功保留历史投影，终态不会继续重试。"
      required: [schemaVersion, retryCount, maxRetries, firstFailureAt, deadlineAt, lastErrorCode]
      properties:
        schemaVersion: {type: integer, const: 1}
        retryCount: {type: integer, minimum: 1, maximum: 10}
        maxRetries: {type: integer, const: 10}
        firstFailureAt: {type: string, format: date-time}
        deadlineAt: {type: string, format: date-time}
        lastErrorCode: {type: string, enum: [LLM_CALL_TIMEOUT, LLM_CONNECTION_FAILED, LLM_RATE_LIMITED, LLM_SERVICE_UNAVAILABLE]}
    AssistantTurnStream:
      type: object
      additionalProperties: false
      required: [streamEpoch, chunkIndex, text, status]
      properties:
        streamEpoch: {type: integer, format: int64, minimum: 0, description: 任务本次租约身份；更高 epoch 重置旧文本。}
        chunkIndex: {type: integer, format: int64, minimum: 0, description: 本次流的已持久增量序号。}
        text: {type: string, description: 累计公开回答；不含私有推理或工具参数。}
        status: {type: string, enum: [STREAMING, COMPLETED, INTERRUPTED]}
    AgentTurnStreamEventPayload:
      type: object
      additionalProperties: false
      required: [runId, taskId, stepIndex, streamEpoch, chunkIndex]
      properties:
        runId: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        stepIndex: {type: integer, minimum: 0}
        streamEpoch: {type: integer, format: int64, minimum: 0}
        chunkIndex: {type: integer, format: int64, minimum: 0}
        textDelta: {type: string, description: 仅 delta 事件提供公开文本增量；completed 后重读已提交终稿。}
    CanvasSubjectType:
      type: string
      enum: [ARTIFACT, AGENT]
    CanvasItem:
      type: object
      additionalProperties: false
      required: [id, subjectType, subjectId, title, x, y, width, height, zIndex, locked, selectedVersionId, version, selectedVersion, artifact, agent]
      properties:
        id: {type: string, format: uuid}
        subjectType: {$ref: "#/components/schemas/CanvasSubjectType"}
        subjectId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
        locked: {type: boolean}
        selectedVersionId: {type: [string, "null"], format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        selectedVersion:
          oneOf:
            - {$ref: "#/components/schemas/ArtifactVersion"}
            - {type: "null"}
        artifact:
          oneOf:
            - {$ref: "#/components/schemas/Artifact"}
            - {type: "null"}
        agent:
          oneOf:
            - {$ref: "#/components/schemas/Agent"}
            - {type: "null"}
    Canvas:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CanvasItem"}
    ProjectSnapshot:
      type: object
      additionalProperties: false
      required: [project, canvas, connections, agents, activeRun, activeTasks, unknownTasks, snapshotSeq]
      properties:
        project: {$ref: "#/components/schemas/Project"}
        canvas: {$ref: "#/components/schemas/Canvas"}
        connections:
          type: array
          items: {$ref: "#/components/schemas/CanvasConnection"}
        agents:
          type: array
          items: {$ref: "#/components/schemas/Agent"}
        activeRun:
          oneOf:
            - {$ref: "#/components/schemas/AgentRun"}
            - {type: "null"}
        activeTasks:
          type: array
          items: {$ref: "#/components/schemas/Task"}
        unknownTasks:
          type: array
          description: 最近 100 个未核对的外部提交，取消 Run 后仍可见
          items: {$ref: "#/components/schemas/Task"}
        snapshotSeq: {type: integer, format: int64, minimum: 0}
    ProjectEvent:
      type: object
      additionalProperties: false
      required: [projectId, seq, eventId, type, schemaVersion, aggregateId, aggregateVersion, payload, occurredAt]
      properties:
        projectId: {type: string, format: uuid}
        seq: {type: integer, format: int64, minimum: 1}
        eventId: {type: string, format: uuid}
        type: {type: string, minLength: 3, maxLength: 120}
        schemaVersion: {type: integer, minimum: 1}
        aggregateId: {type: string, format: uuid}
        aggregateVersion: {type: integer, format: int64, minimum: 0}
        payload: {type: object, additionalProperties: true}
        occurredAt: {type: string, format: date-time}
    PlaceArtifactCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, artifactId, x, y, width, height, zIndex]
      properties:
        type: {type: string, const: PLACE_ARTIFACT}
        itemId: {type: string, format: uuid}
        artifactId: {type: string, format: uuid}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
        locked: {type: boolean, default: false}
    PlaceAgentCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, agentId, x, y, width, height, zIndex]
      properties:
        type: {type: string, const: PLACE_AGENT}
        itemId: {type: string, format: uuid}
        agentId: {type: string, format: uuid}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
        locked: {type: boolean, default: false}
    UpdateCanvasItemTitleCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, expectedVersion, title]
      properties:
        type: {type: string, const: UPDATE_TITLE}
        itemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        title: {type: string, minLength: 1, maxLength: 160}
    UpdateLayoutCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, expectedVersion, x, y, width, height, zIndex]
      properties:
        type: {type: string, const: UPDATE_LAYOUT}
        itemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
    SetCanvasItemLockedCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, expectedVersion, locked]
      properties:
        type: {type: string, const: SET_LOCKED}
        itemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        locked: {type: boolean}
    RemoveCanvasItemCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, expectedVersion]
      properties:
        type: {type: string, const: REMOVE}
        itemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    CanvasCommand:
      oneOf:
        - {$ref: "#/components/schemas/PlaceArtifactCommand"}
        - {$ref: "#/components/schemas/PlaceAgentCommand"}
        - {$ref: "#/components/schemas/UpdateCanvasItemTitleCommand"}
        - {$ref: "#/components/schemas/UpdateLayoutCommand"}
        - {$ref: "#/components/schemas/SetCanvasItemLockedCommand"}
        - {$ref: "#/components/schemas/RemoveCanvasItemCommand"}
      discriminator:
        propertyName: type
        mapping:
          PLACE_ARTIFACT: "#/components/schemas/PlaceArtifactCommand"
          PLACE_AGENT: "#/components/schemas/PlaceAgentCommand"
          UPDATE_TITLE: "#/components/schemas/UpdateCanvasItemTitleCommand"
          UPDATE_LAYOUT: "#/components/schemas/UpdateLayoutCommand"
          SET_LOCKED: "#/components/schemas/SetCanvasItemLockedCommand"
          REMOVE: "#/components/schemas/RemoveCanvasItemCommand"
    CanvasCommandBatchRequest:
      type: object
      additionalProperties: false
      required: [commands]
      properties:
        commands:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/CanvasCommand"}
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, traceId, retryable]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        traceId: {type: string}
        retryable: {type: boolean}
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
    CreativeSkill:
      type: object
      additionalProperties: false
      required: [id, title, description, trashed, currentVersionId, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        trashed: {type: boolean}
        currentVersionId: {type: [string, "null"], format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SkillPage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CreativeSkill"}}
        nextCursor: {type: [string, "null"]}
        total: {type: integer, minimum: 0}
    CreateSkillRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 1024}
    UpdateSkillRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, title, description, trashed]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 1024}
        trashed: {type: boolean}
    SkillInputSlot:
      type: object
      additionalProperties: false
      required: [alias, kind, required]
      properties:
        alias: {type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 64}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
        required: {type: boolean}
    SkillResource:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path: {type: string, maxLength: 160}
        content: {type: string, maxLength: 8000}
        contentHash: {type: string}
    SkillDraftAsset:
      type: object
      additionalProperties: false
      required: [alias, usage, required, purpose]
      properties:
        alias: {type: string, maxLength: 64}
        libraryEntryId: {type: [string, "null"], format: uuid}
        expectedLibraryVersion: {type: [integer, "null"], format: int64, minimum: 0}
        sourceVersionId: {type: [string, "null"], format: uuid}
        sourceAlias: {type: [string, "null"]}
        usage: {type: string, enum: [GUIDE, PROVIDER_REFERENCE]}
        required: {type: boolean}
        purpose: {type: string, maxLength: 1024}
        contentHash: {type: [string, "null"]}
    SkillDraft:
      type: object
      additionalProperties: false
      required: [skillId, version, skillMd, outputKinds, inputSlots, resources, assets]
      properties:
        skillId: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        skillMd: {type: string, maxLength: 8000}
        outputKinds: {type: array, maxItems: 4, items: {$ref: "#/components/schemas/ArtifactKind"}}
        inputSlots: {type: array, maxItems: 14, items: {$ref: "#/components/schemas/SkillInputSlot"}}
        resources: {type: array, maxItems: 8, items: {$ref: "#/components/schemas/SkillResource"}}
        assets: {type: array, maxItems: 14, items: {$ref: "#/components/schemas/SkillDraftAsset"}}
    SaveSkillDraftRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, skillMd, outputKinds, inputSlots, resources, assets]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        skillMd: {type: string, maxLength: 8000}
        outputKinds: {type: array, maxItems: 4, items: {$ref: "#/components/schemas/ArtifactKind"}}
        inputSlots: {type: array, maxItems: 14, items: {$ref: "#/components/schemas/SkillInputSlot"}}
        resources: {type: array, maxItems: 8, items: {$ref: "#/components/schemas/SkillResource"}}
        assets: {type: array, maxItems: 14, items: {$ref: "#/components/schemas/SkillDraftAsset"}}
    SkillPublishedAsset:
      type: object
      additionalProperties: false
      required: [alias, kind, title, contentHash, usage, required, purpose]
      properties:
        alias: {type: string}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
        title: {type: string}
        contentHash: {type: string}
        usage: {type: string, enum: [GUIDE, PROVIDER_REFERENCE]}
        required: {type: boolean}
        purpose: {type: string}
        contentUrl: {type: string}
        thumbnailUrl: {type: string}
    SkillVersionSummary:
      type: object
      additionalProperties: false
      required: [id, skillId, versionNumber, name, description, bundleHash, createdAt]
      properties:
        id: {type: string, format: uuid}
        skillId: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        versionNumber: {type: integer, format: int64, minimum: 0}
        bundleHash: {type: string}
        createdAt: {type: string, format: date-time}
    SkillVersionList:
      type: array
      items: {$ref: "#/components/schemas/SkillVersionSummary"}
    SkillVersion:
      type: object
      additionalProperties: false
      required: [id, skillId, versionNumber, bundleHash, name, description, skillMd, outputKinds, inputSlots, resources, assets, createdAt]
      properties:
        id: {type: string, format: uuid}
        skillId: {type: string, format: uuid}
        versionNumber: {type: integer, format: int64, minimum: 0}
        bundleHash: {type: string}
        name: {type: string}
        description: {type: string}
        skillMd: {type: string, maxLength: 8000}
        outputKinds: {type: array, maxItems: 4, items: {$ref: "#/components/schemas/ArtifactKind"}}
        inputSlots: {type: array, maxItems: 14, items: {$ref: "#/components/schemas/SkillInputSlot"}}
        resources: {type: array, maxItems: 8, items: {$ref: "#/components/schemas/SkillResource"}}
        assets: {type: array, items: {$ref: "#/components/schemas/SkillPublishedAsset"}}
        createdAt: {type: string, format: date-time}
    PublishSkillRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftVersion, commandKey]
      properties:
        expectedDraftVersion: {type: integer, format: int64, minimum: 0}
        commandKey: {type: string, minLength: 1, maxLength: 200}
    CopySkillVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedDraftVersion]
      properties:
        expectedDraftVersion: {type: integer, format: int64, minimum: 0}
    CopySkillRequest:
      type: object
      additionalProperties: false
      required: [title, skillVersionId]
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        skillVersionId: {type: string, format: uuid}
    SkillOperation:
      type: object
      additionalProperties: false
      required: [id, skillId, status, resultVersionId, errorCode, errorDetail]
      properties:
        id: {type: string, format: uuid}
        skillId: {type: string, format: uuid}
        status: {type: string, enum: [ACCEPTED, ARCHIVING, SUCCEEDED, FAILED]}
        resultVersionId: {type: [string, "null"], format: uuid}
        errorCode: {type: [string, "null"]}
        errorDetail: {type: [string, "null"]}
    SkillMediaBytes:
      type: string
      format: binary
    AgentSkillBinding:
      type: object
      additionalProperties: false
      required: [agentVersion, skillId, skillVersionId]
      properties:
        agentVersion: {type: integer, format: int64, minimum: 0}
        skillId: {type: [string, "null"], format: uuid}
        skillVersionId: {type: [string, "null"], format: uuid}
    SaveAgentSkillBindingRequest:
      type: object
      additionalProperties: false
      required: [expectedAgentVersion, skillId, skillVersionId]
      properties:
        expectedAgentVersion: {type: integer, format: int64, minimum: 0}
        skillId: {type: [string, "null"], format: uuid}
        skillVersionId: {type: [string, "null"], format: uuid}
    InstallAgentSkillRequest:
      type: object
      additionalProperties: false
      required: [skillId, skillVersionId]
      properties:
        skillId: {type: string, format: uuid}
        skillVersionId: {type: string, format: uuid}
    SkillInstallation:
      type: object
      additionalProperties: false
      required: [id, status, skillId, skillVersionId, errorCode, errorDetail]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [ACCEPTED, PREPARING, SUCCEEDED, FAILED, CLEANING]}
        skillId: {type: string, format: uuid}
        skillVersionId: {type: string, format: uuid}
        errorCode: {type: [string, "null"]}
        errorDetail: {type: [string, "null"]}
    SkillRunInput:
      type: object
      additionalProperties: false
      required: [alias, artifactVersionId]
      properties:
        alias: {type: string, maxLength: 64}
        artifactVersionId: {type: string, format: uuid}
    SkillSelection:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: [DEFAULT, NONE, VERSION]}
        skillId: {type: string, format: uuid}
        skillVersionId: {type: string, format: uuid}
        inputs: {type: array, maxItems: 14, items: {$ref: "#/components/schemas/SkillRunInput"}}
    RunPreflightRequest:
      type: object
      additionalProperties: false
      required: [agentId]
      properties:
        agentId: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        skillSelection: {$ref: "#/components/schemas/SkillSelection"}
    RunSkillSummary:
      type: object
      additionalProperties: false
      required: [skillId, skillVersionId, title, versionNumber, bundleHash, inputSlots, resources, assets, installed]
      properties:
        skillId: {type: string, format: uuid}
        skillVersionId: {type: string, format: uuid}
        title: {type: string}
        versionNumber: {type: integer, format: int64, minimum: 0}
        bundleHash: {type: string}
        inputSlots: {type: array, items: {$ref: "#/components/schemas/SkillInputSlot"}}
        resources: {type: array, items: {$ref: "#/components/schemas/SkillResource"}}
        assets: {type: array, items: {$ref: "#/components/schemas/SkillPublishedAsset"}}
        installed: {type: boolean}
  responses:
    ValidationError:
      description: 请求参数无效
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unauthenticated:
      description: 未登录或凭据不正确
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: CSRF、初始化凭据或权限校验失败
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: 初始化或乐观版本冲突
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: 资源不存在或当前用户无权访问
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    RateLimited:
      description: 认证尝试次数过多
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    InternalError:
      description: 服务端错误
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ProviderFailure:
      description: 原 Provider 请求核对不可用或身份不匹配，任务仍为 UNKNOWN
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ObjectStorageFailure:
      description: 对象存储连接、权限或网络不可用；生成结果只重试归档，不重新生成
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unavailable:
      description: 部署凭证加密主密钥尚未配置
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ServiceStopping:
      description: 实例正在关闭，拒绝创建新的 Agent Run；稍后以新的请求重试
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  headers:
    ContentLanguage:
      description: 协商后的界面语言；不改变用户内容、枚举或错误码。
      schema: {type: string, enum: [en, zh, ru, ja]}
    VaryLanguage:
      description: 包含 Accept-Language，避免不同语言的响应共用缓存。
      schema: {type: string}
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 支持 en、zh、ru、ja 及其地区变体，按质量权重选择；缺失、不支持或无效时回退 zh。
      schema: {type: string}
      example: ru-RU, en;q=0.8
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CanvasItemId:
      name: canvasItemId
      in: path
      required: true
      schema: {type: string, format: uuid}
