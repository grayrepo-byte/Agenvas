  /api/v1/projects/{projectId}/artifacts/{artifactId}/image-operations:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - {$ref: "#/components/parameters/ArtifactId"}
    post:
      operationId: runImageOperation
      summary: 按图片功能设置固定来源并创建独立结果节点与图片处理任务
      description: 按 IMAGE_ 前缀功能绑定解析处理能力，核对 expectedFunctionVersion 和 expectedCapabilityVersion；不接受客户端选择能力。单图片输入的 RunningHub 契约固定来源槽、冻结普通参数及完整契约；同键重放原任务且不读取新设置。派生结果节点使用空白媒体草稿，不继承来源提示词、参数、能力或图片输入；操作输入固定在任务及结果来源中。节点标题为来源节点当前标题加「 · 操作名称」，超长时截短来源部分以保留操作后缀；完成或重放不覆盖后续改名。THREE_VIEW 首次受理按类型读取统一管理的内置功能提示词，追加可选主体说明，冻结最终正文及 promptKey/promptVersion；修改管理配置只影响新命令，同键重放及在途任务保留原输入。
      tags: [Tasks]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunImageOperationRequest"}
      responses:
        "200":
          description: 已受理并创建结果节点，或按相同幂等键返回原任务
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/projects/{projectId}/artifacts/{artifactId}/video-operations:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
      - {$ref: "#/components/parameters/ProjectId"}
      - {$ref: "#/components/parameters/ArtifactId"}
    post:
      operationId: runVideoOperation
      summary: 按功能设置固定来源视频并创建独立处理结果节点与任务
      description: 深度视频和视频高清派生同一视频产物的独立节点；音频分离创建独立音频产物/节点和来源视频产物的无声视频派生节点，同一任务提交两个结果。所有结果使用空白草稿及可删除派生线，来源选择不变。固定功能设置版本、能力版本、来源视频版本及参数；同键异参冲突。视频高清只执行管理员绑定的兼容 AI 能力。本地深度输出最长边 518px、12fps、无音轨的相对深度视频；本地音频分离读取第一音轨为双声道 48kHz PCM WAV，并直接复制原视频流、移除音轨为无声 MP4；云端音频输出也配套本地无声视频。两个目标独立核对选择 epoch/草稿版本，目标删除不重建，归档重试不重新生成。两类本地输入限 30 秒、200MiB、3840×2160 像素数。RunningHub 使用已发布的单视频输入契约，不接受任意工作流或请求。
      tags: [Tasks]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RunVideoOperationRequest"}
      responses:
        "200":
          description: 已受理或相同幂等键的原任务
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}
  /api/v1/settings/media-functions:
    parameters:
      - {$ref: "#/components/parameters/AcceptLanguage"}
    get:
      operationId: listMediaFunctions
      summary: 查询图片与视频工具功能设置（独立于媒体生成默认模型）
      tags: [Settings]
      responses:
        "200":
