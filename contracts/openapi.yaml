        operation:
          type: string
          enum: [SMART_EDIT, RELIGHT, OUTPAINT, THREE_VIEW, LAYER_SPLIT,
            EXPRESSION_EDIT, REMOVE_BACKGROUND, OBJECT_REMOVE, VIEW_ANGLE,
            DEPTH_MAP, UPSCALE, CROP, ROTATE, FLIP_HORIZONTAL, FLIP_VERTICAL]
        instruction: {type: [string, "null"], maxLength: 4000}
        capabilityId: {type: [string, "null"], format: uuid}
        referenceVersionIds:
          type: array
          maxItems: 15
          uniqueItems: true
          items: {type: string, format: uuid}
        maskAssetId: {type: [string, "null"], format: uuid}
        parameters: {$ref: "#/components/schemas/ImageOperationParameters"}
    ImageOperationParameters:
      type: object
      additionalProperties: false
      properties:
        scale: {type: integer, enum: [2, 4]}
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        width: {type: number, exclusiveMinimum: 0, maximum: 1}
        height: {type: number, exclusiveMinimum: 0, maximum: 1}
        quarterTurns: {type: integer, enum: [1, 2, 3]}
        aspectRatio: {type: string, enum: ["1:1", "2:3", "3:2", "9:16", "16:9", "3:4", "4:3", "21:9"]}
        threeViewType: {type: string, enum: [CHARACTER, FACE, PROP, SCENE_GRID]}
        lightingPreset:
          type: string
          enum: [GOLDEN_HOUR, BLUE_HOUR, OVERCAST_SOFT, MOONLIGHT, SOFT_STUDIO, NEON_NIGHT]
        brightness: {type: integer, minimum: -100, maximum: 100}
        colorTemperature: {type: integer, minimum: 2000, maximum: 10000}
        lightX: {type: number, minimum: 0, maximum: 1}
        lightY: {type: number, minimum: 0, maximum: 1}
        layerTarget: {type: string, enum: [FOREGROUND, BACKGROUND]}
        viewAngle:
          type: string
          enum: [FRONT, LEFT_THREE_QUARTER, RIGHT_THREE_QUARTER, LEFT_PROFILE,
            RIGHT_PROFILE, HIGH_ANGLE, LOW_ANGLE, BACK]
    RunTextGenerationRequest:
      type: object
      additionalProperties: false
      required: [prompt, expectedArtifactVersion, expectedCurrentVersionId]
      properties:
        prompt: {type: string, minLength: 1, maxLength: 20000}
        expectedArtifactVersion: {type: integer, format: int64, minimum: 0}
        expectedCurrentVersionId: {type: string, format: uuid}
    DirectMediaQueueStatus:
      type: object
      additionalProperties: false
      required: [waitingAhead, reason]
      properties:
        waitingAhead: {type: integer, format: int64, minimum: 0}
        reason:
          type: string
          enum: [NOT_QUEUED, WAITING_WORKER]
    MediaDraft:
      type: object
      additionalProperties: false
      required: [projectId, canvasItemId, prompt, parameters, durationSeconds, capabilityId,
        videoInputMode, mediaInputs, mentions, displayMode, version, createdAt, updatedAt]
      properties:
        projectId: {type: string, format: uuid}
        canvasItemId: {type: string, format: uuid}
        prompt: {type: string, maxLength: 20000}
        parameters: {$ref: "#/components/schemas/ImageGenerationParameters"}
        durationSeconds: {type: [integer, "null"], minimum: 1, maximum: 60, description: "RunningHub 的具名时长来源支持 1–60 整数秒；其他适配器仍按各自较小范围校验。未声明时长字段的 RunningHub 视频可以为 null。"}
        capabilityId: {type: [string, "null"], format: uuid}
        videoInputMode:
          oneOf:
            - {$ref: "#/components/schemas/VideoInputMode"}
            - {type: "null"}
        mediaInputs:
          type: array
          items: {$ref: "#/components/schemas/MediaInput"}
        mentions:
          type: array
          items: {$ref: "#/components/schemas/PromptMediaMention"}
        displayMode: {type: string, enum: [DRAFT, RESULT]}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AudioGenerationParameters:
      type: object
      additionalProperties: false
      properties:
        speaker: {type: string, pattern: "^[A-Za-z0-9_-]{0,120}$"}
        speechRate: {type: integer, minimum: -50, maximum: 100}
        loudnessRate: {type: integer, minimum: -50, maximum: 100}
        pitchRate: {type: integer, minimum: -12, maximum: 12}
    ImageGenerationParameters:
      type: object
      additionalProperties: false
      description: 媒体草稿的原子生成参数；图片使用图片字段，视频使用 aspectRatio 和 AutoDL 专用 videoResolution，音频使用 speaker 和 speechRate。缺省字段由服务端按兼容默认值补齐并在 Task 中冻结。
      properties:
        dynamicValues:
          type: object
          maxProperties: 64
          additionalProperties: {$ref: "#/components/schemas/RunningHubScalar"}
          description: RunningHub only. Named media values are exact version UUIDs matched against mediaInputs; arbitrary URLs are rejected.
        speaker: {type: string, pattern: "^[A-Za-z0-9_-]{0,120}$"}
        speechRate: {type: integer, minimum: -50, maximum: 100}
        loudnessRate: {type: integer, minimum: -50, maximum: 100}
        pitchRate: {type: integer, minimum: -12, maximum: 12}
        aspectRatio: {type: string, enum: [AUTO, "1:1", "2:3", "3:2", "9:16", "16:9", "3:4", "4:3", "21:9"]}
        videoResolution: {type: string, pattern: '^[1-9][0-9]{2,3}p$', description: "AutoDL only; a published resolution tier. Omitted uses the capability default. Frozen into accepted tasks."}
        resolution: {type: string, enum: [1K, 2K, 4K]}
        quality: {type: string, enum: [low, medium, high]}
        transparentBackground: {type: boolean}
        generationCount: {type: integer, enum: [1, 2, 4]}
    VideoInputMode:
      type: string
      enum: [TEXT, START_END, GENERAL_REFERENCE]
    MediaInputRole:
      type: string
      enum: [REFERENCE, START_FRAME, END_FRAME, AUDIO_REFERENCE, VIDEO_REFERENCE]
    SaveMediaInput:
      type: object
      additionalProperties: false
      required: [versionId, role, color]
      properties:
        versionId: {type: string, format: uuid}
        role: {$ref: "#/components/schemas/MediaInputRole"}
        color: {type: string, pattern: "^#[0-9A-F]{6}$"}
    MediaInputSource:
      type: object
      additionalProperties: false
      required: [id, type, connectionId]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [MANUAL, CONNECTION]}
        connectionId: {type: [string, "null"], format: uuid}
    MediaInput:
      type: object
      additionalProperties: false
      required: [versionId, artifactId, role, order, color, sources]
      properties:
        versionId: {type: string, format: uuid}
        artifactId: {type: string, format: uuid}
        role: {$ref: "#/components/schemas/MediaInputRole"}
        order: {type: integer, minimum: 0}
        color: {type: string, pattern: "^#[0-9A-F]{6}$"}
        sources:
          type: array
          items: {$ref: "#/components/schemas/MediaInputSource"}
    PromptMediaMention:
      type: object
      additionalProperties: false
      required: [versionId, role]
      properties:
        versionId: {type: string, format: uuid}
        role: {$ref: "#/components/schemas/MediaInputRole"}
    CanvasConnection:
      type: object
      additionalProperties: false
      required: [id, projectId, sourceCanvasItemId, targetCanvasItemId, relationType,
        sourceArtifactVersionId, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        sourceCanvasItemId: {type: string, format: uuid}
        targetCanvasItemId: {type: string, format: uuid}
        relationType: {type: string, enum: [MEDIA_INPUT, AGENT_IMAGE_INPUT, MEDIA_DERIVATION]}
        sourceArtifactVersionId: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CanvasConnectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CanvasConnection"}}
    CreateCanvasConnectionRequest:
      type: object
      additionalProperties: false
      required: [sourceCanvasItemId, targetCanvasItemId, sourceVersionId, relationType]
      properties:
        sourceCanvasItemId: {type: string, format: uuid}
        targetCanvasItemId: {type: string, format: uuid}
        sourceVersionId: {type: string, format: uuid}
        relationType: {type: string, enum: [MEDIA_INPUT, AGENT_IMAGE_INPUT]}
        expectedTargetDraftVersion: {type: integer, format: int64, minimum: 0}
        expectedTargetAgentVersion: {type: integer, format: int64, minimum: 0}
    DisconnectCanvasConnectionRequest:
      type: object
      additionalProperties: false
      properties:
        expectedTargetDraftVersion: {type: integer, format: int64, minimum: 0}
        expectedTargetAgentVersion: {type: integer, format: int64, minimum: 0}
    CanvasConnectionResult:
      type: object
      additionalProperties: false
      required: [connection, draft, agent]
      properties:
        connection: {$ref: "#/components/schemas/CanvasConnection"}
        draft:
          oneOf:
            - {$ref: "#/components/schemas/MediaDraft"}
            - {type: "null"}
        agent:
          oneOf:
            - {$ref: "#/components/schemas/Agent"}
            - {type: "null"}
    DuplicateCanvasItemRequest:
      type: object
      additionalProperties: false
      required: [targetItemId, expectedSourceVersion, expectedSourceDraftVersion,
        x, y, width, height, zIndex]
      properties:
        targetItemId: {type: string, format: uuid}
        expectedSourceVersion: {type: integer, format: int64, minimum: 0}
        expectedSourceDraftVersion: {type: integer, format: int64, minimum: 0}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
    DuplicateCanvasItemResponse:
      type: object
      additionalProperties: false
      required: [item, draft]
      properties:
        item: {$ref: "#/components/schemas/CanvasItem"}
        draft: {$ref: "#/components/schemas/MediaDraft"}
    ReviseArtifactRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, content]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        title: {type: string, minLength: 1, maxLength: 160}
        content: {$ref: "#/components/schemas/WritableArtifactContent"}
    SelectArtifactVersionRequest:
      type: object
      additionalProperties: false
      required: [versionId, expectedVersion]
      properties:
        versionId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    SelectMediaVersionRequest:
      type: object
      additionalProperties: false
      required: [versionId, expectedVersion]
      properties:
        versionId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    UploadCanvasItemVersionRequest:
      type: object
      additionalProperties: false
      required: [targetItemId, expectedVersion, content]
      properties:
        targetItemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        purpose:
          type: string
          enum: [UPLOAD, BRUSH_MARKUP]
          description: 不传时为 UPLOAD。BRUSH_MARKUP 直接保存客户端合成图片，不调用模型或创建生成任务；必须固定来源图片版本并派生独立节点。
        sourceVersionId:
          type: [string, "null"]
          format: uuid
          description: BRUSH_MARKUP 必填，必须等于来源节点当前选用图片版本；普通上传不传。
        content: {$ref: "#/components/schemas/WritableArtifactContent"}
    ArtifactInputReference:
      type: object
      additionalProperties: false
      required: [versionId, role, order, kind]
      properties:
        versionId: {type: string, format: uuid}
        role: {type: string, minLength: 1, maxLength: 64}
        order: {type: integer, minimum: 0}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
    ArtifactVersion:
      type: object
      additionalProperties: false
      required: [id, versionNo, schemaVersion, content, inputReferences, createdByKind, createdAt]
      properties:
        id: {type: string, format: uuid}
        versionNo: {type: integer, minimum: 1}
        schemaVersion: {type: integer, enum: [1, 2]}
        baseVersionId: {type: [string, "null"], format: uuid}
        frozenInput:
          oneOf:
            - {type: object, additionalProperties: true}
            - {type: "null"}
        content: {$ref: "#/components/schemas/ArtifactContent"}
        inputReferences:
          type: array
          items: {$ref: "#/components/schemas/ArtifactInputReference"}
        createdByKind: {type: string, enum: [USER, AGENT, TASK]}
        runId: {type: [string, "null"], format: uuid}
        createdAt: {type: string, format: date-time}
    Artifact:
      type: object
      additionalProperties: false
      required: [id, projectId, kind, title, resourceDefaultVersionId, version, createdAt, updatedAt, resourceDefaultVersion]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
        title: {type: string, minLength: 1, maxLength: 160}
        resourceDefaultVersionId: {type: [string, "null"], format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        resourceDefaultVersion:
          oneOf:
            - {$ref: "#/components/schemas/ArtifactVersion"}
            - {type: "null"}
    ArtifactVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ArtifactVersion"}
    ArtifactList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Artifact"}
    AgentBindingRequest:
      type: object
      additionalProperties: false
      required: [artifactId, selectedVersionId]
      properties:
        artifactId: {type: string, format: uuid}
        selectedVersionId: {type: string, format: uuid}
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name, instruction, bindings]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        instruction: {type: string, minLength: 1, maxLength: 8000}
        bindings:
          type: array
          maxItems: 40
          items: {$ref: "#/components/schemas/AgentBindingRequest"}
    UpdateAgentRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, name, instruction, bindings]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 120}
        instruction: {type: string, minLength: 1, maxLength: 8000}
        bindings:
          type: array
          maxItems: 40
          items: {$ref: "#/components/schemas/AgentBindingRequest"}
    AgentBinding:
      type: object
      additionalProperties: false
      required: [id, artifactId, selectedVersionId, bindingType]
      properties:
        id: {type: string, format: uuid}
        artifactId: {type: string, format: uuid}
        selectedVersionId: {type: string, format: uuid}
        bindingType: {type: string, const: INPUT}
    Agent:
      type: object
      additionalProperties: false
      required: [id, projectId, profileKey, profileVersion, name, instruction, outputGroupId, version, createdAt, updatedAt, bindings]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        profileKey: {type: string, const: creator}
        profileVersion: {type: integer, minimum: 1}
        name: {type: string}
        instruction: {type: string}
        outputGroupId: {type: string, format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        bindings:
          type: array
          items: {$ref: "#/components/schemas/AgentBinding"}
    AgentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Agent"}
    AgentConversation:
      type: object
      additionalProperties: false
      required: [id, projectId, agentInstanceId, title, version, turnCount, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        agentInstanceId: {type: string, format: uuid}
        title: {type: string}
        version: {type: integer, format: int64, minimum: 0}
        turnCount: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AgentConversationList:
      type: object
      additionalProperties: false
      required: [items, currentConversationId]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AgentConversation"}
        nextCursor: {type: [string, "null"]}
        currentConversationId: {type: [string, "null"], format: uuid}
    AgentRunStatus:
      type: string
      enum: [QUEUED, RUNNING, WAITING_TASKS, BLOCKED, CANCEL_REQUESTED, CANCELED, FAILED, SUCCEEDED]
      description: WAITING_TASKS 同时表示等待媒体审批或已批准媒体任务；审批详情通过 media-approvals 接口读取。
    AgentMediaApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, SUCCEEDED, FAILED, REJECTED, EXPIRED, CANCELED]
      description: UNKNOWN 媒体任务以 FAILED 审批结果通知 Agent，原 Task 仍保留 UNKNOWN，且不会自动重提。
    AgentMediaApprovalDecisionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, decision]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
        decision: {type: string, enum: [APPROVE, REJECT]}
    AgentMediaApprovalOutput:
      type: object
      additionalProperties: false
      required: [kind, title, artifactId, canvasItemId, draftVersion, preview]
      properties:
        kind: {type: string, enum: [IMAGE, VIDEO, AUDIO]}
        title: {type: string}
        artifactId: {type: string, format: uuid}
        canvasItemId: {type: string, format: uuid}
        draftVersion: {type: integer, format: int64, minimum: 0}
        preview:
          type: object
          additionalProperties: true
          description: 固定提示词、参数、能力、mediaInputs 精确素材版本、视频 videoInputMode 及估算费用/费用未知的安全预检摘要；不返回 endpoint、Key 或签名下载地址。
    AgentMediaApproval:
      type: object
      additionalProperties: false
      required: [id, projectId, runId, operationId, status, version, outputs, taskIds, result, createdAt, expiresAt, executionDeadline]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        operationId: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/AgentMediaApprovalStatus"}
        version: {type: integer, format: int64, minimum: 0}
        outputs:
          type: array
          minItems: 1
          maxItems: 6
          items: {$ref: "#/components/schemas/AgentMediaApprovalOutput"}
        taskIds:
          type: array
          items: {type: string, format: uuid}
          description: 批准后受理的持久媒体任务；批准之前为空。
        result:
          oneOf:
            - {type: object, additionalProperties: true}
            - {type: "null"}
          description: 终态批次结果，包括可验证的输出和逐任务状态；等待时为空，不包含私有推理或凭据。
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, description: 创建后 24 小时的审批截止时间。}
        executionDeadline: {type: [string, "null"], format: date-time, description: 批准后 24 小时的执行截止时间；批准前为空。}
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [agentId, instruction]
      properties:
        agentId: {type: string, format: uuid}
        conversationId:
          type: string
          format: uuid
          description: 必须属于此项目与 Agent；缺省使用当前会话，没有则同事务创建。
        expectedConversationVersion:
          type: integer
          format: int64
          minimum: 0
          description: 运行前预览的会话历史版本；已有新消息时返回 CONVERSATION_VERSION_CONFLICT。
        instruction: {type: string, minLength: 1, maxLength: 20000}
        expectedAgentVersion: {type: integer, format: int64, minimum: 0}
        expectedModelConfigSource:
          type: string
          maxLength: 80
          description: 运行前预览中的模型配置来源；须与 expectedModelConfigVersion 同时提交
        expectedModelConfigVersion:
          type: integer
          minimum: 1
          description: 运行前预览中的模型配置版本；配置变化时创建返回 409
        expectedSystemPromptVersion:
          type: integer
          minimum: 1
          description: 运行前预览中的系统提示词版本；规则变化时创建返回 409
        selectedItemIds:
          type: array
          maxItems: 20
          uniqueItems: true
          description: 启动 Run 时选中的同项目画布卡片；仅供上下文指向，不授予工具修改权限
          items: {type: string, format: uuid}
    RunContextSnapshot:
      type: object
      additionalProperties: true
      required: [agentId, agentVersion, profileKey, profileVersion, outputGroupId, bindings]
      properties:
        agentId: {type: string, format: uuid}
        agentVersion: {type: integer, format: int64, minimum: 0}
        profileKey: {type: string}
        profileVersion: {type: integer, minimum: 1}
        outputGroupId: {type: string, format: uuid}
        conversationId:
          type: string
          format: uuid
          description: 新 Run 冻结的会话作用域；升级前旧快照保持原值，可能没有此字段
        conversationHistoryThroughTurn:
          type: integer
          format: int64
          minimum: 0
          description: 创建 Run 前已受理的会话消息水位；仅终态历史可进入记忆
        conversationMemory: {$ref: "#/components/schemas/ConversationMemory"}
        bindings:
          type: array
          items: {$ref: "#/components/schemas/RunInputSnapshot"}
        selection:
          type: array
          maxItems: 20
          description: 创建 Run 时由服务端核对并固定的画布选择；不扩大工具权限
          items:
            type: object
            additionalProperties: false
            required: [itemId, subjectType, subjectId]
            properties:
              itemId: {type: string, format: uuid}
              subjectType: {type: string, enum: [ARTIFACT, AGENT]}
              subjectId: {type: string, format: uuid}
              versionId: {type: string, format: uuid}
              kind: {$ref: "#/components/schemas/ArtifactKind"}
    ConversationMemory:
      type: object
      additionalProperties: false
      description: 创建 Run 时冻结的公开用户指令、assistant 回复与已提交业务动作摘要；不包含私有推理、原始协议、工具参数或凭证，也不授予额外权限
      required: [entries, truncated, priorRunCount]
      properties:
        entries:
          type: array
          maxItems: 20
          description: 按时间正序保留首轮及最近轮次；所有 content 合计最多 32000 个 Unicode 码点
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: {type: string, enum: [USER, ASSISTANT]}
              content: {type: string, maxLength: 32000}
        truncated: {type: boolean}
        priorRunCount: {type: integer, minimum: 0}
    RunInputSnapshot:
      type: object
      additionalProperties: false
      required: [artifactId, selectedVersionId, bindingType]
      properties:
        artifactId: {type: string, format: uuid}
        selectedVersionId: {type: string, format: uuid}
        bindingType: {type: string, const: INPUT}
        kind: {$ref: "#/components/schemas/ArtifactKind"}
        title: {type: string}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        source: {type: string, const: CONVERSATION_OUTPUT}
    RunPreflightBinding:
      type: object
      additionalProperties: false
      required: [artifactId, selectedVersionId, artifactTitle, artifactKind]
      properties:
        artifactId: {type: string, format: uuid}
        selectedVersionId: {type: string, format: uuid}
        artifactTitle: {type: string}
        artifactKind: {$ref: "#/components/schemas/ArtifactKind"}
    RunPreflight:
      type: object
      additionalProperties: false
      required: [agentId, agentVersion, agentName, agentInstruction, bindings, modelAvailable, providerAdapter, modelId, toolCalling, policySnapshot, conversationId, conversationVersion, conversationTurnCount, inheritedBindingCount, memoryTruncated]
      properties:
        agentId: {type: string, format: uuid}
        agentVersion: {type: integer, format: int64, minimum: 0}
        agentName: {type: string}
        agentInstruction: {type: string}
        conversationId: {type: [string, "null"], format: uuid}
        conversationVersion: {type: [integer, "null"], format: int64, minimum: 0}
        conversationTurnCount: {type: integer, format: int64, minimum: 0}
        inheritedBindingCount: {type: integer, minimum: 0, maximum: 40}
        memoryTruncated: {type: boolean, description: 历史消息或继承产物超过本轮上下文预算，完整记录仍保留。}
        bindings:
          type: array
          items: {$ref: "#/components/schemas/RunPreflightBinding"}
        modelAvailable: {type: boolean}
        providerAdapter: {type: [string, "null"]}
        modelId: {type: [string, "null"]}
        toolCalling: {type: boolean}
        policySnapshot: {$ref: "#/components/schemas/RunPolicySnapshot"}
    RunPolicySnapshot:
      type: object
      additionalProperties: false
      description: >-
        New Run policies are schema v2 and pin systemPromptVersion=3. Historical v1
        snapshots lack this field and cannot safely start an uncheckpointed model turn.
      required: [schemaVersion, modelConfigSource, modelConfigVersion, maxModelTurns, maxToolExecutions]
      properties:
        schemaVersion: {type: integer, enum: [1, 2]}
        systemPromptVersion: {type: integer, enum: [1, 2, 3], description: New v2 snapshots pin version 3; historical versions 1/2 retain their original rules; absent on historical v1 snapshots.}
        modelConfigSource: {type: string}
        modelConfigVersion: {type: integer, minimum: 1}
        maxModelTurns: {type: integer, minimum: 1}
        maxToolExecutions: {type: integer, minimum: 1}
    AgentRun:
      type: object
      additionalProperties: false
      required: [id, projectId, agentInstanceId, conversationId, conversationTurn, status, instruction, contextSnapshot, policySnapshot, profileVersion, nextStepIndex, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        agentInstanceId: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        conversationTurn: {type: integer, format: int64, minimum: 1}
        status: {$ref: "#/components/schemas/AgentRunStatus"}
        instruction: {type: string}
        contextSnapshot: {$ref: "#/components/schemas/RunContextSnapshot"}
        policySnapshot: {$ref: "#/components/schemas/RunPolicySnapshot"}
        profileVersion: {type: integer, minimum: 1}
        nextStepIndex: {type: integer, minimum: 0}
        version: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    AgentRunSummary:
      type: object
      additionalProperties: false
      required: [id, agentInstanceId, conversationId, conversationTurn, status, instruction, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        agentInstanceId: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        conversationTurn: {type: integer, format: int64, minimum: 1}
        status: {$ref: "#/components/schemas/AgentRunStatus"}
        instruction: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    AgentRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AgentRunSummary"}
        nextCursor: {type: [string, "null"]}
    RunAction:
      type: object
      additionalProperties: false
      required: [id, stepIndex, toolName, status, summary, completedAt]
      properties:
        id: {type: string, format: uuid}
        stepIndex: {type: integer, minimum: 0}
        toolName: {type: string}
        status:
          type: string
          enum: [SUCCEEDED]
          description: 动作提交时的业务结果状态；不是当前计划、媒体任务或工具账本状态。
        summary: {type: string, description: 服务端生成的可公开动作摘要。}
        completedAt: {type: string, format: date-time}
    MediaCapabilityBinding:
      type: object
      additionalProperties: false
      required: [connectionId, connectionVersion, capabilityId, capabilityVersion, adapterId, mappingSha256]
      properties:
        connectionId: {type: string, format: uuid}
        connectionVersion: {type: integer, minimum: 1}
        capabilityId: {type: string, format: uuid}
        capabilityVersion: {type: integer, minimum: 1}
        adapterId: {type: string}
        mappingSha256: {type: string, pattern: "^[0-9a-f]{64}$"}
    MediaCapabilityCandidate:
      type: object
      additionalProperties: false
      required: [binding, connectionName, capabilityName, kind, minimumSeconds,
        maximumSeconds, realGenerationTested, settings]
      properties:
        binding: {$ref: "#/components/schemas/MediaCapabilityBinding"}
        connectionName: {type: string}
        capabilityName: {type: string}
        kind: {type: string, enum: [IMAGE_GENERATION, VIDEO_GENERATION, AUDIO_GENERATION]}
        minimumSeconds: {type: integer, minimum: 0}
        maximumSeconds: {type: integer, minimum: 0}
        realGenerationTested: {type: boolean}
        settings: {$ref: "#/components/schemas/FixedMediaAdapterSettings"}
    TaskKind:
      type: string
      enum: [AGENT_TURN, TEXT_GENERATION, IMAGE_GENERATION, VIDEO_GENERATION, AUDIO_GENERATION, ASSET_INGEST]
    TaskStatus:
      type: string
      enum: [PENDING, READY, RUNNING, SUBMITTING, WAITING_PROVIDER, UNKNOWN, BLOCKED, SUCCEEDED, FAILED, CANCELED]
    ManualUnknownAttemptRequest:
      type: object
      additionalProperties: false
      required: [expectedTaskVersion]
      properties:
        expectedTaskVersion: {type: integer, format: int64, minimum: 0}
    Task:
      type: object
      additionalProperties: false
      required: [id, projectId, runId, stepKey, kind, status, cancelRequested, input, attemptNo, nextActionAt, version, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        runId: {type: [string, "null"], format: uuid}
        stepKey: {type: string}
        kind: {$ref: "#/components/schemas/TaskKind"}
        status: {$ref: "#/components/schemas/TaskStatus"}
        cancelRequested: {type: boolean, description: "已要求停止本系统后续编排，不表示外部任务已停止或退款"}
        input: {type: object, additionalProperties: true}
        output:
          description: |
            AGENT_TURN 执行中的 assistantStream 为持久公开回答进度，结构为
            AssistantTurnStream；这不是已提交的工具响应。完整回合提交后
            assistantText 为最终公开文本。失败或取消保留 INTERRUPTED 文本。
          oneOf:
            - {type: object, additionalProperties: true}
            - {type: "null"}
        providerId: {type: [string, "null"], format: uuid}
        providerRequestId: {type: [string, "null"]}
        attemptNo: {type: integer, minimum: 1}
        nextActionAt: {type: string, format: date-time}
        version: {type: integer, format: int64, minimum: 0}
        errorCode: {type: [string, "null"]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, "null"], format: date-time}
    AssistantTurnStream:
      type: object
      additionalProperties: false
      required: [streamEpoch, chunkIndex, text, status]
      properties:
        streamEpoch: {type: integer, format: int64, minimum: 0, description: 任务本次租约身份；更高 epoch 重置旧文本。}
        chunkIndex: {type: integer, format: int64, minimum: 0, description: 本次流的已持久增量序号。}
        text: {type: string, description: 累计公开回答；不含私有推理或工具参数。}
        status: {type: string, enum: [STREAMING, COMPLETED, INTERRUPTED]}
    AgentTurnStreamEventPayload:
      type: object
      additionalProperties: false
      required: [runId, taskId, stepIndex, streamEpoch, chunkIndex]
      properties:
        runId: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        stepIndex: {type: integer, minimum: 0}
        streamEpoch: {type: integer, format: int64, minimum: 0}
        chunkIndex: {type: integer, format: int64, minimum: 0}
        textDelta: {type: string, description: 仅 delta 事件提供公开文本增量；completed 后重读已提交终稿。}
    CanvasSubjectType:
      type: string
      enum: [ARTIFACT, AGENT]
    CanvasItem:
      type: object
      additionalProperties: false
      required: [id, subjectType, subjectId, title, x, y, width, height, zIndex, locked, selectedVersionId, version, selectedVersion, artifact, agent]
      properties:
        id: {type: string, format: uuid}
        subjectType: {$ref: "#/components/schemas/CanvasSubjectType"}
        subjectId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
        locked: {type: boolean}
        selectedVersionId: {type: [string, "null"], format: uuid}
        version: {type: integer, format: int64, minimum: 0}
        selectedVersion:
          oneOf:
            - {$ref: "#/components/schemas/ArtifactVersion"}
            - {type: "null"}
        artifact:
          oneOf:
            - {$ref: "#/components/schemas/Artifact"}
            - {type: "null"}
        agent:
          oneOf:
            - {$ref: "#/components/schemas/Agent"}
            - {type: "null"}
    Canvas:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CanvasItem"}
    ProjectSnapshot:
      type: object
      additionalProperties: false
      required: [project, canvas, connections, agents, activeRun, activeTasks, unknownTasks, snapshotSeq]
      properties:
        project: {$ref: "#/components/schemas/Project"}
        canvas: {$ref: "#/components/schemas/Canvas"}
        connections:
          type: array
          items: {$ref: "#/components/schemas/CanvasConnection"}
        agents:
          type: array
          items: {$ref: "#/components/schemas/Agent"}
        activeRun:
          oneOf:
            - {$ref: "#/components/schemas/AgentRun"}
            - {type: "null"}
        activeTasks:
          type: array
          items: {$ref: "#/components/schemas/Task"}
        unknownTasks:
          type: array
          description: 最近 100 个未核对的外部提交，取消 Run 后仍可见
          items: {$ref: "#/components/schemas/Task"}
        snapshotSeq: {type: integer, format: int64, minimum: 0}
    ProjectEvent:
      type: object
      additionalProperties: false
      required: [projectId, seq, eventId, type, schemaVersion, aggregateId, aggregateVersion, payload, occurredAt]
      properties:
        projectId: {type: string, format: uuid}
        seq: {type: integer, format: int64, minimum: 1}
        eventId: {type: string, format: uuid}
        type: {type: string, minLength: 3, maxLength: 120}
        schemaVersion: {type: integer, minimum: 1}
        aggregateId: {type: string, format: uuid}
        aggregateVersion: {type: integer, format: int64, minimum: 0}
        payload: {type: object, additionalProperties: true}
        occurredAt: {type: string, format: date-time}
    PlaceArtifactCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, artifactId, x, y, width, height, zIndex]
      properties:
        type: {type: string, const: PLACE_ARTIFACT}
        itemId: {type: string, format: uuid}
        artifactId: {type: string, format: uuid}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
        locked: {type: boolean, default: false}
    PlaceAgentCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, agentId, x, y, width, height, zIndex]
      properties:
        type: {type: string, const: PLACE_AGENT}
        itemId: {type: string, format: uuid}
        agentId: {type: string, format: uuid}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
        locked: {type: boolean, default: false}
    UpdateCanvasItemTitleCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, expectedVersion, title]
      properties:
        type: {type: string, const: UPDATE_TITLE}
        itemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        title: {type: string, minLength: 1, maxLength: 160}
    UpdateLayoutCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, expectedVersion, x, y, width, height, zIndex]
      properties:
        type: {type: string, const: UPDATE_LAYOUT}
        itemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        x: {type: number, minimum: -1000000, maximum: 1000000}
        y: {type: number, minimum: -1000000, maximum: 1000000}
        width: {type: number, minimum: 120, maximum: 2000}
        height: {type: number, minimum: 80, maximum: 2000}
        zIndex: {type: integer, minimum: -1000, maximum: 1000}
        groupId: {type: [string, "null"], format: uuid}
    SetCanvasItemLockedCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, expectedVersion, locked]
      properties:
        type: {type: string, const: SET_LOCKED}
        itemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        locked: {type: boolean}
    RemoveCanvasItemCommand:
      type: object
      additionalProperties: false
      required: [type, itemId, expectedVersion]
      properties:
        type: {type: string, const: REMOVE}
        itemId: {type: string, format: uuid}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    CanvasCommand:
      oneOf:
        - {$ref: "#/components/schemas/PlaceArtifactCommand"}
        - {$ref: "#/components/schemas/PlaceAgentCommand"}
        - {$ref: "#/components/schemas/UpdateCanvasItemTitleCommand"}
        - {$ref: "#/components/schemas/UpdateLayoutCommand"}
        - {$ref: "#/components/schemas/SetCanvasItemLockedCommand"}
        - {$ref: "#/components/schemas/RemoveCanvasItemCommand"}
      discriminator:
        propertyName: type
        mapping:
          PLACE_ARTIFACT: "#/components/schemas/PlaceArtifactCommand"
          PLACE_AGENT: "#/components/schemas/PlaceAgentCommand"
          UPDATE_TITLE: "#/components/schemas/UpdateCanvasItemTitleCommand"
          UPDATE_LAYOUT: "#/components/schemas/UpdateLayoutCommand"
          SET_LOCKED: "#/components/schemas/SetCanvasItemLockedCommand"
          REMOVE: "#/components/schemas/RemoveCanvasItemCommand"
    CanvasCommandBatchRequest:
      type: object
      additionalProperties: false
      required: [commands]
      properties:
        commands:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/CanvasCommand"}
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, traceId, retryable]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {type: string}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        traceId: {type: string}
        retryable: {type: boolean}
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
  responses:
    ValidationError:
      description: 请求参数无效
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unauthenticated:
      description: 未登录或凭据不正确
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: CSRF、初始化凭据或权限校验失败
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: 初始化或乐观版本冲突
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: 资源不存在或当前用户无权访问
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    RateLimited:
      description: 认证尝试次数过多
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    InternalError:
      description: 服务端错误
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ProviderFailure:
      description: 原 Provider 请求核对不可用或身份不匹配，任务仍为 UNKNOWN
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ObjectStorageFailure:
      description: 对象存储连接、权限或网络不可用；生成结果只重试归档，不重新生成
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unavailable:
      description: 部署凭证加密主密钥尚未配置
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    ServiceStopping:
      description: 实例正在关闭，拒绝创建新的 Agent Run；稍后以新的请求重试
      headers:
        Content-Language: {$ref: "#/components/headers/ContentLanguage"}
        Vary: {$ref: "#/components/headers/VaryLanguage"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  headers:
    ContentLanguage:
      description: 协商后的界面语言；不改变用户内容、枚举或错误码。
      schema: {type: string, enum: [en, zh, ru, ja]}
    VaryLanguage:
      description: 包含 Accept-Language，避免不同语言的响应共用缓存。
      schema: {type: string}
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 支持 en、zh、ru、ja 及其地区变体，按质量权重选择；缺失、不支持或无效时回退 zh。
      schema: {type: string}
      example: ru-RU, en;q=0.8
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CanvasItemId:
      name: canvasItemId
      in: path
      required: true
      schema: {type: string, format: uuid}
