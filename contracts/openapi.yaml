    patch:
      operationId: updateProject
      summary: 乐观更新项目设置
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateProjectRequest"}
      responses:
        "200":
          description: 更新后的项目
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
