              schema:
                "$ref": "#/components/schemas/CharacterLibraryProfile"
        "400":
          description: "Invalid input"
        "401":
          description: "Authentication required"
        "404":
          description: "Resource unavailable"
        "409":
          description: "Version or command conflict"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
    put:
      operationId: "saveCharacterLibraryProfile"
      tags: ["CharacterLibrary"]
      responses:
        "200":
          description: "Owned character library result"
          content:
