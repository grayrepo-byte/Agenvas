name: agenvas

services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: agenvas
      POSTGRES_USER: agenvas
      POSTGRES_PASSWORD: ${AGENVAS_DB_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenvas -d agenvas"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
    environment:
      AGENVAS_DB_URL: jdbc:postgresql://postgres:5432/agenvas
      AGENVAS_DB_USER: agenvas
      AGENVAS_DB_PASSWORD: ${AGENVAS_DB_PASSWORD:-local-development-only}
      AGENVAS_PROVIDER_MODE: mock
      AGENVAS_SECURE_COOKIES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - asset-data:/opt/agenvas/data
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /opt/agenvas/tmp:size=256m,mode=1770,uid=100,gid=101
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
  asset-data:
