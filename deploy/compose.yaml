# Default self-hosted deployment. Use compose.dev.yaml for the Mock development stack.
name: agenvas

services:
  postgres:
    build:
      context: ..
      dockerfile: deploy/docker/postgres.Dockerfile
    image: agenvas-postgres:local
    environment:
      POSTGRES_DB: agenvas
      POSTGRES_USER: agenvas
      POSTGRES_PASSWORD: ${AGENVAS_DB_PASSWORD:?Set a unique AGENVAS_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenvas -d agenvas"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 仅绑定本机，供用本地客户端连库排查。server 走 Compose 内部网络，不依赖这个映射；
    # 默认 5432 在宿主机已被占用时，在 .env 里改 AGENVAS_DB_PORT。
    ports:
      - "127.0.0.1:${AGENVAS_DB_PORT:-5432}:5432"
    mem_limit: ${AGENVAS_POSTGRES_MEMORY_LIMIT:-768m}
    cpus: ${AGENVAS_POSTGRES_CPUS:-1.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
    environment:
      AGENVAS_DB_URL: jdbc:postgresql://postgres:5432/agenvas
      AGENVAS_DB_USER: agenvas
      AGENVAS_DB_PASSWORD: ${AGENVAS_DB_PASSWORD:?Set a unique AGENVAS_DB_PASSWORD in .env}
      AGENVAS_BOOTSTRAP_SECRET: ${AGENVAS_BOOTSTRAP_SECRET:?Set a unique AGENVAS_BOOTSTRAP_SECRET in .env}
      AGENVAS_LLM_MODE: ${AGENVAS_LLM_MODE:-configured}
      AGENVAS_LLM_SCHEDULER_ENABLED: ${AGENVAS_LLM_SCHEDULER_ENABLED:-true}
      AGENVAS_LLM_ALLOW_LOOPBACK_HTTP: ${AGENVAS_LLM_ALLOW_LOOPBACK_HTTP:-false}
      AGENVAS_CREDENTIAL_MASTER_KEY: ${AGENVAS_CREDENTIAL_MASTER_KEY:-}
      AGENVAS_CREDENTIAL_KEY_VERSION: ${AGENVAS_CREDENTIAL_KEY_VERSION:-1}
      AGENVAS_CREDENTIAL_PREVIOUS_KEYS: ${AGENVAS_CREDENTIAL_PREVIOUS_KEYS:-}
      AGENVAS_PROVIDER_MODE: ${AGENVAS_PROVIDER_MODE:-configured}
      AGENVAS_PROVIDER_CONFIG_VERSION: ${AGENVAS_PROVIDER_CONFIG_VERSION:-1}
      AGENVAS_COMFYUI_ENDPOINT: ${AGENVAS_COMFYUI_ENDPOINT:-}
      AGENVAS_COMFYUI_IMAGE_CHECKPOINT: ${AGENVAS_COMFYUI_IMAGE_CHECKPOINT:-}
      AGENVAS_COMFYUI_VIDEO_ENABLED: ${AGENVAS_COMFYUI_VIDEO_ENABLED:-false}
      AGENVAS_COMFYUI_VIDEO_DIFFUSION_MODEL: ${AGENVAS_COMFYUI_VIDEO_DIFFUSION_MODEL:-}
      AGENVAS_COMFYUI_VIDEO_TEXT_ENCODER: ${AGENVAS_COMFYUI_VIDEO_TEXT_ENCODER:-}
      AGENVAS_COMFYUI_VIDEO_VAE: ${AGENVAS_COMFYUI_VIDEO_VAE:-}
      AGENVAS_COMFYUI_VIDEO_CLIP_VISION: ${AGENVAS_COMFYUI_VIDEO_CLIP_VISION:-}
      AGENVAS_DEPTH_MODEL: ${AGENVAS_DEPTH_MODEL:-/opt/agenvas/models/depth-anything-v2-small-int8.onnx}
      AGENVAS_STORAGE_ROOT: /opt/agenvas/data/assets
      AGENVAS_EXPORT_SCHEDULER_ENABLED: ${AGENVAS_EXPORT_SCHEDULER_ENABLED:-true}
      AGENVAS_TASK_LEASE_DURATION: ${AGENVAS_TASK_LEASE_DURATION:-PT30M}
      AGENVAS_RECOVERY_MODE: ${AGENVAS_RECOVERY_MODE:-false}
      AGENVAS_SECURE_COOKIES: ${AGENVAS_SECURE_COOKIES:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - asset-data:/opt/agenvas/data
    ports:
      - "127.0.0.1:${AGENVAS_API_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /opt/agenvas/tmp:size=256m,mode=1770,uid=100,gid=101
    security_opt:
      - no-new-privileges:true
    mem_limit: ${AGENVAS_SERVER_MEMORY_LIMIT:-1536m}
    cpus: ${AGENVAS_SERVER_CPUS:-2.0}
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGENVAS_WEB_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    mem_limit: ${AGENVAS_WEB_MEMORY_LIMIT:-256m}
    cpus: ${AGENVAS_WEB_CPUS:-0.5}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  postgres-data:
  asset-data:
