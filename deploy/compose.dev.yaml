# Mock development; build the application from this checkout.
# Edit runtime settings, ports, volumes, and resource limits here for your deployment.
name: agenvas-dev

services:
  postgres:
    image: postgres:17.11-alpine
    pull_policy: missing
    environment:
      POSTGRES_DB: agenvas
      POSTGRES_USER: agenvas
      POSTGRES_PASSWORD_FILE: /run/agenvas/credentials/installation/database-password
      # Leave empty for automatic generation. Import existing secrets only in a private copy.
      AGENVAS_DB_PASSWORD: ""
      AGENVAS_CREDENTIAL_MASTER_KEY: ""
    # First start generates persistent secrets; subsequent starts reuse them.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        set -eu
        umask 077
        credentials_dir=/run/agenvas/credentials
        bundle="$$credentials_dir/installation"
        secret_bytes=32
        server_uid=100
        server_gid=101
        fail() { printf '%s\n' "$$1" >&2; exit 1; }
        validate_secrets() {
          [ -n "$$db_password" ] && [ "$${#db_password}" -le 512 ] || fail 'Invalid database password.'
          [ "$$(printf '%s' "$$db_password$$master_key" | wc -l)" -eq 0 ] || fail 'Secrets must not contain newlines.'
          if printf '%s' "$$db_password$$master_key" | LC_ALL=C grep -q '[[:cntrl:]]'; then
            fail 'Secrets must not contain control characters.'
          fi
          printf '%s' "$$master_key" | LC_ALL=C grep -Eq '^[A-Za-z0-9+/]{43}=$$' || fail 'Master key must be Base64 encoding of 32 bytes.'
          [ "$$(printf '%s' "$$master_key" | base64 -d | wc -c)" -eq "$$secret_bytes" ] || fail 'Master key must decode to 32 bytes.'
        }
        check_override() {
          [ -z "$$2" ] || [ "$$2" = "$$3" ] || fail "$$1 differs from the saved installation secret. Restore the original settings."
        }
        mkdir -p "$$credentials_dir"
        if [ ! -e "$$bundle" ]; then
          # Never invent a new encryption key/password for an existing database.
          if [ -s "$$PGDATA/PG_VERSION" ] && { [ -z "$$AGENVAS_DB_PASSWORD" ] || [ -z "$$AGENVAS_CREDENTIAL_MASTER_KEY" ]; }; then
            fail 'Existing database has no installation secrets. Restore credentials-data or import both original AGENVAS secrets through a private Compose configuration.'
          fi
          db_password="$$AGENVAS_DB_PASSWORD"
          master_key="$$AGENVAS_CREDENTIAL_MASTER_KEY"
          [ -n "$$db_password" ] || db_password=$$(od -An -N "$$secret_bytes" -tx1 /dev/urandom | tr -d ' \n')
          [ -n "$$master_key" ] || master_key=$$(head -c "$$secret_bytes" /dev/urandom | base64 | tr -d '\n')
          validate_secrets
          stage=$$(mktemp -d "$$credentials_dir/.installation.XXXXXX")
          trap 'rm -rf "$$stage"' EXIT
          printf '%s\n' "$$db_password" > "$$stage/database-password"
          printf '%s\n' "$$master_key" > "$$stage/credential-master-key"
          chown "$$server_uid:$$server_gid" "$$stage" "$$stage"/*
          chmod 700 "$$stage"
          chmod 600 "$$stage"/*
          # Publish the complete bundle together; refuse to replace another bundle.
          mv -T "$$stage" "$$bundle"
          trap - EXIT
        fi
        for secret_file in database-password credential-master-key; do
          [ -f "$$bundle/$$secret_file" ] && [ ! -L "$$bundle/$$secret_file" ] && [ -s "$$bundle/$$secret_file" ] || fail 'Incomplete installation secrets. Restore credentials-data; do not regenerate keys.'
        done
        db_password=$$(cat "$$bundle/database-password")
        master_key=$$(cat "$$bundle/credential-master-key")
        validate_secrets
        check_override AGENVAS_DB_PASSWORD "$$AGENVAS_DB_PASSWORD" "$$db_password"
        check_override AGENVAS_CREDENTIAL_MASTER_KEY "$$AGENVAS_CREDENTIAL_MASTER_KEY" "$$master_key"
        chown "$$server_uid:$$server_gid" "$$credentials_dir" "$$bundle" "$$bundle"/*
        chmod 700 "$$credentials_dir" "$$bundle"
        chmod 600 "$$bundle"/*
        unset AGENVAS_DB_PASSWORD AGENVAS_CREDENTIAL_MASTER_KEY db_password master_key
        printf '%s\n' 'Installation database and encryption secrets are persisted in credentials-data.'
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - agenvas-postgres
    command: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenvas -d agenvas"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - credentials-data:/run/agenvas/credentials
    # 仅绑定本机，供用本地客户端连库排查。server 走 Compose 内部网络，不依赖这个映射；
    # 默认 5432 在宿主机已被占用时，直接修改下方宿主机端口。
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
    image: agenvas-server:local
    pull_policy: build
    environment:
      AGENVAS_DB_URL: jdbc:postgresql://postgres:5432/agenvas
      AGENVAS_DB_USER: agenvas
      AGENVAS_DB_PASSWORD_FILE: /run/agenvas/credentials/installation/database-password
      AGENVAS_LLM_MODE: mock
      AGENVAS_LLM_SCHEDULER_ENABLED: "true"
      AGENVAS_LLM_ALLOW_LOOPBACK_HTTP: "false"
      AGENVAS_CREDENTIAL_MASTER_KEY_FILE: /run/agenvas/credentials/installation/credential-master-key
      AGENVAS_CREDENTIAL_KEY_VERSION: "1"
      AGENVAS_CREDENTIAL_PREVIOUS_KEYS: ""
      AGENVAS_PROVIDER_MODE: mock
      AGENVAS_DEPTH_MODEL: /opt/agenvas/models/depth-anything-v2-small-int8.onnx
      AGENVAS_STORAGE_ROOT: /opt/agenvas/data/assets
      AGENVAS_TASK_LEASE_DURATION: PT30M
      AGENVAS_RECOVERY_MODE: "false"
      AGENVAS_SECURE_COOKIES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - asset-data:/opt/agenvas/data
      - credentials-data:/run/agenvas/credentials:ro
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /opt/agenvas/tmp:size=256m,mode=1770,uid=100,gid=101
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 2.0
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    image: agenvas-web:local
    pull_policy: build
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1770,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  postgres-data:
  asset-data:
  credentials-data:
