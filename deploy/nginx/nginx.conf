pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream agenvas_server {
        server server:8080;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location ~ ^/api/v1/projects/[^/]+/events$ {
            proxy_pass http://agenvas_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 75s;
            add_header X-Accel-Buffering no;
        }

        # Media upload limits are still enforced by actual decoder validation in the backend.
        location ~ ^/api/v1/projects/[^/]+/assets(?:/audio|/video)?$ {
            client_max_body_size 501m;
            proxy_read_timeout 30m;
            proxy_request_buffering off;
            proxy_pass http://agenvas_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Authenticated Range streams must not accumulate private large videos in proxy temp files.
        location ~ ^/api/v1/projects/[^/]+/assets/[^/]+/(?:content|thumbnail)$ {
            proxy_pass http://agenvas_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 75s;
        }

        location /api/ {
            proxy_pass http://agenvas_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
